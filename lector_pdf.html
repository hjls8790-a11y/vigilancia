<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Guardia | Lector de Manuales</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a2a3a; 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
        }

        .header {
            text-align: center;
            padding: 15px;
            background: #111d28;
            border-bottom: 2px solid #3498db;
        }

        .header h1 {
            font-size: 22px;
            color: #3498db;
            margin: 0;
            text-transform: uppercase;
        }

        /* Contenedor principal dividido en dos columnas */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Barra lateral para la lista de archivos */
        .sidebar {
            width: 300px;
            background: #23374d;
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Área del visor de PDF */
        .viewer-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a2a3a;
        }

        #pdfIframe {
            width: 100%;
            height: 100%;
            border: 2px solid #3498db;
            border-radius: 8px;
            background: #fff;
            display: none; /* Oculto hasta que se seleccione un PDF */
        }

        .placeholder-text {
            color: #7f8c8d;
            font-size: 18px;
            text-align: center;
        }

        /* Botón personalizado para subir carpeta */
        .btn-upload {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            transition: background 0.3s;
        }

        .btn-upload:hover { background: #c0392b; }

        /* Estilo del input de archivo oculto */
        input[type="file"] { display: none; }

        /* Lista de PDFs */
        .pdf-item {
            background: rgba(52, 152, 219, 0.1);
            border: 1px solid #3498db;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            word-break: break-all;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pdf-item:hover { background: rgba(52, 152, 219, 0.3); }
        .pdf-item.active { background: #3498db; color: white; font-weight: bold; }
        
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ VISOR DE MANUALES Y CONSIGNAS</h1>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <label for="folderInput" class="btn-upload">
                📂 Seleccionar Carpeta de PDFs
            </label>
            <input type="file" id="folderInput" webkitdirectory directory multiple />

            <div id="fileList">
                </div>
        </div>

        <div class="viewer-area">
            <div id="placeholder" class="placeholder-text">
                👈 Selecciona una carpeta en el menú lateral para cargar los documentos.<br><br>
                <em>Nota: Los archivos no se suben a internet, todo se lee localmente en tu computadora.</em>
            </div>
            <iframe id="pdfIframe"></iframe>
        </div>
    </div>

    <script>
        const folderInput = document.getElementById('folderInput');
        const fileList = document.getElementById('fileList');
        const pdfIframe = document.getElementById('pdfIframe');
        const placeholder = document.getElementById('placeholder');

        folderInput.addEventListener('change', function(event) {
            const files = event.target.files;
            fileList.innerHTML = ''; // Limpiar lista anterior

            // Filtrar solo los archivos que sean PDF
            const pdfFiles = Array.from(files).filter(file => file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'));

            if (pdfFiles.length === 0) {
                fileList.innerHTML = '<p style="color: #e74c3c; font-size: 13px;">No se encontraron archivos PDF en esta carpeta.</p>';
                return;
            }

            // Crear un botón para cada PDF encontrado
            pdfFiles.forEach(file => {
                const item = document.createElement('div');
                item.className = 'pdf-item';
                item.innerHTML = `📄 ${file.name}`;
                
                item.onclick = function() {
                    // Quitar la clase 'active' de todos los items
                    document.querySelectorAll('.pdf-item').forEach(el => el.classList.remove('active'));
                    // Añadir 'active' al item seleccionado
                    item.classList.add('active');

                    // Crear una URL temporal para mostrar el archivo local en el iframe
                    const fileURL = URL.createObjectURL(file);
                    
                    // Mostrar el iframe y ocultar el texto de ayuda
                    placeholder.style.display = 'none';
                    pdfIframe.style.display = 'block';
                    pdfIframe.src = fileURL;
                };

                fileList.appendChild(item);
            });
        });
    </script>
</body>
</html>
