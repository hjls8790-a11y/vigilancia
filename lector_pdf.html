<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Guardia | Lector de Manuales con Voz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a2a3a; 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
        }

        .header {
            text-align: center;
            padding: 15px;
            background: #111d28;
            border-bottom: 2px solid #3498db;
        }

        .header h1 {
            font-size: 22px;
            color: #3498db;
            margin: 0;
            text-transform: uppercase;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: #23374d;
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .viewer-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a2a3a;
            position: relative;
        }

        #pdfIframe {
            width: 100%;
            height: calc(100% - 60px);
            border: 2px solid #3498db;
            border-radius: 8px;
            background: #fff;
            display: none; 
        }

        .placeholder-text {
            color: #7f8c8d;
            font-size: 18px;
            text-align: center;
        }

        .btn-upload {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            transition: background 0.3s;
        }

        .btn-upload:hover { background: #c0392b; }
        input[type="file"] { display: none; }

        .pdf-item {
            background: rgba(52, 152, 219, 0.1);
            border: 1px solid #3498db;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            word-break: break-all;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pdf-item:hover { background: rgba(52, 152, 219, 0.3); }
        .pdf-item.active { background: #3498db; color: white; font-weight: bold; }

        /* Controles de Audio inferiores */
        .audio-bar {
            width: 100%;
            height: 60px;
            background: #111d28;
            display: none; /* Se muestra al seleccionar un PDF */
            justify-content: center;
            align-items: center;
            gap: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .audio-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .audio-btn:hover { background: #2ecc71; }
        
        .btn-stop { background: #c0392b; }
        .btn-stop:hover { background: #e74c3c; }

        #statusText { font-size: 13px; color: #f1c40f; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ VISOR Y LECTOR DE MANUALES</h1>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <label for="folderInput" class="btn-upload">📂 Seleccionar Carpeta</label>
            <input type="file" id="folderInput" webkitdirectory directory multiple />
            <div id="fileList"></div>
        </div>

        <div class="viewer-area">
            <div id="placeholder" class="placeholder-text">
                👈 Selecciona una carpeta en el menú lateral para cargar los documentos.
            </div>
            <iframe id="pdfIframe"></iframe>
            
            <div class="audio-bar" id="audioBar">
                <button class="audio-btn" onclick="leerPDFActivo()">🔊 Leer Documento</button>
                <button class="audio-btn btn-stop" onclick="detenerAudio()">⏹️ Detener</button>
                <span id="statusText"></span>
            </div>
        </div>
    </div>

    <script>
        // Configurar el worker de PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const folderInput = document.getElementById('folderInput');
        const fileList = document.getElementById('fileList');
        const pdfIframe = document.getElementById('pdfIframe');
        const placeholder = document.getElementById('placeholder');
        const audioBar = document.getElementById('audioBar');
        const statusText = document.getElementById('statusText');

        let archivoActivo = null; // Guardará el PDF que está abierto actualmente

        folderInput.addEventListener('change', function(event) {
            const files = event.target.files;
            fileList.innerHTML = ''; 

            const pdfFiles = Array.from(files).filter(file => file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'));

            if (pdfFiles.length === 0) {
                fileList.innerHTML = '<p style="color: #e74c3c; font-size: 13px;">No se encontraron PDFs.</p>';
                return;
            }

            pdfFiles.forEach(file => {
                const item = document.createElement('div');
                item.className = 'pdf-item';
                item.innerHTML = `📄 ${file.name}`;
                
                item.onclick = function() {
                    document.querySelectorAll('.pdf-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');

                    archivoActivo = file; // Guardamos el archivo para leerlo después
                    detenerAudio(); // Si estaba leyendo otro, lo detenemos

                    const fileURL = URL.createObjectURL(file);
                    placeholder.style.display = 'none';
                    pdfIframe.style.display = 'block';
                    audioBar.style.display = 'flex'; // Mostramos los botones de audio
                    pdfIframe.src = fileURL;
                    statusText.innerText = "";
                };

                fileList.appendChild(item);
            });
        });

        // Función para extraer texto y leerlo
        async function leerPDFActivo() {
            if (!archivoActivo) return;

            detenerAudio();
            statusText.innerText = "⏳ Extrayendo texto...";

            try {
                // Leer el archivo como datos binarios
                const arrayBuffer = await archivoActivo.arrayBuffer();
                // Cargar el documento en PDF.js
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                let textoCompleto = '';

                // Extraer el texto página por página
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    textoCompleto += pageText + ' . '; // Punto para que la voz haga pausas
                }

                if (textoCompleto.trim() === '') {
                    statusText.innerText = "⚠️ Este PDF parece ser una imagen, no tiene texto legible.";
                    return;
                }

                statusText.innerText = "🔊 Leyendo...";
                reproducirVoz(textoCompleto);

            } catch (error) {
                console.error(error);
                statusText.innerText = "❌ Error al leer el PDF.";
            }
        }

        function reproducirVoz(texto) {
            // Se divide el texto en fragmentos (chunks) si es muy largo, porque algunos navegadores se saturan
            const maxLetras = 200;
            const regex = new RegExp(`.{1,${maxLetras}}(\\s|$)`, 'g');
            const fragmentos = texto.match(regex);

            if(fragmentos) {
                fragmentos.forEach(fragmento => {
                    const utterance = new SpeechSynthesisUtterance(fragmento);
                    utterance.lang = 'es-MX'; // Español
                    utterance.rate = 1.0;     // Velocidad normal
                    window.speechSynthesis.speak(utterance);
                });
            }
        }

        function detenerAudio() {
            window.speechSynthesis.cancel();
            statusText.innerText = "";
        }
    </script>
</body>
</html>
