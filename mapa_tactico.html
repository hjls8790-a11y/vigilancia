<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consignas Tácticas - El Cielo</title>
    <style>
        :root { --p: #2C3E50; --s: #3498DB; --g: #27AE60; --r: #E74C3C; --o: #F39C12; --gray: #95A5A6; --w: #fff; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        .main-container { display: flex; height: 100vh; }
        
        /* Panel Lateral */
        .sidebar { width: 340px; background: var(--p); color: var(--w); overflow-y: auto; padding: 20px; box-sizing: border-box; z-index: 10; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        .sidebar h2 { font-size: 1.2em; text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-top: 0; }
        
        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .section h3 { font-size: 0.9em; margin-top: 0; color: #BDC3C7; text-transform: uppercase; letter-spacing: 1px; }
        
        label { font-size: 0.8em; font-weight: bold; color: #ecf0f1; margin-top: 5px; display: block; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0 15px 0; border-radius: 5px; border: none; font-family: inherit; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        
        button { width: 100%; padding: 12px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 1em; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover { opacity: 0.9; transform: scale(0.98); }
        
        .btn-pin { background: var(--s); margin-bottom: 10px; }
        .btn-clear { background: #555; }
        .btn-wa { background: #25D366; margin-top: auto; padding: 15px; font-size: 1.1em; }

        /* Área del Mapa */
        .map-viewport { flex: 1; position: relative; background: #e5e3df; overflow: auto; /* Permite scroll si la imagen es muy grande */ }
        
        /* INSTRUCCIÓN: Asegúrate de guardar el plano que me mandaste en la misma carpeta que este archivo con el nombre "mapa_el_cielo.jpg" */
        #map-canvas { 
            position: absolute; top: 0; left: 0; 
            width: 2000px; /* Ajusta esto según el tamaño de tu imagen */
            height: 1500px; /* Ajusta esto según el tamaño de tu imagen */
            background-image: url('mapa_el_cielo.jpg'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #fff;
        }

        /* Pines */
        .marker { position: absolute; width: 28px; height: 28px; border-radius: 50%; border: 3px solid white; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; font-size: 11px; color: white; font-weight: bold; box-shadow: 0 3px 6px rgba(0,0,0,0.5); cursor: pointer; transition: 0.2s; z-index: 2; }
        .marker:hover { transform: translate(-50%, -50%) scale(1.2); z-index: 3; }

        /* Tarjeta de Lectura de Consigna (Oculta por defecto) */
        #tarjeta-consigna {
            display: none; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: white; color: #333; padding: 20px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 350px; border-left: 8px solid var(--p); z-index: 1000;
        }
        #tarjeta-consigna h4 { margin: 0 0 10px 0; font-size: 1.2em; color: var(--p); border-bottom: 1px solid #eee; padding-bottom: 5px;}
        #tarjeta-consigna p { margin: 0 0 15px 0; font-size: 0.95em; line-height: 1.4; }
        #tarjeta-consigna button { background: var(--p); padding: 8px; font-size: 0.9em; width: auto; float: right; }
        
        /* Mensaje de estado flotante */
        #status-msg { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; display: none; pointer-events: none; z-index: 2000; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="sidebar">
        <h2>🦅 CONSIGNAS EL CIELO</h2>
        
        <div class="section">
            <h3>NUEVA CONSIGNA</h3>
            
            <label>Identificador (Mza - Lote):</label>
            <input type="text" id="lote-id" placeholder="Ej. Mza 2 Lote 14" autocomplete="off">
            
            <label>Nivel de Atención:</label>
            <select id="tipo-consigna">
                <option value="#E74C3C|🔴|Alerta Estricta">🔴 Alerta / Revisión Estricta (Rojo)</option>
                <option value="#F39C12|🟠|Precaución">🟠 Obra / Precaución (Naranja)</option>
                <option value="#3498DB|🔵|Monitoreo">🔵 Renta / Monitoreo (Azul)</option>
                <option value="#95A5A6|⚪|Rondín Normal">⚪ Casa Sola / Rondín Normal (Gris)</option>
            </select>

            <label>Instrucción para el Guardia:</label>
            <textarea id="texto-consigna" placeholder="Escribe la tarea específica que el guardia debe realizar en este punto..."></textarea>
            
            <button class="btn-pin" onclick="prepararPin()">📍 Colocar Pin en Mapa</button>
            <button class="btn-clear" onclick="limpiarMapa()">🗑️ Limpiar Mapa</button>
        </div>

        <button class="btn-wa" onclick="enviarWhatsApp()">📲 Enviar Consignas (WA)</button>
    </div>

    <div class="map-viewport" id="viewport">
        <div id="status-msg">Haz clic en el mapa para colocar la consigna</div>
        
        <div id="map-canvas" onclick="colocarPin(event)">
            </div>

        <div id="tarjeta-consigna">
            <h4 id="tc-titulo">Mza - Lote</h4>
            <p id="tc-texto">Aquí va la instrucción para el guardia...</p>
            <button onclick="cerrarTarjeta()">Cerrar</button>
        </div>
    </div>
</div>

<script>
    let modoColocar = false;
    let listaConsignas = [];
    const canvas = document.getElementById('map-canvas');
    const statusMsg = document.getElementById('status-msg');

    function prepararPin() {
        const lote = document.getElementById('lote-id').value.trim();
        const texto = document.getElementById('texto-consigna').value.trim();
        
        if (!lote || !texto) {
            alert("⚠️ Por favor, escribe el Lote y la Instrucción antes de colocar el pin.");
            return;
        }

        modoColocar = true;
        canvas.style.cursor = 'crosshair';
        statusMsg.style.display = 'block';
    }

    function colocarPin(e) {
        // Solo acciona si el botón de colocar pin fue presionado previamente
        if (!modoColocar) return;

        // Validar que no se haya hecho clic sobre otro pin
        if (e.target.classList.contains('marker')) return;

        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const lote = document.getElementById('lote-id').value.trim().toUpperCase();
        const texto = document.getElementById('texto-consigna').value.trim();
        const selectorValue = document.getElementById('tipo-consigna').value.split('|');
        const color = selectorValue;
        const emoji = selectorValue;
        const categoria = selectorValue;

        // Guardar en la base de datos temporal
        const nuevaConsigna = { id: Date.now(), lote, color, emoji, categoria, texto, x, y };
        listaConsignas.push(nuevaConsigna);

        // Crear elemento visual (Pin)
        const pin = document.createElement('div');
        pin.className = 'marker';
        pin.style.left = x + 'px';
        pin.style.top = y + 'px';
        pin.style.backgroundColor = color;
        // pin.innerText = lote.substring(0,2); // Opcional: mostrar iniciales en el pin
        
        // Evento para leer la consigna al darle clic al pin
        pin.onclick = function(evento) {
            evento.stopPropagation(); // Evita que se dispare el evento del mapa
            abrirTarjeta(color, lote, categoria, texto);
        };

        canvas.appendChild(pin);

        // Reiniciar controles
        modoColocar = false;
        canvas.style.cursor = 'default';
        statusMsg.style.display = 'none';
        document.getElementById('lote-id').value = '';
        document.getElementById('texto-consigna').value = '';
    }

    function abrirTarjeta(color, lote, categoria, texto) {
        const tarjeta = document.getElementById('tarjeta-consigna');
        document.getElementById('tc-titulo').innerText = `${lote} - ${categoria}`;
        document.getElementById('tc-texto').innerText = texto;
        tarjeta.style.borderLeftColor = color;
        tarjeta.style.display = 'block';
    }

    function cerrarTarjeta() {
        document.getElementById('tarjeta-consigna').style.display = 'none';
    }

    function limpiarMapa() {
        if(confirm("¿Estás seguro de borrar todas las consignas actuales del mapa?")) {
            listaConsignas = [];
            document.querySelectorAll('.marker').forEach(m => m.remove());
            cerrarTarjeta();
        }
    }

    function enviarWhatsApp() {
        if (listaConsignas.length === 0) {
            alert("No hay consignas marcadas en el mapa para enviar.");
            return;
        }

        let msg = "*🛡️ CONSIGNAS DE TURNO - EL CIELO*\n\n";
        msg += "Atención guardia en turno, favor de dar cumplimiento a las siguientes instrucciones por zona:\n\n";

        listaConsignas.forEach(c => {
            msg += `${c.emoji} *${c.lote}* (${c.categoria})\n`;
            msg += `📋 *Misión:* ${c.texto}\n\n`;
        });

        msg += "⚠️ Responde *ENTERADO* a este mensaje al iniciar tu turno e informa novedades de estos puntos.";

        const url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
    }
</script>
</body>
</html>
