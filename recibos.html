<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Operativo - Accesos y Recibos</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0A2540; --secondary: #D4AF37; --success: #10B981; 
            --danger: #EF4444; --warning: #F59E0B; --gray-light: #E5E7EB; 
            --gray-dark: #6B7280; --bg: #F3F4F6; --surface: #FFFFFF;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #1F2937; }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--gray-light); padding-bottom: 15px; }
        .header h1 { color: var(--primary); margin: 0 0 5px 0; font-size: 1.8rem; }
        .dashboard { display: flex; gap: 25px; flex-wrap: wrap; align-items: flex-start; }
        .column { flex: 1; min-width: 350px; }
        
        h2 { color: var(--primary); font-size: 1.3rem; border-bottom: 3px solid var(--secondary); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; margin-top: 0;}
        
        .form-container { background: var(--surface); padding: 18px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; border-top: 4px solid var(--primary); }
        .form-row { display: flex; gap: 10px; }
        .form-row > * { flex: 1; }
        select, input { padding: 10px; border: 1px solid #D1D5DB; border-radius: 5px; font-size: 0.95rem; width: 100%; box-sizing: border-box; background-color: #F9FAFB; }
        
        button { background-color: var(--primary); color: white; border: none; padding: 12px; font-size: 1rem; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: all 0.2s; }
        button:hover { background-color: #06182a; transform: translateY(-1px); }
        .btn-clear { background-color: white; color: var(--gray-dark); border: 1px solid var(--gray-light); font-size: 0.8rem; padding: 5px 10px; width: auto; font-weight: normal; }
        .btn-clear:hover { background-color: var(--gray-light); color: black; }
        
        .card { background: var(--surface); border-radius: 8px; padding: 18px; margin-bottom: 15px; border-left: 5px solid var(--gray-dark); box-shadow: 0 2px 5px rgba(0,0,0,0.08); transition: 0.3s; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; color: white; font-weight: bold; letter-spacing: 0.5px; }
        .bg-jumapam { background-color: #3B82F6; } .bg-cfe { background-color: #10B981; } .bg-predial { background-color: #8B5CF6; } .bg-admin { background-color: var(--secondary); color: black; }
        
        /* Estilos mejorados para los Pasos de Recibos */
        .process-tracker { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; padding: 10px; background-color: #F8FAFC; border-radius: 6px; }
        .step { display: flex; align-items: center; gap: 10px; color: #9CA3AF; font-size: 0.9rem; transition: 0.3s; }
        .indicator { width: 16px; height: 16px; border-radius: 50%; background-color: #E5E7EB; transition: 0.3s; }
        .step.active .indicator { background-color: var(--success); box-shadow: 0 0 8px var(--success); transform: scale(1.1); }
        .step.active { color: var(--success); font-weight: 700; }
        
        /* Banner Llamativo para Visitas */
        .banner-alerta {
            background-color: #FEF2F2;
            color: #DC2626;
            border: 2px solid #F87171;
            padding: 10px;
            text-align: center;
            font-weight: 800;
            font-size: 0.9rem;
            border-radius: 6px;
            margin-bottom: 15px;
            animation: latido 1.5s infinite;
            text-transform: uppercase;
        }
        
        @keyframes latido {
            0% { opacity: 0.8; transform: scale(0.99); box-shadow: 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { opacity: 1; transform: scale(1.01); box-shadow: 0 0 10px rgba(239, 68, 68, 0.6); }
            100% { opacity: 0.8; transform: scale(0.99); box-shadow: 0 0 0 rgba(239, 68, 68, 0.4); }
        }

        .btn-action { margin-top: 5px; background-color: var(--gray-dark); }
        .btn-action.done { background-color: var(--success); cursor: default; }
        .btn-confirmar { background-color: var(--danger); font-size: 1.05rem; padding: 15px; }
        .btn-confirmar:hover { background-color: #B91C1C; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Centro de Control Operativo y Accesos</h1>
        <p style="margin:0; font-size: 1rem; color: #4B5563;">Comunicación en tiempo real: Caseta ↔ Administración</p>
    </div>

    <div class="dashboard">
        <div class="column">
            <h2>📦 Gestión de Recibos <button class="btn-clear" onclick="limpiarRecibos()">🧹 Limpiar Terminados</button></h2>
            <div class="form-container">
                <div class="form-row">
                    <select id="t-rec">
                        <option value="JUMAPAM">💧 JUMAPAM</option>
                        <option value="CFE">⚡ CFE</option>
                        <option value="PREDIAL">🏛️ PREDIAL</option>
                    </select>
                    <input type="number" id="c-rec" placeholder="Cantidad (Ej. 100)" min="1">
                </div>
                <input type="text" id="m-rec" placeholder="Mes o Periodo (Ej. Abril 2026)">
                <button onclick="guardarLote()">Registrar Lote en Caseta</button>
            </div>
            <div id="lista-lotes"></div>
        </div>

        <div class="column">
            <h2>👥 Autorizaciones de Oficina <button class="btn-clear" onclick="limpiarVisitas()">🧹 Limpiar Ingresados</button></h2>
            <div class="form-container" style="border-top-color: var(--secondary);">
                <div class="form-row">
                    <select id="a-vis">
                        <option value="Manrry">Autoriza: Manrry</option>
                        <option value="Liz">Autoriza: Liz</option>
                        <option value="Gerencia">Autoriza: Gerencia</option>
                    </select>
                    <input type="date" id="f-vis" title="Fecha esperada">
                </div>
                <input type="text" id="n-vis" placeholder="Nombre de la Visita / Contratista">
                <input type="text" id="m-vis" placeholder="Motivo o Instrucción (Ej. Viene a cotizar)">
                <button style="background-color: var(--secondary); color: black;" onclick="guardarVisita()">Enviar Autorización a Caseta</button>
            </div>
            <div id="lista-visitas"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN DE FIREBASE (PEGA TUS CLAVES AQUÍ)
        // ==========================================
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            databaseURL: "https://TU_PROYECTO.firebaseio.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const refRecibos = db.ref('cielo_ops/rec');
        const refVisitas = db.ref('cielo_ops/vis');

        // ==========================================
        // 2. MÓDULO DE RECIBOS
        // ==========================================
        const pasosLote = ["1. Lote en Caseta", "2. En Revisión Admin", "3. Listo para Repartir", "4. Entregas Finalizadas"];

        function guardarLote() {
            const t = document.getElementById('t-rec').value;
            const c = document.getElementById('c-rec').value;
            const m = document.getElementById('m-rec').value.trim();
            if(!c || !m) return alert("Por favor, ingresa la cantidad y el periodo.");

            refRecibos.push({ t: t, c: c, m: m, p: 0 });
            document.getElementById('c-rec').value = '';
            document.getElementById('m-rec').value = '';
        }

        // Función global adjunta a window para asegurar que el botón la encuentre
        window.avanzarLote = function(key, pasoActual) {
            if(pasoActual < 3) {
                refRecibos.child(key).update({ p: pasoActual + 1 }).catch(err => console.error("Error al actualizar:", err));
            }
        };

        window.limpiarRecibos = function() {
            if(confirm("¿Estás seguro de limpiar los lotes terminados?")) {
                refRecibos.once('value', snap => {
                    snap.forEach(child => { if(child.val().p === 3) child.ref.remove(); });
                });
            }
        };

        refRecibos.on('value', snapshot => {
            const contenedor = document.getElementById('lista-lotes');
            contenedor.innerHTML = '';
            
            let lotes = [];
            snapshot.forEach(child => { lotes.unshift({ key: child.key, ...child.val() }); });

            lotes.forEach(l => {
                const completado = l.p === 3;
                let bg = l.t === 'CFE' ? 'bg-cfe' : l.t === 'PREDIAL' ? 'bg-predial' : 'bg-jumapam';
                
                let pasosHTML = '<div class="process-tracker">';
                pasosLote.forEach((txt, i) => {
                    let act = i <= l.p ? 'active' : '';
                    pasosHTML += `<div class="step ${act}"><div class="indicator"></div><span>${txt}</span></div>`;
                });
                pasosHTML += '</div>';

                contenedor.innerHTML += `
                    <div class="card" style="${completado ? 'border-left-color: var(--success); opacity: 0.7;' : ''}">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong style="font-size: 1.1rem;">Lote: ${l.m} <span style="color:var(--gray-dark); font-size:0.9rem;">(${l.c} recibos)</span></strong> 
                            <span class="badge ${bg}">${l.t}</span>
                        </div>
                        
                        ${pasosHTML}
                        
                        <button class="btn-action ${completado ? 'done' : ''}" ${completado ? 'disabled' : ''} onclick="avanzarLote('${l.key}', ${l.p})">
                            ${completado ? '✔ Proceso Completado' : 'Avanzar Proceso'}
                        </button>
                    </div>`;
            });
        });

        // ==========================================
        // 3. MÓDULO DE VISITAS
        // ==========================================
        function guardarVisita() {
            const a = document.getElementById('a-vis').value;
            const f = document.getElementById('f-vis').value;
            const n = document.getElementById('n-vis').value.trim();
            const m = document.getElementById('m-vis').value.trim();
            if(!n) return alert("Ingresa el nombre de la visita.");

            refVisitas.push({ a: a, f: f, n: n, m: m, s: 0 });
            document.getElementById('n-vis').value = '';
            document.getElementById('m-vis').value = '';
        }

        window.confirmarIngreso = function(key) {
            if(confirm("¿Confirmas que la persona ya está en caseta y autorizas su ingreso?")) {
                refVisitas.child(key).update({ s: 1 }).catch(err => console.error("Error:", err));
            }
        };

        window.limpiarVisitas = function() {
            if(confirm("¿Limpiar el historial de visitas que ya ingresaron?")) {
                refVisitas.once('value', snap => {
                    snap.forEach(child => { if(child.val().s === 1) child.ref.remove(); });
                });
            }
        };

        refVisitas.on('value', snapshot => {
            const contenedor = document.getElementById('lista-visitas');
            contenedor.innerHTML = '';
            
            let visitas = [];
            snapshot.forEach(child => { visitas.unshift({ key: child.key, ...child.val() }); });

            visitas.forEach(v => {
                const ingresado = v.s === 1;
                let fechaTxt = v.f ? `Esperado el: ${v.f}` : 'Fecha abierta';
                
                let bannerHTML = !ingresado ? 
                    `<div class="banner-alerta">🚨 Aún no ingresa - Estar Alerta</div>` : '';

                contenedor.innerHTML += `
                    <div class="card" style="border-left-color: ${!ingresado ? 'var(--danger)' : 'var(--success)'}; ${ingresado ? 'opacity: 0.6;' : ''}">
                        
                        ${bannerHTML}

                        <div style="display:flex; justify-content:space-between; margin-bottom: 10px;">
                            <span class="badge bg-admin">Autoriza: ${v.a}</span>
                            <span style="font-size: 0.85rem; color: var(--gray-dark); font-weight:bold;">${fechaTxt}</span>
                        </div>
                        <strong style="font-size: 1.2rem; display:block; color: var(--primary);">👤 ${v.n}</strong>
                        <p style="font-size: 0.95rem; color: #4B5563; margin: 8px 0; background: #F3F4F6; padding: 8px; border-radius: 4px;">📝 <b>Instrucción:</b> ${v.m}</p>
                        
                        ${!ingresado ? 
                        `<button class="btn-action btn-confirmar" onclick="confirmarIngreso('${v.key}')">🚨 Confirmar Ingreso en Caseta</button>` : 
                        `<button class="btn-action done" disabled>✔ Ingreso Confirmado</button>`}
                    </div>`;
            });
        });

    </script>
</body>
</html>
