<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNTO DE VENTA Y RENTAS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f7; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        #header { background: #16a085; color: white; width: 100%; padding: 15px 0; text-align: center; border-bottom: 4px solid #1abc9c; }
        h2 { margin: 0; font-size: 22px; }
        .form-container { background: white; width: 90%; max-width: 450px; margin-top: 20px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .input-group input:focus, .input-group select:focus { border-color: #16a085; outline: none; }
        .input-dinero { font-weight: bold; color: #27ae60; font-size: 18px !important; }
        .btn-submit { background: #16a085; color: white; border: none; width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .btn-submit:active { background: #117a65; transform: translateY(2px); }
        #mensaje { display: none; background: #d4edda; color: #155724; padding: 15px; text-align: center; border-radius: 6px; margin-bottom: 15px; font-weight: bold; border: 1px solid #c3e6cb; }
        .nota-pago { font-size: 12px; color: #e74c3c; font-weight: bold; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="header">
        <h2>🎾 VENTAS Y RENTAS CLUB</h2>
    </div>

    <div class="form-container">
        <div id="mensaje">✅ ¡Operación registrada con éxito!</div>
        <div class="nota-pago">💳 TODAS LAS OPERACIONES SON ÚNICAMENTE CON TARJETA</div>

        <div class="input-group">
            <label>👮‍♂️ Oficial / Elemento en Turno</label>
            <input type="text" id="oficial" placeholder="Tu nombre..." required>
        </div>

        <div class="input-group">
            <label>👤 Nombre del Socio (Titular)</label>
            <input type="text" id="socio" placeholder="Socio que autoriza/paga..." required>
        </div>

        <div class="input-group">
            <label>🤝 Entregado a (Beneficiario/Invitado)</label>
            <input type="text" id="cliente" placeholder="A quién se le dio el producto..." required>
        </div>

        <div class="input-group">
            <label>📦 Producto o Servicio</label>
            <select id="producto">
                <option value="Venta - Pelotas de Padel">Venta - Pelotas de Padel</option>
                <option value="Venta - Pelotas de Tennis">Venta - Pelotas de Tennis</option>
                <option value="Ingreso - Pulsera Adulto">Ingreso - Pulsera Adulto</option>
                <option value="Ingreso - Pulsera Menor">Ingreso - Pulsera Menor</option>
                <option value="Renta - Pala de Padel">Renta - Pala de Padel</option>
                <option value="Renta - Pala de Pickleball">Renta - Pala de Pickleball</option>
                <option value="Otro">Otro (Especificar en notas si es necesario)</option>
            </select>
        </div>

        <div class="input-group">
            <label>💲 Costo Total Cobrado ($)</label>
            <input type="number" id="monto" class="input-dinero" placeholder="Ej. 250" required>
        </div>

        <div class="input-group">
            <label>🧾 Número de Folio del Voucher (Terminal)</label>
            <input type="text" id="folio" placeholder="Ej. 004589" required>
        </div>

        <button class="btn-submit" onclick="guardarVenta()" id="btnGuardar">REGISTRAR PAGO</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.guardarVenta = async function() {
            const btn = document.getElementById('btnGuardar');
            const oficial = document.getElementById('oficial').value;
            const socio = document.getElementById('socio').value;
            const cliente = document.getElementById('cliente').value;
            const producto = document.getElementById('producto').value;
            const monto = document.getElementById('monto').value;
            const folio = document.getElementById('folio').value;

            if(!oficial || !socio || !cliente || !monto || !folio) {
                alert("⚠️ Por favor llena todos los campos, incluyendo el monto y el folio del voucher.");
                return;
            }

            btn.innerText = "Procesando...";
            btn.disabled = true;

            const ahora = new Date();
            const fechaHora = ahora.toLocaleString('es-MX');
            const timestamp = ahora.getTime();

            try {
                // Nueva colección "ventas_club"
                await addDoc(collection(db, "ventas_club"), {
                    oficial: oficial,
                    socio: socio,
                    beneficiario: cliente,
                    producto: producto,
                    monto: parseFloat(monto),
                    folio_voucher: folio,
                    fecha_hora: fechaHora,
                    timestamp: timestamp
                });

                document.getElementById('mensaje').style.display = "block";
                
                // Limpiamos los campos para el siguiente cliente (dejamos el nombre del guardia)
                document.getElementById('socio').value = "";
                document.getElementById('cliente').value = "";
                document.getElementById('monto').value = "";
                document.getElementById('folio').value = "";

                setTimeout(() => {
                    document.getElementById('mensaje').style.display = "none";
                }, 4000);

            } catch (error) {
                console.error("Error: ", error);
                alert("❌ Ocurrió un error al guardar.");
            } finally {
                btn.innerText = "REGISTRAR PAGO";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
