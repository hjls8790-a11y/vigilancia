<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor El Cielo - Tiempo Real</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: white; padding: 20px; }
        .grid { display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; border-top: 5px solid #3b82f6; position: relative; animation: flash 2s; }
        @keyframes flash { from { box-shadow: 0 0 20px #3b82f6; } to { box-shadow: none; } }
        .card h3 { margin: 0; color: #38bdf8; font-size: 1.1rem; }
        .info { font-size: 0.9rem; margin-top: 8px; color: #cbd5e1; }
        .tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 10px; margin-top: 10px; color: black; }
        .btn-revisar { width: 100%; margin-top: 15px; padding: 10px; border: none; border-radius: 4px; background: #ef4444; color: white; cursor: pointer; font-weight: bold; }
        .revisado { background: #10b981 !important; }
    </style>
</head>
<body>
    <h2 style="border-bottom: 2px solid #3b82f6; padding-bottom: 10px;">Monitor de Arribos - Seguridad por Coincidencia</h2>
    <div class="grid" id="container"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            databaseURL: "https://sistema-vigilancia-6851e-default-rtdb.firebaseio.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('arribos_coincidencia').limitToLast(20).on('child_added', (snap) => {
            const d = snap.val();
            const id = snap.key;
            const time = new Date(d.timestamp).toLocaleTimeString();
            
            const card = document.createElement('div');
            card.className = 'card';
            card.id = id;
            card.innerHTML = `
                <h3>${d.calle} #${d.numero}</h3>
                <div class="info"><b>Hora:</b> ${time}<br><b>Visita:</b> ${d.tipo_visita}<br><b>Vehículo:</b> ${d.marca} ${d.color} [${d.placas}]</div>
                <span class="tag" style="background:${getCol(d.distintivo)}">DISTINTIVO ${d.distintivo}</span>
                <button id="b-${id}" class="btn-revisar ${d.estado === 'Revisado' ? 'revisado' : ''}" onclick="check('${id}')">
                    ${d.estado === 'Revisado' ? 'AUDITADO ✓' : 'MARCAR REVISADO'}
                </button>
            `;
            document.getElementById('container').insertBefore(card, document.getElementById('container').firstChild);
        });

        function getCol(d) {
            return d === 'Amarillo' ? '#facc15' : d === 'Naranja' ? '#fb923c' : d === 'Verde' ? '#4ade80' : '#94a3b8';
        }

        window.check = function(id) {
            db.ref('arribos_coincidencia/' + id).update({ estado: "Revisado" }).then(() => {
                document.getElementById('b-' + id).classList.add('revisado');
                document.getElementById('b-' + id).innerText = "AUDITADO ✓";
            });
        }
    </script>
</body>
</html>
