<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONDÍN FOTUR</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; padding: 15px; margin: 0; }
        .card { background: #34495e; padding: 20px; border-radius: 12px; border-top: 8px solid #e67e22; max-width: 400px; margin: auto; }
        h2 { text-align: center; color: #e67e22; }
        .etiqueta-fija { background: #e67e22; color: white; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        label { font-weight: bold; font-size: 14px; color: #bdc3c7; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: none; box-sizing: border-box; font-size: 16px; }
        .foto-box { border: 2px dashed #e67e22; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; cursor: pointer; }
        #preview { max-width: 100%; height: 200px; object-fit: cover; display: none; margin-top: 10px; border-radius: 8px; }
        .btn { border: none; width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 10px; }
        #btnAccion { background: #2ecc71; color: white; }
        #btnFinalizar { background: #c0392b; color: white; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🏗️ REGISTRO RONDÍN</h2>
        <div class="etiqueta-fija">📍 SECTOR ACTIVO: OBRA FOTUR</div>
        
        <label>👮 Nombre del Oficial</label>
        <input type="text" id="oficial" placeholder="Tu nombre..." required>
        
        <label>📝 Novedades u Observaciones</label>
        <textarea id="novedad" placeholder="Sin novedad"></textarea>
        
        <div class="foto-box" onclick="document.getElementById('input_foto').click()">
            📷 AGREGAR FOTO (OPCIONAL)
            <input type="file" id="input_foto" accept="image/*" capture="environment" style="display:none;" onchange="cargarFoto(event)">
            <img id="preview" src="">
        </div>

        <button id="btnAccion" class="btn" onclick="gestionarPunto()">INICIAR / MARCAR PUNTO</button>
        <button id="btnFinalizar" class="btn" onclick="finalizarRecorrido()">🏁 FINALIZAR RECORRIDO</button>
        <div id="gpsStatus" style="text-align:center; font-size:12px; color:#e67e22; margin-top:10px;">Buscando GPS...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", authDomain: "sistema-vigilancia-6851e.firebaseapp.com", projectId: "sistema-vigilancia-6851e", storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", messagingSenderId: "714792023462", appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let fotoBase64 = "NO", lat = 0, lng = 0;
        let idRecorrido = localStorage.getItem('idRec_Fotur'); // <--- ID Único para Fotur
        
        if(idRecorrido) document.getElementById('btnFinalizar').style.display = 'block';

        navigator.geolocation.watchPosition(p => { 
            lat = p.coords.latitude; lng = p.coords.longitude; 
            document.getElementById('gpsStatus').innerText = `📍 GPS Activo: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        }, () => { document.getElementById('gpsStatus').innerText = "⚠️ Activa el GPS para continuar"; }, { enableHighAccuracy: true });

        window.cargarFoto = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                fotoBase64 = reader.result;
                document.getElementById('preview').src = fotoBase64;
                document.getElementById('preview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        };

        window.gestionarPunto = async () => {
            const oficial = document.getElementById('oficial').value;
            if(!oficial) return alert("Escribe tu nombre");
            if(lat === 0) return alert("Espera a que el GPS te localice");

            document.getElementById('btnAccion').innerText = "Guardando...";
            if(!idRecorrido) { idRecorrido = "FOTUR-" + Date.now(); localStorage.setItem('idRec_Fotur', idRecorrido); }
            
            try {
                await addDoc(collection(db, "recorridos"), {
                    id_recorrido: idRecorrido, 
                    oficial: oficial, 
                    sector: "Fotur", // <--- CANDADO DE ENVÍO FOTUR
                    novedad: document.getElementById('novedad').value || "Sin novedad",
                    evidencia_foto: fotoBase64, latitud: lat, longitud: lng,
                    fecha_hora: new Date().toLocaleString('es-MX'), timestamp: Date.now(), tipo: "PUNTO"
                });
                document.getElementById('btnFinalizar').style.display = 'block';
                document.getElementById('btnAccion').innerText = "INICIAR / MARCAR PUNTO";
                document.getElementById('novedad').value = "";
                document.getElementById('preview').style.display = 'none';
                fotoBase64 = "NO";
                alert("✅ Punto registrado en Fotur");
            } catch (e) { alert("Error de conexión"); document.getElementById('btnAccion').innerText = "INICIAR / MARCAR PUNTO"; }
        };

        window.finalizarRecorrido = async () => {
            if(!confirm("¿Finalizar Rondín de Fotur?")) return;
            document.getElementById('btnFinalizar').innerText = "Cerrando...";
            await addDoc(collection(db, "recorridos"), {
                id_recorrido: idRecorrido, oficial: document.getElementById('oficial').value,
                sector: "Fotur", tipo: "FIN", fecha_hora: new Date().toLocaleString('es-MX'), timestamp: Date.now()
            });
            localStorage.removeItem('idRec_Fotur');
            alert("✅ Recorrido Finalizado");
            location.reload();
        };
    </script>
</body>
</html>
