<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Accesos - Reservas y Actividades</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #eef2f7; 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }
        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: white; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        h1, h2 { color: #1a365d; text-align: center; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select, button { 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 15px;
            box-sizing: border-box; 
        }
        .btn-submit { 
            grid-column: span 2;
            background-color: #2b6cb0; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            border: none; 
            transition: 0.3s;
        }
        .btn-submit:hover { background-color: #1a365d; }
        .btn-submit:disabled { background-color: #a0aec0; cursor: not-allowed; }
        
        .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filters button { 
            flex: 1; 
            background-color: #4a5568; 
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .filters button.active { background-color: #2b6cb0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #2b6cb0; color: white; }
        tr:hover { background-color: #f7fafc; }
        
        .status-btn { 
            padding: 6px 12px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%;
        }
        .status-pending { background-color: #ecc94b; color: #744210; }
        .status-entered { background-color: #48bb78; color: white; }
    </style>
    <!-- Firebase SDK (Versión Compat para integración sencilla en un solo archivo) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
    <h1>Plataforma de Accesos Operativos</h1>
    
    <h2>Nueva Reserva</h2>
    <form id="reservaForm">
        <div class="form-grid">
            <div class="form-group">
                <label for="nombre">Nombre del Visitante / Cliente</label>
                <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
            </div>
            <div class="form-group">
                <label for="actividad">Destino / Actividad</label>
                <select id="actividad" required>
                    <option value="Bon (Restaurante)">Bon (Restaurante)</option>
                    <option value="Yoga">Yoga</option>
                    <option value="Pádel">Pádel</option>
                    <option value="Tenis">Tenis</option>
                    <option value="Pickleball">Pickleball</option>
                    <option value="Natación">Natación</option>
                    <option value="Fútbol">Fútbol</option>
                    <option value="Básquetbol">Básquetbol</option>
                    <option value="Masterclass">Masterclass</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" required>
            </div>
            <div class="form-group">
                <label for="hora">Hora</label>
                <input type="time" id="hora" required>
            </div>
            <button type="submit" class="btn-submit" id="btnGuardar">Guardar Reserva</button>
        </div>
    </form>

    <h2>Directorio de Accesos del Día</h2>
    <div class="filters" id="filtrosContenedor">
        <button class="active" onclick="filtrarActividad('Todas', event)">Todas las áreas</button>
        <button onclick="filtrarActividad('Bon (Restaurante)', event)">Restaurante Bon</button>
        <button onclick="filtrarActividad('Deportes', event)">Deportes y Clases</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Destino</th>
                <th>Hora</th>
                <th>Control de Ingreso</th>
            </tr>
        </thead>
        <tbody id="tablaReservas">
            <!-- Los datos se inyectarán aquí dinámicamente -->
        </tbody>
    </table>
</div>

<script>
    // 1. CONFIGURACIÓN DE FIREBASE (Con tus credenciales exactas)
    const firebaseConfig = {
        apiKey: "AIzaSyCeiIBgmX4KKhdQlwyyXCoI-zGZdFc0aso",
        authDomain: "evaluacion-cielo.firebaseapp.com",
        projectId: "evaluacion-cielo",
        storageBucket: "evaluacion-cielo.firebasestorage.app",
        messagingSenderId: "1071771625909",
        appId: "1:1071771625909:web:d939265ad6a8e063b3d1fc"
    };

    // Inicializar la aplicación
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Colección en la base de datos
    const reservasRef = db.collection('reservas_accesos');

    // 2. LÓGICA PARA GUARDAR DATOS
    document.getElementById('reservaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btnGuardar = document.getElementById('btnGuardar');
        btnGuardar.textContent = 'Guardando registro...';
        btnGuardar.disabled = true;

        const nuevaReserva = {
            nombre: document.getElementById('nombre').value.toUpperCase(),
            actividad: document.getElementById('actividad').value,
            fecha: document.getElementById('fecha').value,
            hora: document.getElementById('hora').value,
            estado: 'Pendiente', 
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await reservasRef.add(nuevaReserva);
            document.getElementById('reservaForm').reset();
            document.getElementById('fecha').value = new Date().toISOString().split('T')[0]; // Restaurar fecha de hoy
        } catch (error) {
            console.error("Error al guardar: ", error);
            alert("Ocurrió un error al intentar guardar. Revisa tu conexión o las reglas de tu base de datos en Firebase.");
        } finally {
            btnGuardar.textContent = 'Guardar Reserva';
            btnGuardar.disabled = false;
        }
    });

    // 3. LÓGICA PARA LEER Y FILTRAR DATOS EN TIEMPO REAL
    let filtroActual = 'Todas';

    function filtrarActividad(actividad, event) {
        filtroActual = actividad;
        
        // Estilos visuales de los botones de filtro
        const botones = document.querySelectorAll('.filters button');
        botones.forEach(btn => btn.classList.remove('active'));
        if(event) event.target.classList.add('active');
        
        cargarDatos();
    }

    function cargarDatos() {
        const fechaHoy = new Date().toISOString().split('T')[0];
        
        // Escucha en tiempo real solo las reservas del día de hoy, ordenadas por hora
        reservasRef.where("fecha", "==", fechaHoy).orderBy("hora", "asc").onSnapshot((snapshot) => {
            const tbody = document.getElementById('tablaReservas');
            tbody.innerHTML = '';

            snapshot.forEach((doc) => {
                const reserva = doc.data();
                
                // Aplicar filtros
                let mostrar = false;
                if (filtroActual === 'Todas') mostrar = true;
                if (filtroActual === 'Bon (Restaurante)' && reserva.actividad === 'Bon (Restaurante)') mostrar = true;
                if (filtroActual === 'Deportes' && reserva.actividad !== 'Bon (Restaurante)') mostrar = true;

                if (mostrar) {
                    const tr = document.createElement('tr');
                    
                    const estadoClass = reserva.estado === 'Ingresó' ? 'status-entered' : 'status-pending';
                    const textoEstado = reserva.estado === 'Ingresó' ? '✔ Ingresó' : 'Pendiente';
                    
                    // Botón dinámico que el guardia presiona al llegar la persona
                    const botonEstado = `<button class="status-btn ${estadoClass}" onclick="cambiarEstado('${doc.id}', '${reserva.estado}')">${textoEstado}</button>`;

                    tr.innerHTML = `
                        <td><strong>${reserva.nombre}</strong></td>
                        <td>${reserva.actividad}</td>
                        <td>${reserva.hora}</td>
                        <td>${botonEstado}</td>
                    `;
                    tbody.appendChild(tr);
                }
            });
        });
    }

    // 4. LÓGICA PARA ACTUALIZAR EL ESTADO (INGRESO RÁPIDO)
    async function cambiarEstado(idDocumento, estadoActual) {
        const nuevoEstado = estadoActual === 'Pendiente' ? 'Ingresó' : 'Pendiente';
        try {
            await reservasRef.doc(idDocumento).update({
                estado: nuevoEstado
            });
        } catch (error) {
            console.error("Error al actualizar el estado de ingreso:", error);
        }
    }

    // Iniciar con la fecha de hoy por defecto
    document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
    cargarDatos();

</script>
</body>
</html>
