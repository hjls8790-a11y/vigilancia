<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Accesos - Reservas y Actividades</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #eef2f7; 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }
        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: white; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        h1, h2 { color: #1a365d; text-align: center; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group { display: flex; flex-direction: column; }
        .full-width { grid-column: span 2; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select, button { 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 15px;
            box-sizing: border-box; 
        }
        .btn-submit { 
            grid-column: span 2;
            background-color: #2b6cb0; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            border: none; 
            transition: 0.3s;
        }
        .btn-submit:hover { background-color: #1a365d; }
        .btn-submit:disabled { background-color: #a0aec0; cursor: not-allowed; }
        
        /* Estilos para la sección de invitados */
        .seccion-invitados {
            background: #f7fafc; padding: 15px; border-radius: 6px; border: 1px dashed #a0aec0; display: none;
        }
        .guest-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .guest-row input { flex: 1; }
        .btn-add-guest { background-color: #48bb78; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-add-guest:hover { background-color: #38a169; }
        .btn-remove-guest { background-color: #e53e3e; color: white; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        
        .filters-container {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
            flex-wrap: wrap; gap: 15px; background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0;
        }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
        .filters button { 
            flex: 1; background-color: #4a5568; color: white; border: none; padding: 10px;
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .filters button.active { background-color: #2b6cb0; }
        .date-filter { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #2b6cb0; color: white; }
        tr:hover { background-color: #f7fafc; }
        
        .status-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .status-pending { background-color: #ecc94b; color: #744210; }
        .status-entered { background-color: #48bb78; color: white; }
        .folio-badge { font-family: monospace; background: #edf2f7; padding: 3px 6px; border-radius: 4px; font-size: 13px; color: #2d3748; }

        /* Estilos del Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 8px; text-align: center; max-width: 450px; width: 90%;
            box-shadow: 0 10px 15px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
        }
        .modal-content h3 { color: #2b6cb0; margin-top: 0; }
        .folio-box { background: #f7fafc; border: 1px dashed #cbd5e0; padding: 15px; margin: 15px 0; border-radius: 6px; text-align: left; }
        .folio-box p { margin: 8px 0; font-size: 15px; }
        .folio-box strong { color: #1a365d; }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; flex-direction: column; }
        .btn-whatsapp { background-color: #25D366; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
        .btn-whatsapp:hover { background-color: #128C7E; }
        .btn-close { background-color: #e2e8f0; color: #4a5568; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-close:hover { background-color: #cbd5e0; }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
    <h1>Plataforma de Accesos Operativos</h1>
    
    <h2>Nueva Reserva</h2>
    <form id="reservaForm">
        <div class="form-grid">
            <div class="form-group">
                <label id="lblNombre" for="nombre">Nombre del Comensal / Socio</label>
                <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
            </div>
            <div class="form-group">
                <label for="actividad">Destino / Actividad</label>
                <select id="actividad" required>
                    <option value="Bon (Restaurante)">Bon (Restaurante)</option>
                    <option value="Yoga">Yoga</option>
                    <option value="Pádel">Pádel</option>
                    <option value="Tenis">Tenis</option>
                    <option value="Pickleball">Pickleball</option>
                    <option value="Natación">Natación</option>
                    <option value="Fútbol">Fútbol</option>
                    <option value="Básquetbol">Básquetbol</option>
                    <option value="Masterclass">Masterclass</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" required>
            </div>
            <div class="form-group">
                <label for="hora">Hora</label>
                <input type="time" id="hora" required>
            </div>

            <!-- Sección Dinámica de Invitados -->
            <div class="form-group full-width seccion-invitados" id="seccionInvitados">
                <label>Lista de Invitados (Máximo 20)</label>
                <div id="contenedorInvitados"></div>
                <button type="button" class="btn-add-guest" onclick="agregarInvitado()">+ Añadir Invitado</button>
            </div>

            <button type="submit" class="btn-submit" id="btnGuardar">Guardar Reserva</button>
        </div>
    </form>

    <h2>Historial y Directorio de Accesos</h2>
    <div class="filters-container">
        <div class="filters" id="filtrosContenedor">
            <button class="active" onclick="filtrarActividad('Todas', event)">Todas las áreas</button>
            <button onclick="filtrarActividad('Bon (Restaurante)', event)">Restaurante Bon</button>
            <button onclick="filtrarActividad('Deportes', event)">Deportes y Clases</button>
        </div>
        <div class="date-filter">
            <label for="fechaHistorial">Ver fecha:</label>
            <input type="date" id="fechaHistorial" onchange="cargarDatos()">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Folio Caseta</th>
                <th>Nombre</th>
                <th>Destino</th>
                <th>Hora</th>
                <th>Control de Ingreso</th>
            </tr>
        </thead>
        <tbody id="tablaReservas">
            <!-- Los datos se inyectarán aquí dinámicamente -->
        </tbody>
    </table>
</div>

<!-- Ventana Emergente (Modal) -->
<div class="modal-overlay" id="modalFolio">
    <div class="modal-content">
        <h3>✅ Reserva Confirmada</h3>
        <p>Folios generados con éxito.</p>
        <div class="folio-box">
            <p><strong>Folio Cliente:</strong> <span id="txtFolioCliente">---</span></p>
            <p><strong>Folio Caseta:</strong> <span id="txtFolioCaseta">---</span></p>
            <hr style="border: 0; border-top: 1px solid #cbd5e0; margin: 10px 0;">
            <p><strong>Socio/Visitante:</strong> <span id="txtModalNombre"></span></p>
            <p><strong>Área:</strong> <span id="txtModalArea"></span></p>
            <p><strong>Hora:</strong> <span id="txtModalHora"></span></p>
            <div id="txtModalInvitados"></div>
        </div>
        
        <div class="modal-actions">
            <button class="btn-whatsapp" id="btnWhatsapp">📲 Enviar Accesos por WhatsApp</button>
            <button class="btn-close" onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>
</div>

<script>
    // 1. CONFIGURACIÓN DE FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyCeiIBgmX4KKhdQlwyyXCoI-zGZdFc0aso",
        authDomain: "evaluacion-cielo.firebaseapp.com",
        projectId: "evaluacion-cielo",
        storageBucket: "evaluacion-cielo.firebasestorage.app",
        messagingSenderId: "1071771625909",
        appId: "1:1071771625909:web:d939265ad6a8e063b3d1fc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const reservasRef = db.collection('reservas_accesos');

    // 2. LÓGICA DE INVITADOS DINÁMICOS
    const actSelect = document.getElementById('actividad');
    const secInvitados = document.getElementById('seccionInvitados');
    const lblNombre = document.getElementById('lblNombre');
    let contadorInvitados = 0;

    actSelect.addEventListener('change', () => {
        if (actSelect.value === 'Bon (Restaurante)') {
            secInvitados.style.display = 'none';
            document.getElementById('contenedorInvitados').innerHTML = '';
            contadorInvitados = 0;
            lblNombre.textContent = "Nombre del Comensal / Cliente";
        } else {
            secInvitados.style.display = 'block';
            lblNombre.textContent = "Nombre del Socio Titular";
        }
    });

    function agregarInvitado() {
        if (contadorInvitados >= 20) {
            alert('Se ha alcanzado el límite máximo de 20 invitados.');
            return;
        }
        contadorInvitados++;
        const div = document.createElement('div');
        div.className = 'guest-row';
        div.innerHTML = `
            <input type="text" class="input-invitado" placeholder="Nombre completo del invitado" required>
            <button type="button" class="btn-remove-guest" onclick="removerInvitado(this)">X</button>
        `;
        document.getElementById('contenedorInvitados').appendChild(div);
    }

    function removerInvitado(btn) {
        btn.parentElement.remove();
        contadorInvitados--;
    }

    function generarFolioBase() {
        return Math.random().toString(36).substring(2, 7).toUpperCase();
    }

    // 3. LÓGICA PARA GUARDAR DATOS
    document.getElementById('reservaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btnGuardar = document.getElementById('btnGuardar');
        btnGuardar.textContent = 'Guardando registro...';
        btnGuardar.disabled = true;

        const codigoBase = generarFolioBase();
        const folioCliente = "CLI-" + codigoBase;
        const folioCaseta = "CAS-" + codigoBase;
        
        const nombreVal = document.getElementById('nombre').value.toUpperCase();
        const actividadVal = document.getElementById('actividad').value;
        const fechaVal = document.getElementById('fecha').value;
        const horaVal = document.getElementById('hora').value;

        // Recopilar invitados
        const inputsInv = document.querySelectorAll('.input-invitado');
        const listaInvitados = Array.from(inputsInv).map(input => input.value.toUpperCase());

        const nuevaReserva = {
            folioBase: codigoBase,
            nombre: nombreVal,
            actividad: actividadVal,
            fecha: fechaVal,
            hora: horaVal,
            invitados: listaInvitados,
            estado: 'Pendiente', 
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await reservasRef.add(nuevaReserva);
            
            // Llenar Modal
            document.getElementById('txtFolioCliente').textContent = folioCliente;
            document.getElementById('txtFolioCaseta').textContent = folioCaseta;
            document.getElementById('txtModalNombre').textContent = nombreVal;
            document.getElementById('txtModalArea').textContent = actividadVal;
            document.getElementById('txtModalHora').textContent = horaVal;

            let modalInvitadosHtml = '';
            let wappInvitadosText = '';
            
            if (listaInvitados.length > 0) {
                modalInvitadosHtml = `<p><strong>Invitados (${listaInvitados.length}):</strong><br> - ${listaInvitados.join('<br> - ')}</p>`;
                wappInvitadosText = `\n*Invitados autorizados (${listaInvitados.length}):*\n- ${listaInvitados.join('\n- ')}\n`;
            }
            document.getElementById('txtModalInvitados').innerHTML = modalInvitadosHtml;
            
            // Configurar WhatsApp
            const mensajeWapp = `*Confirmación de Accesos - Cielo Park*\n\n` +
                                `*Socio/Comensal:* ${nombreVal}\n` +
                                `*Área/Actividad:* ${actividadVal}\n` +
                                `*Fecha:* ${fechaVal}\n` +
                                `*Hora:* ${horaVal}\n` +
                                wappInvitadosText + `\n` +
                                `*Folio Cliente:* ${folioCliente}\n` +
                                `*Folio Caseta:* ${folioCaseta}\n\n` +
                                `Por favor, muestre estos folios en la caseta de vigilancia para agilizar su ingreso.`;
            
            const numeroDestino = "526695931812";
            const urlWhatsApp = `https://wa.me/${numeroDestino}?text=${encodeURIComponent(mensajeWapp)}`;
            
            document.getElementById('btnWhatsapp').onclick = () => { window.open(urlWhatsApp, '_blank'); };

            // Reset y visualización
            document.getElementById('modalFolio').style.display = 'flex';
            document.getElementById('reservaForm').reset();
            document.getElementById('contenedorInvitados').innerHTML = '';
            contadorInvitados = 0;
            secInvitados.style.display = 'none';
            document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
            
        } catch (error) {
            console.error("Error al guardar: ", error);
            alert("Ocurrió un error al intentar guardar.");
        } finally {
            btnGuardar.textContent = 'Guardar Reserva';
            btnGuardar.disabled = false;
        }
    });

    function cerrarModal() { document.getElementById('modalFolio').style.display = 'none'; }

    // 4. LÓGICA PARA LEER Y FILTRAR DATOS
    let filtroActual = 'Todas';
    let unsuscribe = null;

    function filtrarActividad(actividad, event) {
        filtroActual = actividad;
        const botones = document.querySelectorAll('.filters button');
        botones.forEach(btn => btn.classList.remove('active'));
        if(event) event.target.classList.add('active');
        cargarDatos();
    }

    function cargarDatos() {
        const fechaSeleccionada = document.getElementById('fechaHistorial').value;
        if (unsuscribe) unsuscribe();
        
        unsuscribe = reservasRef.where("fecha", "==", fechaSeleccionada).onSnapshot((snapshot) => {
            const tbody = document.getElementById('tablaReservas');
            tbody.innerHTML = '';

            if(snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#718096;">No hay registros para esta fecha.</td></tr>';
                return;
            }

            let registros = [];
            snapshot.forEach((doc) => { registros.push({ id: doc.id, ...doc.data() }); });
            registros.sort((a, b) => a.hora.localeCompare(b.hora));

            registros.forEach((reserva) => {
                let mostrar = false;
                if (filtroActual === 'Todas') mostrar = true;
                if (filtroActual === 'Bon (Restaurante)' && reserva.actividad === 'Bon (Restaurante)') mostrar = true;
                if (filtroActual === 'Deportes' && reserva.actividad !== 'Bon (Restaurante)') mostrar = true;

                if (mostrar) {
                    const tr = document.createElement('tr');
                    
                    const estadoClass = reserva.estado === 'Ingresó' ? 'status-entered' : 'status-pending';
                    const textoEstado = reserva.estado === 'Ingresó' ? '✔ Ingresó' : 'Pendiente';
                    const botonEstado = `<button class="status-btn ${estadoClass}" onclick="cambiarEstado('${reserva.id}', '${reserva.estado}')">${textoEstado}</button>`;
                    
                    const displayFolio = reserva.folioBase ? `CAS-${reserva.folioBase}` : 'N/A';
                    
                    // Mostrar indicador visual si trae invitados
                    const badgeInvitados = (reserva.invitados && reserva.invitados.length > 0) 
                        ? `<br><small style="color:#718096; font-weight:normal;">(+${reserva.invitados.length} invitados)</small>` 
                        : '';

                    tr.innerHTML = `
                        <td><span class="folio-badge">${displayFolio}</span></td>
                        <td><strong>${reserva.nombre}</strong>${badgeInvitados}</td>
                        <td>${reserva.actividad}</td>
                        <td>${reserva.hora}</td>
                        <td>${botonEstado}</td>
                    `;
                    tbody.appendChild(tr);
                }
            });
        });
    }

    async function cambiarEstado(idDocumento, estadoActual) {
        const nuevoEstado = estadoActual === 'Pendiente' ? 'Ingresó' : 'Pendiente';
        try { await reservasRef.doc(idDocumento).update({ estado: nuevoEstado }); } 
        catch (error) { console.error("Error al actualizar el estado:", error); }
    }

    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('fecha').value = hoy;
    document.getElementById('fechaHistorial').value = hoy;
    cargarDatos();

</script>
</body>
</html>
