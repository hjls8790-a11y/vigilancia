<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE SEGURIDAD</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a2a3a; color: white; padding: 15px; margin: 0; }
        .card { background: #2c3e50; padding: 20px; border-radius: 12px; border-top: 8px solid #3498db; max-width: 450px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #ecf0f1; margin: 0 0 20px 0; font-size: 22px; text-transform: uppercase; }
        label { font-size: 14px; color: #bdc3c7; display: block; margin-bottom: 5px; font-weight: bold; }
        select, input, textarea { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #444; background: #1a2a3a; color: white; box-sizing: border-box; font-size: 16px; }
        
        /* Botones */
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; width: 100%; color: white; }
        .btn-entrada { background: #27ae60; }
        .btn-salida { background: #c0392b; }
        .btn-iniciar { background: #2980b9; }
        .btn-punto { background: #f39c12; }
        .btn-foto { background: #8e44ad; margin-bottom: 10px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Panel de Recorrido Activo */
        #panelRecorrido { display: none; background: #34495e; padding: 15px; border-radius: 8px; border: 2px dashed #f39c12; margin-top: 20px; }
        #preview { width: 100%; border-radius: 8px; margin-bottom: 15px; display: none; }
        #statusBox { text-align: center; font-size: 13px; color: #f1c40f; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ Residencial El Cielo</h2>
        
        <label>📍 SECTOR DE SERVICIO</label>
        <select id="sector">
            <option value="Residencial El Cielo">Residencial El Cielo</option>
            <option value="Club Cardones">Club Cardones</option>
            <option value="Obras Fotur">Obras Fotur</option>
        </select>
        
        <label>👮 NOMBRE DEL AGENTE</label>
        <input type="text" id="oficial" placeholder="Escribe tu nombre completo..." required>
        
        <div id="controlesPrincipales">
            <div class="btn-group">
                <button class="btn btn-entrada" onclick="registrar('ENTRADA')">📥 ENTRADA</button>
                <button class="btn btn-salida" onclick="registrar('SALIDA')">📤 SALIDA</button>
            </div>
            <button class="btn btn-iniciar" onclick="iniciarRecorrido()">🟢 INICIAR RECORRIDO</button>
        </div>

        <div id="panelRecorrido">
            <h3 style="color:#f39c12; text-align:center; margin-top:0;">🚶‍♂️ RONDÍN EN CURSO</h3>
            <label>📝 Novedades del Punto</label>
            <textarea id="novedad" placeholder="Describe lo que observas..."></textarea>
            
            <input type="file" id="input_foto" accept="image/*" capture="environment" style="display:none;" onchange="verFoto(event)">
            <button class="btn btn-foto" onclick="document.getElementById('input_foto').click()">📷 TOMAR FOTO EVIDENCIA</button>
            <img id="preview">

            <button class="btn btn-punto" onclick="marcarPunto()" style="margin-bottom: 10px;">📍 MARCAR PUNTO</button>
            <button class="btn btn-salida" onclick="finalizarRecorrido()">🛑 FINALIZAR RECORRIDO</button>
        </div>

        <div id="statusBox">Esperando acción...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", 
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com", 
            projectId: "sistema-vigilancia-6851e", 
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", 
            messagingSenderId: "714792023462", 
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let fotoBase64 = "NO";
        let idRecorrido = localStorage.getItem('id_rondin_activo');

        // Restaurar estado si se recarga la página
        if(idRecorrido) {
            document.getElementById('controlesPrincipales').style.display = 'none';
            document.getElementById('panelRecorrido').style.display = 'block';
            document.getElementById('sector').disabled = true;
            document.getElementById('oficial').disabled = true;
            document.getElementById('oficial').value = localStorage.getItem('nombre_agente') || '';
            document.getElementById('sector').value = localStorage.getItem('sector_agente') || 'Residencial El Cielo';
        }

        // Obtener GPS exacto al momento de presionar el botón
        const obtenerGPS = () => {
            return new Promise((resolve, reject) => {
                document.getElementById('statusBox').innerText = "📍 Obteniendo ubicación GPS...";
                navigator.geolocation.getCurrentPosition(
                    pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                    err => reject(err),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        };

        window.verFoto = (e) => {
            const reader = new FileReader();
            reader.onload = () => { 
                fotoBase64 = reader.result; 
                const img = document.getElementById('preview');
                img.src = fotoBase64; img.style.display = 'block';
            };
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        };

        // Función Maestra para guardar en Firebase
        const guardarEnBD = async (tipo, novedad = "Sin novedad") => {
            const oficial = document.getElementById('oficial').value.trim();
            const sector = document.getElementById('sector').value;
            if(!oficial) return alert("Ingresa el nombre del agente.");

            try {
                const coords = await obtenerGPS();
                document.getElementById('statusBox').innerText = "☁️ Conectando con la Central...";
                
                await addDoc(collection(db, "recorridos"), {
                    id_recorrido: idRecorrido || "NO_APLICA",
                    oficial: oficial,
                    sector: sector,
                    tipo: tipo,
                    novedad: novedad,
                    evidencia_foto: fotoBase64,
                    latitud: coords.lat,
                    longitud: coords.lng,
                    fecha_hora: new Date().toLocaleString('es-MX'),
                    timestamp: Date.now()
                });

                document.getElementById('statusBox').innerText = `✅ ${tipo} registrado con éxito.`;
                fotoBase64 = "NO";
                document.getElementById('preview').style.display = 'none';
                document.getElementById('novedad').value = "";
                return true;
            } catch (error) {
                document.getElementById('statusBox').innerText = "❌ Error: Activa tu GPS y revisa tu internet.";
                console.error(error);
                return false;
            }
        };

        // Acciones de los botones
        window.registrar = async (tipo) => {
            if(await guardarEnBD(tipo, `Registro de ${tipo} al servicio.`)) {
                alert(`✅ ${tipo} registrada correctamente en sitio.`);
            }
        };

        window.iniciarRecorrido = async () => {
            const oficial = document.getElementById('oficial').value.trim();
            const sector = document.getElementById('sector').value;
            if(!oficial) return alert("Ingresa el nombre del agente.");

            idRecorrido = "REC-" + Date.now();
            localStorage.setItem('id_rondin_activo', idRecorrido);
            localStorage.setItem('nombre_agente', oficial);
            localStorage.setItem('sector_agente', sector);

            if(await guardarEnBD('INICIO_RECORRIDO', 'Inicio de rondín.')) {
                document.getElementById('controlesPrincipales').style.display = 'none';
                document.getElementById('panelRecorrido').style.display = 'block';
                document.getElementById('sector').disabled = true;
                document.getElementById('oficial').disabled = true;
            } else {
                localStorage.removeItem('id_rondin_activo'); // Revertir si falla
            }
        };

        window.marcarPunto = async () => {
            const nov = document.getElementById('novedad').value || "Punto de control sin novedad";
            if(await guardarEnBD('PUNTO', nov)) {
                alert("📍 Punto guardado en el mapa.");
            }
        };

        window.finalizarRecorrido = async () => {
            if(!confirm("¿Seguro que deseas terminar el rondín?")) return;
            
            if(await guardarEnBD('FIN_RECORRIDO', 'Fin de rondín.')) {
                localStorage.removeItem('id_rondin_activo');
                localStorage.removeItem('nombre_agente');
                localStorage.removeItem('sector_agente');
                alert("🛑 Recorrido finalizado.");
                location.reload();
            }
        };
    </script>
</body>
</html>
