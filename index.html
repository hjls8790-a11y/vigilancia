<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Vigilancia Hugo V5</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { height: 100%; margin: 0; font-family: sans-serif; }
        #map { height: 100%; width: 100%; }
        #control-panel { position: absolute; bottom: 0; width: 100%; background: white; padding: 15px; box-sizing: border-box; z-index: 1000; border-radius: 20px 20px 0 0; }
        .btn { width: 100%; padding: 15px; margin: 5px 0; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; color: white; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #007bff; display: none; }
        .btn-red { background: #dc3545; display: none; }
        #status { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: white; padding: 10px; border-radius: 8px; z-index: 1000; font-size: 12px; }
        #form-novedad { display: none; position: fixed; top: 20%; left: 5%; width: 90%; background: white; padding: 20px; border-radius: 15px; z-index: 2000; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="status">Esperando inicio...</div>
    <div id="map"></div>

    <div id="form-novedad">
        <h3>Reportar Novedad</h3>
        <input type="text" id="nota" placeholder="Escribe aquí..." style="width:100%; padding:10px; margin-bottom:10px;">
        <button class="btn btn-green" onclick="guardarNovedad()">Listo</button>
        <button class="btn" style="background:#666" onclick="cerrarForm()">Cancelar</button>
    </div>

    <div id="control-panel">
        <button id="btnStart" class="btn btn-green" onclick="iniciar()">Iniciar Rondín</button>
        <button id="btnNovedad" class="btn btn-blue" onclick="abrirForm()">📷 Registrar Novedad</button>
        <button id="btnStop" class="btn btn-red" onclick="finalizar()">Finalizar y Enviar a Central</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let mapa = L.map('map').setView([24.8, -107.3], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
        
        let trayecto = [];
        let novedades = [];
        let polyline = L.polyline([], {color: 'blue'}).addTo(mapa);
        let watchId = null;
        let tInicio;

        window.iniciar = function() {
            tInicio = new Date();
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnNovedad').style.display = 'block';
            document.getElementById('btnStop').style.display = 'block';
            
            watchId = navigator.geolocation.watchPosition(pos => {
                let p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                trayecto.push(p);
                polyline.setLatLngs(trayecto.map(x => [x.lat, x.lng]));
                mapa.setView([p.lat, p.lng], 17);
                document.getElementById('status').innerText = "Rondín en curso... Puntos: " + trayecto.length;
            }, err => console.error(err), { enableHighAccuracy: true });
        };

        window.abrirForm = () => document.getElementById('form-novedad').style.display = 'block';
        window.cerrarForm = () => document.getElementById('form-novedad').style.display = 'none';

        window.guardarNovedad = function() {
            let texto = document.getElementById('nota').value || "Sin texto";
            navigator.geolocation.getCurrentPosition(pos => {
                novedades.push({
                    msg: texto,
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    hora: new Date().toLocaleTimeString()
                });
                L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(mapa).bindPopup(texto);
                cerrarForm();
                document.getElementById('nota').value = "";
            });
        };

        window.finalizar = async function() {
            if(!confirm("¿Deseas finalizar y enviar los datos?")) return;
            
            navigator.geolocation.clearWatch(watchId);
            document.getElementById('status').innerText = "CONECTANDO CON CENTRAL...";
            
            try {
                // Enviamos solo datos de texto (esto es instantáneo y no falla)
                await addDoc(collection(db, "rondines"), {
                    oficial: "Hugo_Vigilancia",
                    inicio: tInicio.toLocaleString(),
                    fin: new Date().toLocaleString(),
                    puntos_gps: trayecto,
                    reportes: novedades
                });
                
                document.getElementById('status').innerText = "¡ENVÍO EXITOSO!";
                alert("Rondín guardado correctamente en la base de datos.");
                location.reload();
            } catch (error) {
                alert("Error de conexión: " + error.message);
                document.getElementById('status').innerText = "ERROR AL ENVIAR";
            }
        };
    </script>
</body>
</html>
