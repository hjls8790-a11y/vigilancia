<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Vigilancia - Registro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { height: 100%; margin: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 60%; width: 100%; }
        #control-panel { height: 40%; background: white; padding: 20px; box-sizing: border-box; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        .btn { width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; color: white; cursor: pointer; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #007bff; display: none; }
        .btn-red { background: #dc3545; display: none; }
        #status { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: white; padding: 10px; border-radius: 8px; z-index: 1000; font-size: 14px; }
        #form-novedad { display: none; position: fixed; top: 15%; left: 5%; width: 90%; background: white; padding: 25px; border-radius: 15px; z-index: 2000; box-shadow: 0 0 30px rgba(0,0,0,0.5); box-sizing: border-box; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="status">Esperando para iniciar...</div>
    <div id="map"></div>

    <div id="form-novedad">
        <h3>📝 Registrar Novedad</h3>
        <input type="text" id="nota" placeholder="¿Qué ocurrió? (Ej: Puerta abierta)">
        <button class="btn btn-green" onclick="guardarNovedad()">GUARDAR REPORTE</button>
        <button class="btn" style="background:#666" onclick="cerrarForm()">CANCELAR</button>
    </div>

    <div id="control-panel">
        <button id="btnStart" class="btn btn-green" onclick="iniciar()">🚀 INICIAR RONDÍN</button>
        <button id="btnNovedad" class="btn btn-blue" onclick="abrirForm()">📸 NOTAR NOVEDAD</button>
        <button id="btnStop" class="btn btn-red" onclick="finalizar()">✅ FINALIZAR Y ENVIAR</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- IDENTIFICACIÓN DEL GUARDIA ---
        const urlParams = new URLSearchParams(window.location.search);
        const nombreGuardia = urlParams.get('id') || "Guardia_General";

        let mapa = L.map('map').setView([24.8, -107.3], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
        
        let trayecto = [];
        let novedades = [];
        let polyline = L.polyline([], {color: 'blue', weight: 5}).addTo(mapa);
        let watchId = null;
        let tInicio;

        window.iniciar = function() {
            tInicio = new Date();
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnNovedad').style.display = 'block';
            document.getElementById('btnStop').style.display = 'block';
            document.getElementById('status').innerText = "Oficial: " + nombreGuardia + " | En ruta...";
            
            watchId = navigator.geolocation.watchPosition(pos => {
                let p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                trayecto.push(p);
                polyline.setLatLngs(trayecto.map(x => [x.lat, x.lng]));
                mapa.setView([p.lat, p.lng], 17);
            }, err => console.error(err), { enableHighAccuracy: true });
        };

        window.abrirForm = () => document.getElementById('form-novedad').style.display = 'block';
        window.cerrarForm = () => document.getElementById('form-novedad').style.display = 'none';

        window.guardarNovedad = function() {
            let texto = document.getElementById('nota').value || "Sin descripción";
            navigator.geolocation.getCurrentPosition(pos => {
                const nuevaNovedad = {
                    msg: String(texto),
                    lat: Number(pos.coords.latitude),
                    lng: Number(pos.coords.longitude),
                    hora: new Date().toLocaleTimeString()
                };
                novedades.push(nuevaNovedad);
                L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(mapa).bindPopup(texto).openPopup();
                cerrarForm();
                document.getElementById('nota').value = "";
                alert("Novedad anotada.");
            }, null, { enableHighAccuracy: true });
        };

        window.finalizar = async function() {
            if(!confirm("¿Confirmas que terminaste el rondín?")) return;
            navigator.geolocation.clearWatch(watchId);
            document.getElementById('status').innerText = "ENVIANDO A CENTRAL...";
            
            try {
                await addDoc(collection(db, "rondines"), {
                    oficial: nombreGuardia,
                    inicio: tInicio.toLocaleString(),
                    fin: new Date().toLocaleString(),
                    puntos_gps: trayecto.map(p => ({lat: p.lat, lng: p.lng})),
                    reportes: novedades.map(r => ({msg: r.msg, lat: r.lat, lng: r.lng, hora: r.hora}))
                });
                alert("Rondín enviado con éxito.");
                location.reload();
            } catch (e) {
                alert("Error crítico: " + e.message);
            }
        };
    </script>
</body>
</html>
