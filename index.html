<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO DE RONDÍN</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a2a3a; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #2c3e50; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #f1c40f; margin-top: 0; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: none; box-sizing: border-box; font-size: 16px; }
        
        .foto-container { border: 2px dashed #3498db; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; background: #34495e; }
        #btn-foto-label { cursor: pointer; color: #3498db; font-weight: bold; display: block; }
        #preview { max-width: 100%; height: 150px; display: none; margin: 10px auto; border-radius: 5px; border: 1px solid #fff; object-fit: cover; }
        
        #btnGuardar { background: #27ae60; color: white; border: none; width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        #btnGuardar:disabled { background: #7f8c8d; }
        .status { font-size: 12px; text-align: center; margin-top: 10px; color: #bdc3c7; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛡️ REGISTRO RONDÍN</h2>
        
        <label>👮‍♂️ Nombre del Oficial</label>
        <input type="text" id="oficial" placeholder="Tu nombre..." required>

        <label>📍 Sector / Ubicación</label>
        <select id="sector">
            <option value="General">General / Perímetro</option>
            <option value="Cardones">Club Cardones</option>
            <option value="Fotur">Obra FOTUR</option>
        </select>

        <label>📝 Novedades u Observaciones</label>
        <textarea id="novedad" placeholder="Escribe si todo está bien o hay algún reporte..."></textarea>

        <div class="foto-container">
            <label id="btn-foto-label" for="input_foto">📷 AGREGAR FOTO (OPCIONAL)</label>
            <input type="file" id="input_foto" accept="image/*" capture="environment" style="display:none;" onchange="procesarFoto(event)">
            <img id="preview" src="">
            <div id="status-foto" style="font-size: 11px; margin-top: 5px;">Sin imagen</div>
        </div>

        <button id="btnGuardar" onclick="enviarRegistro()">INICIAR / MARCAR PUNTO</button>
        <div class="status" id="gps-status">Esperando señal GPS...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let fotoBase64 = "NO";
        let lat = 0, lng = 0;

        // Obtener ubicación GPS constante
        navigator.geolocation.watchPosition(p => {
            lat = p.coords.latitude;
            lng = p.coords.longitude;
            document.getElementById('gps-status').innerText = "📍 GPS Activo: " + lat.toFixed(5) + ", " + lng.toFixed(5);
            document.getElementById('gps-status').style.color = "#2ecc71";
        }, e => {
            document.getElementById('gps-status').innerText = "❌ Error GPS: Activa tu ubicación";
            document.getElementById('gps-status').style.color = "#e74c3c";
        }, { enableHighAccuracy: true });

        // Procesar y Comprimir Foto
        window.procesarFoto = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    let w = img.width, h = img.height;
                    if (w > MAX_WIDTH) { h = Math.round((h * MAX_WIDTH) / w); w = MAX_WIDTH; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    fotoBase64 = canvas.toDataURL('image/jpeg', 0.5); // Calidad 50%
                    document.getElementById('preview').src = fotoBase64;
                    document.getElementById('preview').style.display = 'block';
                    document.getElementById('status-foto').innerText = "✅ Foto lista";
                }
            }
        };

        window.enviarRegistro = async function() {
            const oficial = document.getElementById('oficial').value;
            if(!oficial || lat === 0) return alert("Escribe tu nombre y espera al GPS");

            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;
            btn.innerText = "Guardando...";

            try {
                const ahora = new Date();
                await addDoc(collection(db, "recorridos"), {
                    oficial: oficial,
                    sector: document.getElementById('sector').value,
                    novedad: document.getElementById('novedad').value || "Sin novedad",
                    evidencia_foto: fotoBase64,
                    latitud: lat,
                    longitud: lng,
                    fecha_hora: ahora.toLocaleString('es-MX'),
                    timestamp: ahora.getTime()
                });
                alert("✅ Punto registrado con éxito");
                location.reload();
            } catch (error) {
                alert("Error al guardar");
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
