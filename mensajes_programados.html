<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despacho de Comunicaciones - El Cielo</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--card-bg); padding: 15px 25px; border-radius: 8px; margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); flex-wrap: wrap; gap: 15px;
        }
        
        .card { background-color: var(--card-bg); padding: 25px; border-radius: 10px; max-width: 800px; margin: 0 auto 20px auto; border: 1px solid #334155; }

        .flex-group { display: flex; gap: 15px; margin-bottom: 15px; }
        .flex-group > div { flex: 1; }

        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-muted); font-size: 14px; }
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569;
            background-color: #0f172a; color: white; font-size: 15px; margin-bottom: 15px;
        }
        
        .btn-action {
            width: 100%; padding: 16px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold;
            color: white; cursor: pointer; background-color: var(--primary); margin-bottom: 10px;
        }
        .btn-action:hover { opacity: 0.9; }

        /* Tabla de Cola de Mensajes */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { background-color: #0f172a; color: var(--text-muted); }
        tr:hover { background-color: #334155; }

        .badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .badge-pending { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-sent { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }

        .btn-send-now { background-color: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-delete { background-color: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .indicador-actividad { font-size: 12px; color: var(--success); display: flex; align-items: center; gap: 5px; }
        .punto-verde { width: 10px; height: 10px; background-color: var(--success); border-radius: 50%; animation: latido 1.5s infinite; }
        @keyframes latido { 0% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.7; } }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0;">⏱️ Programador de Comunicaciones Operativas</h2>
        <div class="indicador-actividad">
            <div class="punto-verde"></div> Monitor de envíos activo
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top:0; color: var(--primary); border-bottom: 1px solid #334155; padding-bottom: 10px;">Programar Nuevo Mensaje</h3>
        
        <div class="flex-group">
            <div>
                <label for="destinatario">Destinatario Estratégico:</label>
                <select id="destinatario" onchange="verificarOtro()">
                    <option value="525532749860">Administración</option>
                    <option value="526699949409">Manrry</option>
                    <option value="526691232901">Mantenimiento</option>
                    <option value="526692486726">Compañero de Turno</option>
                    <option value="526691277390">Otro Número...</option>
                </select>
            </div>
            <div id="div-numero-otro" style="display:none;">
                <label for="numero_personalizado">Ingresar Número (con 52):</label>
                <input type="number" id="numero_personalizado" placeholder="Ej. 526691234567">
            </div>
        </div>

        <div class="flex-group">
            <div>
                <label>Fecha de Envío:</label>
                <input type="date" id="fecha_envio" required>
            </div>
            <div>
                <label>Hora de Envío (Formato 24h):</label>
                <input type="time" id="hora_envio" required>
            </div>
        </div>

        <label>Contenido del Mensaje:</label>
        <textarea id="texto_mensaje" rows="4" placeholder="Ej. Reporte de turno finalizado sin novedades. El relevo se efectuó correctamente..." required></textarea>

        <button class="btn-action" onclick="programarMensaje()">⏳ Guardar en Cola de Despacho</button>
    </div>

    <div class="card" style="max-width: 100% !important;">
        <h3 style="margin-top:0; color: var(--warning);">Bandeja de Salida (Mensajes en Espera)</h3>
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Programado Para</th>
                        <th>Destino</th>
                        <th>Mensaje</th>
                        <th>Estatus</th>
                        <th>Acción Manual</th>
                    </tr>
                </thead>
                <tbody id="tabla-cola">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = { 
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", 
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com", 
            projectId: "sistema-vigilancia-6851e", 
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", 
            messagingSenderId: "714792023462", 
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" 
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // Inicializar Fecha por defecto
        window.onload = function() {
            let hoy = new Date();
            document.getElementById('fecha_envio').value = hoy.toISOString().split('T')[0];
            // Iniciar el motor que vigila el tiempo cada 30 segundos
            setInterval(motorDespacho, 30000); 
        };

        function verificarOtro() {
            let select = document.getElementById('destinatario').value;
            document.getElementById('div-numero-otro').style.display = (select === "OTRO") ? "block" : "none";
        }

        function programarMensaje() {
            let destinoSelect = document.getElementById('destinatario');
            let nombreDestino = destinoSelect.options[destinoSelect.selectedIndex].text;
            let numeroDestino = destinoSelect.value;
            
            if (numeroDestino === "OTRO") {
                numeroDestino = document.getElementById('numero_personalizado').value.trim();
                nombreDestino = "Número Externo";
            }

            let fecha = document.getElementById('fecha_envio').value;
            let hora = document.getElementById('hora_envio').value;
            let texto = document.getElementById('texto_mensaje').value.trim();

            if(!numeroDestino || !fecha || !hora || !texto) {
                alert("Complete todos los campos para programar el envío."); return;
            }

            // Crear timestamp exacto para comparar fácilmente luego
            let fechaHoraProgramada = new Date(`${fecha}T${hora}:00`);
            let timestampProgramado = fechaHoraProgramada.getTime();

            if (timestampProgramado < Date.now()) {
                alert("No puede programar un mensaje para una hora que ya pasó."); return;
            }

            let reporte = {
                timestamp_creacion: Date.now(),
                timestamp_envio: timestampProgramado,
                fecha_programada: fecha,
                hora_programada: hora,
                nombre_destino: nombreDestino,
                numero_destino: numeroDestino,
                texto: texto,
                estado: "Pendiente" // Puede ser "Pendiente" o "Enviado"
            };

            db.collection("mensajes_programados").add(reporte)
            .then(() => {
                alert("Mensaje encolado correctamente para las " + hora);
                document.getElementById('texto_mensaje').value = "";
            })
            .catch(e => alert("Error: " + e.message));
        }

        // Lector en tiempo real de Firebase para llenar la tabla
        db.collection("mensajes_programados").orderBy("timestamp_envio", "asc").onSnapshot((snapshot) => {
            const tbody = document.getElementById('tabla-cola');
            tbody.innerHTML = "";
            
            snapshot.forEach(doc => {
                let d = doc.data();
                let id = doc.id;
                
                let badge = d.estado === "Pendiente" 
                    ? `<span class="badge badge-pending">⏳ Esperando Hora</span>` 
                    : `<span class="badge badge-sent">✔️ Despachado</span>`;
                
                let trStyle = d.estado === "Enviado" ? "opacity: 0.5;" : "";

                let textoResumen = d.texto.length > 50 ? d.texto.substring(0, 50) + "..." : d.texto;

                tbody.innerHTML += `
                    <tr style="${trStyle}">
                        <td><b>${d.fecha_programada}</b><br>${d.hora_programada} hrs</td>
                        <td><b>${d.nombre_destino}</b><br><span style="font-size:11px; color:var(--text-muted);">${d.numero_destino}</span></td>
                        <td style="font-style:italic;">"${textoResumen}"</td>
                        <td>${badge}</td>
                        <td>
                            ${d.estado === "Pendiente" 
                                ? `<button class="btn-send-now" onclick="despacharMensaje('${id}', '${d.numero_destino}', '${encodeURIComponent(d.texto)}')">▶️ Forzar Envío</button>
                                   <button class="btn-delete" onclick="borrarMensaje('${id}')">🗑️</button>` 
                                : `Completado`
                            }
                        </td>
                    </tr>
                `;
            });
        });

        // MOTOR DE DESPACHO (El cerebro que revisa si ya es hora)
        function motorDespacho() {
            let tiempoActual = Date.now();

            db.collection("mensajes_programados").where("estado", "==", "Pendiente").get()
            .then(snapshot => {
                snapshot.forEach(doc => {
                    let d = doc.data();
                    
                    // Si la hora actual ya superó o igualó la hora programada
                    if (tiempoActual >= d.timestamp_envio) {
                        alert(`¡ATENCIÓN! Es hora de enviar el reporte a: ${d.nombre_destino}`);
                        despacharMensaje(doc.id, d.numero_destino, encodeURIComponent(d.texto));
                    }
                });
            });
        }

        // Ejecutar el envío de WhatsApp y marcar como completado
        function despacharMensaje(idDoc, numero, textoCodificado) {
            // Actualizar estado en Firebase
            db.collection("mensajes_programados").doc(idDoc).update({
                estado: "Enviado",
                timestamp_real_envio: Date.now()
            }).then(() => {
                // Lanzar la API de WhatsApp
                let urlWhatsApp = `https://wa.me/${numero}?text=${textoCodificado}`;
                window.open(urlWhatsApp, '_blank');
            });
        }

        function borrarMensaje(idDoc) {
            if(confirm("¿Seguro que desea cancelar y eliminar este envío programado?")) {
                db.collection("mensajes_programados").doc(idDoc).delete();
            }
        }
    </script>
</body>
</html>
