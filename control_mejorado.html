<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Escoltas - Confirmación de Arribo</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f1f5f9; color: #334155; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .card-movil { background-color: #ffffff; width: 100%; max-width: 400px; padding: 30px 20px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); text-align: center; }
        .header-app { margin-bottom: 30px; }
        .header-app h2 { font-size: 22px; color: #1e293b; margin-bottom: 8px; }
        .header-app p { font-size: 14px; color: #64748b; }
        
        /* Botón Arribo */
        .btn-arribo { width: 100%; min-height: 60px; background-color: #0f766e; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background-color 0.2s ease, transform 0.1s ease; box-shadow: 0 4px 6px -1px rgba(15, 118, 110, 0.3); }
        .btn-arribo:active { background-color: #115e59; transform: scale(0.98); }
        .btn-arribo:disabled { background-color: #94a3b8; cursor: not-allowed; box-shadow: none; }
        
        /* Cajas de mensajes */
        #status-mensaje { margin-top: 20px; font-size: 14px; line-height: 1.5; padding: 12px; border-radius: 8px; display: none; text-align: left; }
        .loading { color: #b45309; background-color: #fef3c7; border: 1px solid #fde68a; }
        .success { color: #15803d; background-color: #dcfce7; border: 1px solid #bbf7d0; }
        .error { color: #b91c1c; background-color: #fee2e2; border: 1px solid #fecaca; }
        
        .input-nombre { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px; text-align: center; outline: none; }
        .input-nombre:focus { border-color: #0f766e; }
    </style>
</head>
<body>

<div class="card-movil">
    <div class="header-app">
        <h2>Módulo de Escoltas</h2>
        <p>Confirmación de Arribo y Geolocalización</p>
    </div>

    <input type="text" id="nombre-escolta" class="input-nombre" placeholder="Escribe tu Nombre / Unidad" required>

    <button id="btn-confirmar" class="btn-arribo" onclick="procesarArribo()">
        CONFIRMAR ARRIBO
    </button>

    <div id="status-mensaje"></div>
</div>

<script type="module">
    // Importamos las herramientas de Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Tu configuración exacta
    const firebaseConfig = { 
        apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", 
        authDomain: "sistema-vigilancia-6851e.firebaseapp.com", 
        projectId: "sistema-vigilancia-6851e", 
        storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", 
        messagingSenderId: "714792023462", 
        appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" 
    };

    // Inicializamos la base de datos
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Hacemos la función accesible para el botón HTML
    window.procesarArribo = function() {
        const nombreEscolta = document.getElementById('nombre-escolta').value.trim();
        const statusDiv = document.getElementById('status-mensaje');
        const btnConfirmar = document.getElementById('btn-confirmar');
        
        if (!nombreEscolta) {
            mostrarError("Por favor, ingresa tu Nombre o Unidad antes de confirmar.");
            return;
        }

        btnConfirmar.disabled = true;
        btnConfirmar.innerText = "OBTENIENDO GPS...";
        statusDiv.style.display = "block";
        statusDiv.className = "loading";
        statusDiv.innerHTML = "Ubicando dispositivo. Por favor, espera...";

        if (!navigator.geolocation) {
            mostrarError("Tu teléfono no soporta la geolocalización.");
            restaurarBoton();
            return;
        }

        const opcionesGps = { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 };

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                statusDiv.innerHTML = "GPS capturado. Sincronizando con base de datos...";

                // Estructura del registro
                const nuevoRegistroLog = {
                    id_escolta: nombreEscolta.toUpperCase(),
                    tipo_evento: "ARRIBO_CONFIRMADO",
                    fecha_str: new Date().toLocaleDateString('es-MX'),
                    hora_str: new Date().toLocaleTimeString('es-MX'),
                    timestamp: new Date().getTime(),
                    latitud: lat,
                    longitud: lon,
                    dispositivo: navigator.userAgent
                };

                // Enviamos los datos a Firebase
                enviarALaBaseDeDatos(nuevoRegistroLog, statusDiv, btnConfirmar);
            },
            (error) => {
                restaurarBoton();
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        mostrarError("Acceso denegado. Debes permitir el uso del GPS.");
                        break;
                    case error.POSITION_UNAVAILABLE:
                        mostrarError("Ubicación no disponible. Verifica tu señal GPS.");
                        break;
                    case error.TIMEOUT:
                        mostrarError("Tiempo agotado. Intenta de nuevo.");
                        break;
                    default:
                        mostrarError("Ocurrió un error desconocido al ubicar.");
                }
            },
            opcionesGps
        );
    }

    async function enviarALaBaseDeDatos(datos, statusDiv, btnConfirmar) {
        try {
            // Guardamos en una colección nueva llamada 'historial_escoltas'
            await addDoc(collection(db, "historial_escoltas"), datos);
            
            statusDiv.className = "success";
            statusDiv.innerHTML = `<strong>✓ ¡Arribo Confirmado!</strong><br>
                                   Ubicación guardada en la base de datos.<br>
                                   <small>Lat: ${datos.latitud.toFixed(4)}, Lon: ${datos.longitud.toFixed(4)}</small>`;
            
            btnConfirmar.innerText = "REGISTRADO";
            
            // Limpiamos el campo de nombre después de 3 segundos para el próximo escolta
            setTimeout(() => {
                document.getElementById('nombre-escolta').value = "";
                restaurarBoton();
                statusDiv.style.display = "none";
            }, 5000);

        } catch (error) {
            console.error("Error al guardar:", error);
            mostrarError("Hubo un problema de conexión. Intenta de nuevo.");
            restaurarBoton();
        }
    }

    function mostrarError(mensaje) {
        const statusDiv = document.getElementById('status-mensaje');
        statusDiv.className = "error";
        statusDiv.style.display = "block";
        statusDiv.innerHTML = `<strong>⚠ Error:</strong> ${mensaje}`;
    }

    function restaurarBoton() {
        const btnConfirmar = document.getElementById('btn-confirmar');
        btnConfirmar.disabled = false;
        btnConfirmar.innerText = "CONFIRMAR ARRIBO";
    }
</script>

</body>
</html>
