<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPIs Gerenciales - El Cielo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #EAECEE; padding: 20px; color: #1A252C; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; color: #2C3E50; font-size: 2em; }
        .header p { color: #7F8C8D; margin-top: 5px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 6px solid #2980B9; position: relative; }
        .card h3 { margin-top: 0; color: #34495E; font-size: 1em; text-transform: uppercase; letter-spacing: 1px; }
        .data-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .num-box { text-align: center; }
        .num { font-size: 2.5em; font-weight: bold; display: block; }
        .label { font-size: 0.8em; color: #7F8C8D; text-transform: uppercase; }
        .status { margin-top: 20px; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 0.9em; text-align: center; }
        .ok { background: #EAFAF1; color: #27AE60; border: 1px solid #A9DFBF; }
        .bad { background: #FDEDEC; color: #C0392B; border: 1px solid #F5B7B1; }
        .fecha-hoy { position: absolute; top: 15px; right: 20px; font-size: 0.8em; color: #95A5A6; background: #F2F3F4; padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Dashboard de Mejora Continua</h1>
        <p>Auditoría Operativa - El Cielo Parque Residencial</p>
    </div>

    <div class="grid">
        <div class="card" style="border-top-color: #3498DB;">
            <div class="fecha-hoy" id="fecha1">Hoy</div>
            <h3>1. Trazabilidad de Visitas</h3>
            <div class="data-row">
                <div class="num-box"><span class="num" id="kpi-accesos" style="color:#2980B9;">0</span><span class="label">Entradas (Caseta)</span></div>
                <div style="font-size: 1.5em; color: #BDC3C7;">➔</div>
                <div class="num-box"><span class="num" id="kpi-arribos" style="color:#27AE60;">0</span><span class="label">Arribos (Patrulla)</span></div>
            </div>
            <div id="status-trazabilidad"></div>
        </div>

        <div class="card" style="border-top-color: #9B59B6;">
            <div class="fecha-hoy" id="fecha2">Hoy</div>
            <h3>2. Disciplina de Turnos</h3>
            <div class="data-row">
                <div class="num-box"><span class="num" id="kpi-tiempo" style="color:#27AE60;">0</span><span class="label">A Tiempo</span></div>
                <div class="num-box"><span class="num" id="kpi-retardo" style="color:#E74C3C;">0</span><span class="label">Retardos</span></div>
            </div>
            <div id="status-puntualidad"></div>
        </div>

        <div class="card" style="border-top-color: #E67E22;">
            <div class="fecha-hoy" id="fecha3">Hoy</div>
            <h3>3. Calidad de Recorridos</h3>
            <div class="data-row">
                <div class="num-box"><span class="num" id="kpi-ron-ok" style="color:#27AE60;">0</span><span class="label">Completos (8+ pts)</span></div>
                <div class="num-box"><span class="num" id="kpi-ron-bad" style="color:#E74C3C;">0</span><span class="label">Incompletos</span></div>
            </div>
            <div id="status-rondines"></div>
        </div>
    </div>

    <script>
        const fechaHoy = new Date().toLocaleDateString();
        document.getElementById('fecha1').innerText = fechaHoy;
        document.getElementById('fecha2').innerText = fechaHoy;
        document.getElementById('fecha3').innerText = fechaHoy;

        // Leer datos silentes
        const acc = JSON.parse(localStorage.getItem('kpi_accesos')) || {};
        const arr = JSON.parse(localStorage.getItem('kpi_arribos')) || {};
        const ast = JSON.parse(localStorage.getItem('kpi_asistencia')) || {};
        const ron = JSON.parse(localStorage.getItem('kpi_rondines')) || {};

        // 1. Trazabilidad
        const hoyAcc = acc[fechaHoy] || 0;
        const hoyArr = arr[fechaHoy] || 0;
        document.getElementById('kpi-accesos').innerText = hoyAcc;
        document.getElementById('kpi-arribos').innerText = hoyArr;
        
        const faltantes = hoyAcc - hoyArr;
        if (hoyAcc === 0 && hoyArr === 0) {
            document.getElementById('status-trazabilidad').innerHTML = `<div class="status" style="background:#F2F3F4; color:#7F8C8D;">Sin actividad registrada</div>`;
        } else if (faltantes > 0) {
            document.getElementById('status-trazabilidad').innerHTML = `<div class="status bad">⚠️ Faltan ${faltantes} arribos por confirmar en domicilio</div>`;
        } else {
            document.getElementById('status-trazabilidad').innerHTML = `<div class="status ok">✔️ 100% de vehículos rastreados</div>`;
        }

        // 2. Puntualidad
        const hoyAst = ast[fechaHoy] || { aTiempo: 0, retardo: 0 };
        document.getElementById('kpi-tiempo').innerText = hoyAst.aTiempo;
        document.getElementById('kpi-retardo').innerText = hoyAst.retardo;
        
        if (hoyAst.aTiempo === 0 && hoyAst.retardo === 0) {
            document.getElementById('status-puntualidad').innerHTML = `<div class="status" style="background:#F2F3F4; color:#7F8C8D;">Esperando checadas...</div>`;
        } else if (hoyAst.retardo > 0) {
            document.getElementById('status-puntualidad').innerHTML = `<div class="status bad">🚨 Detectados ${hoyAst.retardo} retardos. Aplicar actas.</div>`;
        } else {
            document.getElementById('status-puntualidad').innerHTML = `<div class="status ok">✔️ Puntualidad impecable</div>`;
        }

        // 3. Rondines
        const hoyRon = ron[fechaHoy] || { validos: 0, incompletos: 0 };
        document.getElementById('kpi-ron-ok').innerText = hoyRon.validos;
        document.getElementById('kpi-ron-bad').innerText = hoyRon.incompletos;

        if (hoyRon.validos === 0 && hoyRon.incompletos === 0) {
            document.getElementById('status-rondines').innerHTML = `<div class="status" style="background:#F2F3F4; color:#7F8C8D;">Esperando recorridos...</div>`;
        } else if (hoyRon.incompletos > 0) {
            document.getElementById('status-rondines').innerHTML = `<div class="status bad">⚠️ ${hoyRon.incompletos} recorridos no cumplieron la consigna de 8 puntos</div>`;
        } else {
            document.getElementById('status-rondines').innerHTML = `<div class="status ok">✔️ Consigna cumplida. Cobertura total.</div>`;
        }
    </script>
</body>
</html>
