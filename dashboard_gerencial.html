<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gerencial - Auditoría Operativa</title>
    <style>
        :root { --primary: #1A252C; --success: #28B463; --warning: #F1C40F; --danger: #E74C3C; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: var(--text); }
        .header { background-color: var(--primary); color: white; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 4px solid var(--primary); }
        .card h2 { margin-top: 0; font-size: 1.2rem; color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .dato-grande { font-size: 2.5rem; font-weight: bold; margin: 10px 0; text-align: center; }
        .alerta { padding: 10px; border-radius: 5px; margin-top: 10px; font-weight: bold; font-size: 0.9rem; }
        .bg-ok { background-color: #e8f8f5; color: #117864; border-left: 4px solid var(--success); }
        .bg-bad { background-color: #fadbd8; color: #943126; border-left: 4px solid var(--danger); }
        .lista-agentes { list-style: none; padding: 0; }
        .lista-agentes li { padding: 8px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="margin:0;">Auditoría Operativa de Seguridad</h1>
        <p style="margin:5px 0 0 0; color: #AAB7B8;">"FIRMEZA NO PREPOTENCIA"</p>
    </div>

    <div class="grid">
        <div class="card">
            <h2>1. Control de Trazabilidad (Accesos vs Arribos)</h2>
            <div style="display: flex; justify-content: space-around;">
                <div style="text-align: center;"><div class="dato-grande" id="tot-accesos" style="color:#34495E;">0</div><small>Accesos (Caseta)</small></div>
                <div style="text-align: center;"><div class="dato-grande" id="tot-arribos" style="color:#28B463;">0</div><small>Arribos (Patrulla)</small></div>
            </div>
            <div id="alerta-trazabilidad"></div>
        </div>

        <div class="card">
            <h2>2. Efectividad de Recorridos (Min. 8 Puntos)</h2>
            <div class="dato-grande" id="rondines-completos" style="color:#2980B9;">0 / 0</div>
            <p style="text-align: center; margin-top:0;">Rondines Válidos vs Iniciados</p>
            <div id="alerta-rondines"></div>
        </div>

        <div class="card" style="grid-column: 1 / -1;">
            <h2>3. Disciplina de Turnos (07:00, 15:00, 23:00)</h2>
            <ul class="lista-agentes" id="lista-asistencia">
                </ul>
        </div>
    </div>

    <script>
        // Cargar bases de datos locales
        const accesos = JSON.parse(localStorage.getItem('bd_accesos')) || [];
        const arribos = JSON.parse(localStorage.getItem('bd_arribos')) || [];
        const rondines = JSON.parse(localStorage.getItem('bd_rondines')) || {};
        const asistencia = JSON.parse(localStorage.getItem('bd_asistencia')) || [];

        // --- 1. EVALUAR ACCESOS VS ARRIBOS ---
        document.getElementById('tot-accesos').innerText = accesos.length;
        document.getElementById('tot-arribos').innerText = arribos.length;
        
        let msgTrazabilidad = document.getElementById('alerta-trazabilidad');
        if (arribos.length < accesos.length) {
            let faltantes = accesos.length - arribos.length;
            msgTrazabilidad.innerHTML = `<div class="alerta bg-bad">🚨 Faltan ${faltantes} arribos por confirmar. El patrullaje no está cubriendo todas las entradas.</div>`;
        } else if (accesos.length > 0) {
            msgTrazabilidad.innerHTML = `<div class="alerta bg-ok">✔️ Trazabilidad al 100%. Cada acceso tiene su arribo.</div>`;
        } else {
            msgTrazabilidad.innerHTML = `<div class="alerta" style="background:#eee; color:#666;">Sin actividad registrada hoy.</div>`;
        }

        // --- 2. EVALUAR RONDINES (Regla: >= 8 puntos) ---
        let totalIniciados = Object.keys(rondines).length;
        let rondinesValidos = 0;
        
        for (let id in rondines) {
            if (rondines[id].length >= 8) { rondinesValidos++; }
        }
        
        document.getElementById('rondines-completos').innerText = `${rondinesValidos} / ${totalIniciados}`;
        let msgRondines = document.getElementById('alerta-rondines');
        
        if (totalIniciados > 0 && rondinesValidos < totalIniciados) {
            msgRondines.innerHTML = `<div class="alerta bg-bad">⚠️ Hay ${totalIniciados - rondinesValidos} rondines incompletos (menos de 8 puntos).</div>`;
        } else if (totalIniciados > 0) {
            msgRondines.innerHTML = `<div class="alerta bg-ok">✔️ Todos los recorridos cumplen la consigna operativa.</div>`;
        }

        // --- 3. EVALUAR ASISTENCIA DE AGENTES ---
        let listaDOM = document.getElementById('lista-asistencia');
        if (asistencia.length === 0) {
            listaDOM.innerHTML = `<li><span style="color:#999;">No hay registros de checador hoy.</span></li>`;
        } else {
            // Mostrar solo los últimos 11 registros (asumiendo la plantilla de 11 agentes)
            let ultimosRegistros = asistencia.slice(-11).reverse();
            ultimosRegistros.forEach(reg => {
                let color = reg.estatus === "A tiempo" ? "green" : "red";
                listaDOM.innerHTML += `
                    <li>
                        <strong>${reg.agente}</strong> 
                        <span>Turno: ${reg.turno} | Ingreso: ${reg.horaExacta}</span>
                        <span style="color: ${color}; font-weight: bold;">[${reg.estatus}]</span>
                    </li>
                `;
            });
        }
    </script>
</body>
</html>
