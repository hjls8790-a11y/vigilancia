<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditor de Integridad de Documentos | Análisis Criptográfico</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111827; color: #e5e7eb; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .audit-panel { background-color: #1f2937; padding: 30px; border-radius: 8px; border-top: 4px solid #ef4444; width: 100%; max-width: 600px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        h2 { margin-top: 0; color: #f9fafb; font-size: 20px; border-bottom: 1px solid #374151; padding-bottom: 15px; }
        .upload-area { border: 2px dashed #4b5563; padding: 40px; text-align: center; border-radius: 6px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; background: #111827; }
        .upload-area:hover { border-color: #ef4444; background: #1a2235; }
        input[type="file"] { display: none; }
        .results { background: #000; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 13px; color: #10b981; white-space: pre-wrap; word-wrap: break-word; }
        .label { color: #9ca3af; font-weight: bold; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <div class="audit-panel">
        <h2>Herramienta de Auditoría: Validación SHA-256 (PDF)</h2>
        <p style="font-size: 13px; color: #9ca3af; margin-bottom: 20px;">
            El análisis se realiza localmente. El archivo no abandona su equipo, garantizando el protocolo Zero Trust.
        </p>

        <label class="upload-area">
            <input type="file" id="pdfInput" accept="application/pdf">
            <span style="font-weight: bold; color: #ef4444;">[+] Seleccionar Documento PDF</span><br>
            <span style="font-size: 12px; color: #6b7280; margin-top: 10px; display: inline-block;">Click para explorar archivos</span>
        </label>

        <div id="resultsContainer" style="display: none;">
            <span class="label">METADATOS DEL ARCHIVO:</span>
            <div id="metaData" class="results" style="color: #60a5fa;"></div>

            <span class="label">HUELLA CRIPTOGRÁFICA (SHA-256):</span>
            <div id="hashData" class="results"></div>
        </div>
    </div>

    <script>
        document.getElementById('pdfInput').addEventListener('change', async function(event) {
            const file = event.target.files;
            if (!file) return;

            // Mostrar contenedor
            document.getElementById('resultsContainer').style.display = 'block';

            // 1. Mostrar Metadatos Básicos
            const sizeKB = (file.size / 1024).toFixed(2);
            const lastMod = new Date(file.lastModified).toLocaleString();
            document.getElementById('metaData').innerText = 
                `Nombre: ${file.name}\n` +
                `Tamaño: ${sizeKB} KB\n` +
                `Tipo MIME: ${file.type}\n` +
                `Última Modificación: ${lastMod}`;

            document.getElementById('hashData').innerText = "Calculando huella criptográfica...";

            // 2. Calcular Hash SHA-256
            try {
                const arrayBuffer = await file.arrayBuffer();
                const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                
                document.getElementById('hashData').innerText = hashHex;
            } catch (error) {
                document.getElementById('hashData').innerText = "Error al auditar el archivo.";
                document.getElementById('hashData').style.color = "#ef4444";
            }
        });
    </script>
</body>
</html>
