<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTROL DE ACCESOS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f7; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        #header { background: #2c3e50; color: white; width: 100%; padding: 15px 0; text-align: center; border-bottom: 4px solid #3498db; }
        h2 { margin: 0; font-size: 22px; }
        .form-container { background: white; width: 90%; max-width: 400px; margin-top: 20px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .input-group input:focus, .input-group select:focus { border-color: #3498db; outline: none; }
        .btn-submit { background: #27ae60; color: white; border: none; width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .btn-submit:active { background: #219150; transform: translateY(2px); }
        #mensaje { display: none; background: #d4edda; color: #155724; padding: 15px; text-align: center; border-radius: 6px; margin-bottom: 15px; font-weight: bold; border: 1px solid #c3e6cb; }
        
        /* Estilos para resaltar si es entrada o salida */
        #tipo_movimiento { font-weight: bold; text-align: center; }
        .opcion-entrada { color: #27ae60; }
        .opcion-salida { color: #e74c3c; }
    </style>
</head>
<body>

    <div id="header">
        <h2>🚧 REGISTRO DE VISITANTES</h2>
    </div>

    <div class="form-container">
        <div id="mensaje">✅ ¡Registro guardado con éxito!</div>

        <div class="input-group">
            <label>📍 Ubicación / Caseta</label>
            <select id="ubicacion">
                <option value="General">Caseta General</option>
                <option value="Cardones">Club Cardones</option>
                <option value="Fotur">Obra FOTUR</option>
            </select>
        </div>

        <div class="input-group">
            <label>↔️ Tipo de Movimiento</label>
            <select id="tipo_movimiento">
                <option value="ENTRADA" class="opcion-entrada">🟢 REGISTRAR ENTRADA</option>
                <option value="SALIDA" class="opcion-salida">🔴 REGISTRAR SALIDA</option>
            </select>
        </div>

        <div class="input-group">
            <label>👤 Nombre del Visitante</label>
            <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="input-group">
            <label>🏠 Domicilio/Área</label>
            <input type="text" id="domicilio" placeholder="Ej. Lote 45 / Oficina 2" required>
        </div>

        <div class="input-group">
            <label>🚗 Marca del Vehículo</label>
            <input type="text" id="marca" placeholder="Ej. Nissan, Ford (O 'Peatón')">
        </div>

        <div class="input-group">
            <label>🎨 Color del Vehículo</label>
            <input type="text" id="color" placeholder="Ej. Blanco">
        </div>

        <div class="input-group">
            <label>🔢 Placas</label>
            <input type="text" id="placas" placeholder="Ej. VGR-1234">
        </div>

        <button class="btn-submit" onclick="guardarRegistro()" id="btnGuardar">GUARDAR REGISTRO</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Cambiar el color del botón según si es entrada o salida para evitar errores del guardia
        document.getElementById('tipo_movimiento').addEventListener('change', function() {
            const btn = document.getElementById('btnGuardar');
            if(this.value === 'SALIDA') {
                btn.style.background = '#e74c3c'; // Rojo para salida
            } else {
                btn.style.background = '#27ae60'; // Verde para entrada
            }
        });

        window.guardarRegistro = async function() {
            const btn = document.getElementById('btnGuardar');
            const ubicacion = document.getElementById('ubicacion').value;
            const tipo_movimiento = document.getElementById('tipo_movimiento').value;
            const nombre = document.getElementById('nombre').value;
            const domicilio = document.getElementById('domicilio').value;
            const marca = document.getElementById('marca').value || 'N/A';
            const color = document.getElementById('color').value || 'N/A';
            const placas = document.getElementById('placas').value || 'N/A';

            if(!nombre || !domicilio) {
                alert("⚠️ Por favor ingresa al menos el Nombre y el Domicilio a visitar.");
                return;
            }

            btn.innerText = "Guardando...";
            btn.disabled = true;

            const ahora = new Date();
            const fechaHora = ahora.toLocaleString('es-MX');
            const timestamp = ahora.getTime();

            try {
                await addDoc(collection(db, "accesos"), {
                    ubicacion: ubicacion,
                    tipo_movimiento: tipo_movimiento, // Aquí guardamos si es Entrada o Salida
                    visitante: nombre,
                    domicilio: domicilio,
                    vehiculo_marca: marca,
                    vehiculo_color: color,
                    vehiculo_placas: placas,
                    fecha_hora: fechaHora,
                    timestamp: timestamp
                });

                document.getElementById('mensaje').style.display = "block";
                
                document.getElementById('nombre').value = "";
                document.getElementById('domicilio').value = "";
                document.getElementById('marca').value = "";
                document.getElementById('color').value = "";
                document.getElementById('placas').value = "";
                // Dejamos la misma ubicación y tipo por si vienen en caravana

                setTimeout(() => {
                    document.getElementById('mensaje').style.display = "none";
                }, 4000);

            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("❌ Ocurrió un error al guardar el registro.");
            } finally {
                btn.innerText = "GUARDAR REGISTRO";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
