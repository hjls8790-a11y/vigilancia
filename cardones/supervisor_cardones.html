<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CENTRAL CARDONES - HUGO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; flex-direction: column; }
        #header { background: #2c3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #27ae60; }
        .user-badge { background: #27ae60; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        #main { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 360px; background: #f4f7f6; display: flex; flex-direction: column; border-right: 1px solid #ccc; }
        #search-box { padding: 15px; background: #fff; border-bottom: 1px solid #ddd; }
        #search-box input { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        #lista-recorridos { flex: 1; overflow-y: auto; padding: 15px; }
        #map { flex: 1; }
        .rondin-card { background: white; margin-bottom: 12px; padding: 15px; border-radius: 10px; cursor: pointer; border-left: 6px solid #27ae60; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div id="header">
        <h2>🌳 VIGILANCIA: CLUB CARDONES</h2>
        <div class="user-badge">ADMIN: HUGO</div>
    </div>

    <div id="main">
        <div id="sidebar">
            <div id="search-box">
                <input type="text" id="filtroNombre" placeholder="Buscar Guardia..." oninput="filtrar()">
                <input type="date" id="filtroFecha" onchange="filtrar()">
            </div>
            <div id="lista-recorridos">Cargando datos del Club...</div>
        </div>
        <div id="map"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let mapa = L.map('map').setView([24.8, -107.3], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
        let capaRecorrido = L.layerGroup().addTo(mapa);
        let datosOriginales = [];

        async function cargarDatos() {
            // AQUÍ ESTÁ EL TRUCO: Solo pedimos los del Club Cardones
            const q = query(
                collection(db, "rondines"), 
                where("ubicacion", "==", "Cardones"),
                orderBy("inicio", "desc")
            );
            const snapshot = await getDocs(q);
            datosOriginales = [];
            snapshot.forEach(doc => datosOriginales.push(doc.data()));
            renderizarLista(datosOriginales);
        }

        function renderizarLista(datos) {
            const listaDiv = document.getElementById('lista-recorridos');
            listaDiv.innerHTML = datos.length ? "" : "No hay registros en Cardones.";
            datos.forEach(d => {
                const card = document.createElement('div');
                card.className = 'rondin-card';
                card.innerHTML = `
                    <b style="color:#2c3e50;">👤 ${d.oficial}</b>
                    <span style="font-size:12px; display:block;">📅 ${d.inicio.split(',')[0]}</span>
                    <span style="font-size:12px; display:block;">🕒 Fin: ${d.fin ? d.fin.split(',')[1] : '...'}</span>
                `;
                card.onclick = () => dibujarRondin(d);
                listaDiv.appendChild(card);
            });
        }

        // ... (Lógica de filtrar y dibujarRondin igual al anterior) ...
        window.filtrar = function() {
            const nombre = document.getElementById('filtroNombre').value.toLowerCase();
            const filtrados = datosOriginales.filter(d => d.oficial.toLowerCase().includes(nombre));
            renderizarLista(filtrados);
        };

        function dibujarRondin(d) {
            capaRecorrido.clearLayers();
            const pts = d.puntos_gps.map(p => [p.lat, p.lng]);
            const linea = L.polyline(pts, {color: '#27ae60', weight: 5}).addTo(capaRecorrido);
            L.marker(pts[0]).addTo(capaRecorrido).bindPopup("INICIO CARDONES");
            if (d.reportes) {
                d.reportes.forEach(nov => {
                    L.marker([nov.lat, nov.lng]).addTo(capaRecorrido).bindPopup(nov.msg);
                });
            }
            mapa.fitBounds(linea.getBounds(), {padding: [40, 40]});
        }
        cargarDatos();
    </script>
</body>
</html>
