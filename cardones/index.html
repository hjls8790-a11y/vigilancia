<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONDÍN CARDONES</title>
    <style>
        body { font-family: sans-serif; background: #1a2a3a; color: white; padding: 15px; text-align: center; }
        .card { background: #2c3e50; padding: 20px; border-radius: 12px; border-top: 8px solid #f1c40f; max-width: 400px; margin: auto; }
        .etiqueta { background: #f1c40f; color: #1a2a3a; padding: 10px; font-weight: bold; border-radius: 6px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: none; box-sizing: border-box; font-size: 16px; }
        .btn { border: none; width: 100%; padding: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 18px; }
        #btnAccion { background: #2ecc71; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <div class="etiqueta">📍 SECTOR: CLUB CARDONES</div>
        <input type="text" id="oficial" placeholder="Nombre del Oficial" required>
        <textarea id="novedad" placeholder="Escribe aquí las novedades..."></textarea>
        <button id="btnAccion" class="btn" onclick="enviarDato()">GUARDAR RECORRIDO</button>
        <div id="status" style="margin-top:15px; font-size:12px; color:#f1c40f;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", 
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com", 
            projectId: "sistema-vigilancia-6851e", 
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", 
            messagingSenderId: "714792023462", 
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.enviarDato = async () => {
            const ofi = document.getElementById('oficial').value;
            if(!ofi) return alert("Por favor escribe tu nombre");

            const btn = document.getElementById('btnAccion');
            btn.disabled = true;
            btn.innerText = "Conectando...";

            try {
                await addDoc(collection(db, "recorridos"), {
                    oficial: ofi,
                    sector: "Cardones",
                    novedad: document.getElementById('novedad').value || "Sin novedad",
                    fecha_hora: new Date().toLocaleString('es-MX'),
                    timestamp: Date.now(),
                    tipo: "PUNTO"
                });
                alert("✅ Registro guardado con éxito");
                document.getElementById('novedad').value = "";
            } catch (error) {
                alert("❌ Error de conexión: Revisa tu internet");
                console.error(error);
            }
            btn.disabled = false;
            btn.innerText = "GUARDAR RECORRIDO";
        };
    </script>
</body>
</html>
