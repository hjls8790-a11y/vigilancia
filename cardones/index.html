<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONDÍN CARDONES</title>
    <style>
        body { font-family: sans-serif; background: #1a2a3a; color: white; padding: 15px; margin: 0; }
        .card { background: #2c3e50; padding: 20px; border-radius: 12px; border-top: 8px solid #f1c40f; max-width: 400px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #f1c40f; margin: 0 0 15px 0; font-size: 20px; }
        .sector-tag { background: #f1c40f; color: #1a2a3a; padding: 8px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 14px; }
        label { font-size: 14px; color: #bdc3c7; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #444; background: #1a2a3a; color: white; box-sizing: border-box; font-size: 16px; }
        .btn { border: none; width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        #btnFoto { background: #34495e; color: white; border: 1px solid #f1c40f; margin-bottom: 15px; }
        #btnAccion { background: #27ae60; color: white; }
        #btnAccion:disabled { background: #7f8c8d; }
        #preview { width: 100%; border-radius: 8px; margin-bottom: 15px; display: none; border: 2px solid #f1c40f; }
        #gpsStatus { text-align: center; font-size: 12px; color: #f1c40f; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ REGISTRO DE RONDÍN</h2>
        <div class="sector-tag">📍 SECTOR: CLUB CARDONES</div>
        
        <label>👮 Nombre del Oficial</label>
        <input type="text" id="oficial" placeholder="Escribe tu nombre..." required>
        
        <label>📝 Novedades</label>
        <textarea id="novedad" placeholder="Describe la situación o escribe 'Sin novedad'"></textarea>
        
        <input type="file" id="input_foto" accept="image/*" capture="environment" style="display:none;" onchange="procesarFoto(event)">
        <button id="btnFoto" class="btn" onclick="document.getElementById('input_foto').click()">📷 TOMAR FOTO</button>
        <img id="preview">

        <button id="btnAccion" class="btn" onclick="enviarRegistro()">GUARDAR RECORRIDO</button>
        <div id="gpsStatus">Buscando señal GPS...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", 
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com", 
            projectId: "sistema-vigilancia-6851e", 
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", 
            messagingSenderId: "714792023462", 
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let fotoBase64 = "NO", lat = 0, lng = 0;

        // Activar GPS automático
        navigator.geolocation.watchPosition(p => { 
            lat = p.coords.latitude; lng = p.coords.longitude; 
            document.getElementById('gpsStatus').innerText = `✅ GPS Activo: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        }, null, { enableHighAccuracy: true });

        window.procesarFoto = (e) => {
            const reader = new FileReader();
            reader.onload = () => { 
                fotoBase64 = reader.result; 
                const img = document.getElementById('preview');
                img.src = fotoBase64; img.style.display = 'block';
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        window.enviarRegistro = async () => {
            const ofi = document.getElementById('oficial').value.trim();
            if(!ofi) return alert("Por favor, ingresa tu nombre.");

            const btn = document.getElementById('btnAccion');
            btn.innerText = "Conectando..."; btn.disabled = true;

            try {
                // Sincronizamos nombres de campos para evitar 'undefined'
                await addDoc(collection(db, "recorridos"), {
                    oficial: ofi,
                    sector: "Cardones",
                    novedad: document.getElementById('novedad').value || "Sin novedad",
                    evidencia_foto: fotoBase64,
                    latitud: lat,
                    longitud: lng,
                    fecha_hora: new Date().toLocaleString('es-MX'),
                    timestamp: Date.now()
                });
                alert("✅ Registro guardado correctamente en Cardones.");
                location.reload(); 
            } catch (error) {
                alert("❌ Error de conexión: Revisa tu señal de internet.");
                console.error("Error Firebase:", error);
                btn.innerText = "GUARDAR RECORRIDO"; btn.disabled = false;
            }
        };
    </script>
</body>
</html>
