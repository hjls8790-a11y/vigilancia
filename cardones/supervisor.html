<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MONITOR CARDONES</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        header { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; border-bottom: 5px solid #f1c40f; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #34495e; color: white; }
        .filtro-box { margin-bottom: 15px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <header><h2>🌳 CENTRAL DE MONITOREO: CARDONES</h2></header>
    <div class="filtro-box">
        <input type="date" id="fechaFiltro">
        <button onclick="consultar()" style="padding:10px; cursor:pointer; background:#f1c40f; border:none; font-weight:bold;">🔍 FILTRAR</button>
    </div>
    <table>
        <thead><tr><th>Oficial</th><th>Fecha y Hora</th><th>Novedades</th></tr></thead>
        <tbody id="tablaBody"></tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", authDomain: "sistema-vigilancia-6851e.firebaseapp.com", projectId: "sistema-vigilancia-6851e", storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", messagingSenderId: "714792023462", appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.consultar = async () => {
            const snapshot = await getDocs(query(collection(db, "recorridos"), orderBy("timestamp", "desc")));
            const tbody = document.getElementById('tablaBody');
            tbody.innerHTML = "";

            snapshot.forEach(doc => {
                const d = doc.data();
                // 🔒 FILTRO DE SECTOR
                if (d.sector === "Cardones") {
                    tbody.innerHTML += `<tr><td>${d.oficial}</td><td>${d.fecha_hora}</td><td>${d.novedad}</td></tr>`;
                }
            });
        };
        window.onload = consultar;
    </script>
</body>
</html>
