<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MONITOR CLUB CARDONES</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; }
        header { background: #1a2a3a; color: white; padding: 15px; border-bottom: 5px solid #f1c40f; display: flex; justify-content: space-between; align-items: center; }
        #map { height: 400px; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; font-size: 12px; }
        th { background: #2c3e50; color: white; }
        .img-mini { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h2 style="margin:0;">🌳 CENTRAL CARDONES</h2>
        <button onclick="consultar()" style="background:#f1c40f; border:none; padding:10px; font-weight:bold; cursor:pointer;">🔄 ACTUALIZAR</button>
    </header>
    <div id="map"></div>
    <table>
        <thead>
            <tr><th>Oficial</th><th>Fecha/Hora</th><th>Novedad</th><th>Foto</th></tr>
        </thead>
        <tbody id="tablaBody"></tbody>
    </table>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", 
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com", 
            projectId: "sistema-vigilancia-6851e", 
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", 
            messagingSenderId: "714792023462", 
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const map = L.map('map').setView([23.298, -106.477], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        window.consultar = async () => {
            const q = query(collection(db, "recorridos"), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            const tbody = document.getElementById('tablaBody');
            tbody.innerHTML = "";

            snapshot.forEach(doc => {
                const d = doc.data();
                // 🔒 FILTRO OBLIGATORIO: Solo Cardones
                if (d.sector === "Cardones") {
                    const fotoHtml = d.evidencia_foto !== "NO" ? `<img src="${d.evidencia_foto}" class="img-mini" onclick="window.open(this.src)">` : "Sin foto";
                    
                    tbody.innerHTML += `<tr>
                        <td><b>${d.oficial}</b></td>
                        <td>${d.fecha_hora}</td>
                        <td>${d.novedad}</td>
                        <td>${fotoHtml}</td>
                    </tr>`;

                    if(d.latitud) L.marker([d.latitud, d.longitud]).addTo(map).bindPopup(d.oficial);
                }
            });
        };
        window.onload = consultar;
    </script>
</body>
</html>
