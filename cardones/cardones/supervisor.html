<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MONITOR CARDONES</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1a2a3a; color: white; padding: 15px; display: flex; gap: 10px; border-bottom: 5px solid #f1c40f; }
        #map { height: 400px; width: 100%; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ddd; font-size: 12px; }
        th { background: #2c3e50; color: white; }
    </style>
</head>
<body>
    <header>
        <h2 style="margin:0; color:#f1c40f;">🌳 CENTRAL CARDONES</h2>
        <input type="date" id="fechaFiltro">
        <button onclick="consultar()" style="background:#f1c40f; border:none; padding:10px; font-weight:bold; cursor:pointer;">BUSCAR</button>
    </header>
    <div id="map"></div>
    <div style="flex:1; overflow:auto; padding:15px;">
        <table>
            <thead><tr><th>Oficial</th><th>Horarios</th><th>Novedades</th></tr></thead>
            <tbody id="tablaBody"></tbody>
        </table>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", authDomain: "sistema-vigilancia-6851e.firebaseapp.com", projectId: "sistema-vigilancia-6851e", storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", messagingSenderId: "714792023462", appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const map = L.map('map').setView([24.809, -107.394], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        window.consultar = async () => {
            const f = document.getElementById('fechaFiltro').value;
            const snapshot = await getDocs(query(collection(db, "recorridos"), orderBy("timestamp", "asc")));
            document.getElementById('tablaBody').innerHTML = "";
            let agrupados = {};

            snapshot.forEach(doc => {
                const d = doc.data();
                // 🔒 CANDADO 2: Filtro de lectura (Solo Cardones)
                if (d.sector !== "Cardones") return; 

                const id = d.id_recorrido;
                if(!agrupados[id]) agrupados[id] = { puntos: [], inicio: d.fecha_hora, fin: "---", oficial: d.oficial };
                if(d.tipo === "FIN") agrupados[id].fin = d.fecha_hora;
                else agrupados[id].puntos.push(d);
            });

            Object.values(agrupados).forEach(r => {
                const row = `<tr><td>${r.oficial}</td><td>In: ${r.inicio}<br>Fn: ${r.fin}</td><td>${r.puntos.map(p => p.novedad).join(' | ')}</td></tr>`;
                document.getElementById('tablaBody').innerHTML += row;
            });
        };
    </script>
</body>
</html>
