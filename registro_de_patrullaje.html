<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Patrullaje - El Cielo</title>
    <style>
        :root {
            --primary: #1A252C; 
            --success: #28B463; 
            --text: #333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: var(--text); }
        .header { background-color: var(--primary); color: white; text-align: center; padding: 20px 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
        .header h2 { margin: 5px 0 0 0; font-size: 0.9rem; font-weight: 300; color: #AAB7B8; }
        .header p { margin: 5px 0 0 0; font-size: 0.8rem; font-style: italic; color: #F1C40F; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--primary); }
        select, input[type="text"], input[type="number"] { width: 100%; padding: 12px; border: 2px solid #BDC3C7; border-radius: 8px; font-size: 1rem; box-sizing: border-box; background-color: white; }
        select:focus, input:focus { border-color: var(--primary); outline: none; }
        
        /* Sección de Vehículo */
        .vehiculo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .vehiculo-placas { grid-column: span 2; }

        /* Distintivos */
        .distintivos-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .distintivo-btn { padding: 15px; border: 2px solid transparent; border-radius: 8px; font-weight: bold; text-align: center; color: #333; cursor: pointer; transition: 0.2s; }
        .distintivo-btn input { display: none; }
        .btn-amarillo { background-color: #F1C40F; }
        .btn-naranja { background-color: #E67E22; color: white; }
        .btn-verde { background-color: #2ECC71; color: white; }
        .btn-gris { background-color: #95A5A6; color: white; }
        .distintivo-btn.selected { border: 3px solid var(--primary); transform: scale(0.98); box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        
        .submit-btn { width: 100%; background-color: var(--success); color: white; border: none; padding: 18px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin-top: 10px; transition: 0.3s; }
        .submit-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .back-btn { display: block; text-align: center; margin-top: 15px; color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>El Cielo Parque Residencial</h1>
        <h2>Jefatura de Vigilancia | Hugo Lizárraga</h2>
        <p>"FIRMEZA NO PREPOTENCIA"</p>
    </div>

    <div class="container">
        <form id="formArribo">
            
            <div class="form-group">
                <label for="calle">Calle de Destino:</label>
                <select id="calle" name="Calle" required>
                    <option value="" disabled selected>Selecciona la calle...</option>
                    <option value="Zona Común">Zona Común</option>
                    <option value="Aurora">Aurora</option>
                    <option value="Cirrus">Cirrus</option>
                    <option value="Estela">Estela</option>
                    <option value="Luna">Luna</option>
                    <option value="Nimbus">Nimbus</option>
                    <option value="Paseo de las Nubes">Paseo de las Nubes</option>
                    <option value="Venus">Venus</option>
                    <option value="Andromeda">Andromeda</option>
                    <option value="Celeste">Celeste</option>
                    <option value="Eos">Eos</option>
                    <option value="Eros">Eros</option>
                    <option value="Hera">Hera</option>
                    <option value="Hermes">Hermes</option>
                    <option value="Orion">Orion</option>
                    <option value="Paloma">Paloma</option>
                    <option value="Pegasus">Pegasus</option>
                    <option value="Selene">Selene</option>
                    <option value="Helios">Helios</option>
                </select>
            </div>

            <div class="form-group">
                <label for="numero">Número de Domicilio:</label>
                <input type="number" id="numero" name="Numero" placeholder="Ej. 124" required>
            </div>

            <div class="form-group">
                <label for="tipo_visita">Tipo de Acceso / Visita:</label>
                <select id="tipo_visita" name="Tipo_Visita" required>
                    <option value="" disabled selected>Selecciona el tipo...</option>
                    <option value="Proveedor de obra">Proveedor de obra</option>
                    <option value="Proveedor de gas">Proveedor de gas</option>
                    <option value="CFE">CFE</option>
                    <option value="JUMAPAM">JUMAPAM</option>
                    <option value="Aseo urbano">Aseo urbano</option>
                    <option value="Visita particular">Visita particular</option>
                    <option value="Entrega de paqueterías">Servicio de entrega de paqueterías</option>
                    <option value="Entrega de comida">Servicio de entrega de comida</option>
                </select>
            </div>

            <div class="form-group vehiculo-grid">
                <div class="vehiculo-placas">
                    <label for="placas">Placas del Vehículo:</label>
                    <input type="text" id="placas" name="Placas" placeholder="Ej. VHG-123-A (Opcional)">
                </div>
                <div>
                    <label for="marca">Marca:</label>
                    <input type="text" id="marca" name="Marca" placeholder="Ej. Nissan">
                </div>
                <div>
                    <label for="color">Color:</label>
                    <input type="text" id="color" name="Color" placeholder="Ej. Blanco">
                </div>
            </div>

            <div class="form-group">
                <label>Distintivo de Identificación:</label>
                <div class="distintivos-container">
                    <label class="distintivo-btn btn-amarillo" id="lbl-amarillo">
                        <input type="radio" name="Distintivo" value="Amarillo" required onclick="seleccionarDistintivo('lbl-amarillo')"> Amarillo
                    </label>
                    <label class="distintivo-btn btn-naranja" id="lbl-naranja">
                        <input type="radio" name="Distintivo" value="Naranja" onclick="seleccionarDistintivo('lbl-naranja')"> Naranja
                    </label>
                    <label class="distintivo-btn btn-verde" id="lbl-verde">
                        <input type="radio" name="Distintivo" value="Verde" onclick="seleccionarDistintivo('lbl-verde')"> Verde
                    </label>
                    <label class="distintivo-btn btn-gris" id="lbl-gris">
                        <input type="radio" name="Distintivo" value="Gris" onclick="seleccionarDistintivo('lbl-gris')"> Gris
                    </label>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="submit-btn">📍 Registrar Arribo</button>
            <a href="#" class="back-btn">⬅️ Volver al Panel Principal</a>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // CONFIGURACIÓN DE FIREBASE (Debes pegar tus datos aquí)
        const firebaseConfig = {
           apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function seleccionarDistintivo(idLabel) {
            let etiquetas = document.getElementsByClassName('distintivo-btn');
            for(let i = 0; i < etiquetas.length; i++) { etiquetas[i].classList.remove('selected'); }
            document.getElementById(idLabel).classList.add('selected');
        }

        document.getElementById('formArribo').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "Registrando...";

            // Recolectar datos
            let calle = document.getElementById('calle').value;
            let numero = document.getElementById('numero').value;
            let tipo = document.getElementById('tipo_visita').value;
            let distintivo = document.querySelector('input[name="Distintivo"]:checked').value;
            let placas = document.getElementById('placas').value || "N/A";
            let marca = document.getElementById('marca').value || "N/A";
            let color = document.getElementById('color').value || "N/A";
            
            // Construir objeto de datos
            const datosArribo = {
                calle: calle,
                numero: numero,
                tipo_visita: tipo,
                placas: placas,
                marca: marca,
                color: color,
                distintivo: distintivo,
                timestamp: firebase.database.ServerValue.TIMESTAMP, // Hora exacta del servidor
                estado_auditoria: "Pendiente" // Para que la caseta lo revise
            };

            // Enviar a la base de datos
            db.ref('arribos_coincidencia').push(datosArribo)
            .then(() => {
                alert("Arribo registrado en la plataforma exitosamente.");
                // Limpiar formulario
                document.getElementById('formArribo').reset();
                let etiquetas = document.getElementsByClassName('distintivo-btn');
                for(let i = 0; i < etiquetas.length; i++) { etiquetas[i].classList.remove('selected'); }
            })
            .catch((error) => {
                console.error("Error al registrar:", error);
                alert("Error de conexión. Intente de nuevo.");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "📍 Registrar Arribo";
            });
        });
    </script>
</body>
</html>
