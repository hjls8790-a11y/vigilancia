<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Patrullaje - El Cielo</title>
    <style>
        :root { --primary: #1A252C; --success: #28B463; --text: #333; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: var(--text); }
        .header { background-color: var(--primary); color: white; text-align: center; padding: 20px 10px; border-bottom: 4px solid #F1C40F; }
        .header h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; }
        .header p { margin: 5px 0 0 0; font-size: 0.8rem; font-style: italic; color: #F1C40F; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--primary); }
        select, input[type="text"], input[type="number"] { width: 100%; padding: 12px; border: 2px solid #BDC3C7; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .vehiculo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .distintivos-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; }
        .distintivo-btn { padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; cursor: pointer; border: 3px solid transparent; display: block; }
        .distintivo-btn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
        .btn-amarillo { background-color: #F1C40F; }
        .btn-naranja { background-color: #E67E22; color: white; }
        .btn-verde { background-color: #2ECC71; color: white; }
        .btn-gris { background-color: #95A5A6; color: white; }
        .selected { border-color: var(--primary); box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        .submit-btn { width: 100%; background-color: var(--success); color: white; border: none; padding: 18px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>El Cielo Parque Residencial</h1>
        <p>"FIRMEZA, NO PREPOTENCIA"</p>
    </div>
    <div class="container">
        <form id="formArribo">
            <div class="form-group">
                <label>Calle de Destino:</label>
                <select id="calle" required>
                    <option value="" disabled selected>Selecciona calle...</option>
                    <option value="Zona Común">Zona Común</option>
                    <option value="Aurora">Aurora</option><option value="Cirrus">Cirrus</option>
                    <option value="Estela">Estela</option><option value="Luna">Luna</option>
                    <option value="Nimbus">Nimbus</option><option value="Paseo de las Nubes">Paseo de las Nubes</option>
                    <option value="Venus">Venus</option><option value="Andromeda">Andromeda</option>
                    <option value="Celeste">Celeste</option><option value="Eos">Eos</option>
                    <option value="Eros">Eros</option><option value="Hera">Hera</option>
                    <option value="Hermes">Hermes</option><option value="Orion">Orion</option>
                    <option value="Paloma">Paloma</option><option value="Pegasus">Pegasus</option>
                    <option value="Selene">Selene</option><option value="Helios">Helios</option>
                </select>
            </div>
            <div class="form-group">
                <label>Número:</label>
                <input type="number" id="numero" placeholder="Ej. 124" required>
            </div>
            <div class="form-group">
                <label>Tipo de Visita:</label>
                <select id="tipo_visita" required>
                    <option value="" disabled selected>Selecciona visita...</option>
                    <option value="Proveedor de obra">Proveedor de obra</option>
                    <option value="Proveedor de gas">Proveedor de gas</option>
                    <option value="CFE">CFE</option><option value="JUMAPAM">JUMAPAM</option>
                    <option value="Visita particular">Visita particular</option>
                    <option value="Paquetería">Paquetería</option>
                    <option value="Comida">Entrega de comida</option>
                </select>
            </div>
            <div class="form-group vehiculo-grid">
                <input type="text" id="placas" placeholder="Placas" style="grid-column: span 2;">
                <input type="text" id="marca" placeholder="Marca">
                <input type="text" id="color" placeholder="Color">
            </div>
            <div class="form-group">
                <label>Distintivo:</label>
                <div class="distintivos-container">
                    <label class="distintivo-btn btn-amarillo" id="l-am">
                        <input type="radio" name="Distintivo" value="Amarillo" required onclick="window.sel('l-am')"> Amarillo
                    </label>
                    <label class="distintivo-btn btn-naranja" id="l-na">
                        <input type="radio" name="Distintivo" value="Naranja" required onclick="window.sel('l-na')"> Naranja
                    </label>
                    <label class="distintivo-btn btn-verde" id="l-ve">
                        <input type="radio" name="Distintivo" value="Verde" required onclick="window.sel('l-ve')"> Verde
                    </label>
                    <label class="distintivo-btn btn-gris" id="l-gr">
                        <input type="radio" name="Distintivo" value="Gris" required onclick="window.sel('l-gr')"> Gris
                    </label>
                </div>
            </div>
            <button type="submit" id="btnS" class="submit-btn">📍 REGISTRAR ARRIBO</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.appspot.com",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.sel = function(id) {
            document.querySelectorAll('.distintivo-btn').forEach(el => el.classList.remove('selected'));
            document.getElementById(id).classList.add('selected');
        }

        document.getElementById('formArribo').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnS');
            btn.disabled = true;
            btn.innerText = "Registrando...";
            
            try {
                const data = {
                    calle: document.getElementById('calle').value,
                    numero: document.getElementById('numero').value,
                    tipo_visita: document.getElementById('tipo_visita').value,
                    placas: document.getElementById('placas').value || "N/A",
                    marca: document.getElementById('marca').value || "N/A",
                    color: document.getElementById('color').value || "N/A",
                    distintivo: document.querySelector('input[name="Distintivo"]:checked').value,
                    timestamp: new Date().getTime(),
                    estado: "Pendiente"
                };

                await addDoc(collection(db, "arribos_coincidencia"), data);
                alert("Registrado correctamente en Caseta");
                location.reload();
            } catch (error) {
                console.error(error);
                alert("Hubo un error al registrar: " + error.message);
                btn.disabled = false;
                btn.innerText = "📍 REGISTRAR ARRIBO";
            }
        });
    </script>
</body>
</html>
