<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        const claveCorrecta = "ClubPagos26";
        let intento = prompt("🔒 ACCESO FINANCIERO\nIngrese la contraseña para la Bitácora de Ventas:");
        if (intento !== claveCorrecta) {
            alert("❌ Contraseña incorrecta. Acceso denegado.");
            window.location.href = "https://hjls8790-a11y.github.io/vigilancia/menu.html"; 
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITÁCORA DE VENTAS CLUB</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #16a085; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #1abc9c; }
        .badge { background: #1abc9c; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        
        #filtros-container { background: white; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .filtro-grupo { display: flex; flex-direction: column; flex: 1; min-width: 150px; }
        .filtro-grupo label { font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .filtro-grupo input, .filtro-grupo select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .btn-limpiar { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; height: 40px; }
        
        /* Resumen de totales */
        #resumen-total { background: #fff; padding: 15px 20px; border-bottom: 1px solid #ddd; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .monto-total { color: #27ae60; font-weight: bold; font-size: 24px; }

        #tabla-container { flex: 1; overflow-y: auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background: #2c3e50; color: white; text-transform: uppercase; font-size: 13px; position: sticky; top: 0; }
        tr:hover { background-color: #f1f5f8; }
        .folio-txt { font-family: monospace; font-size: 15px; color: #2980b9; font-weight: bold; }
        .monto-txt { font-weight: bold; color: #27ae60; }
    </style>
</head>
<body>

    <div id="header">
        <h2>🎾 AUDITORÍA DE VENTAS Y RENTAS</h2>
        <div class="badge">CONTROL FINANCIERO</div>
    </div>

    <div id="filtros-container">
        <div class="filtro-grupo" style="flex: 2;">
            <label>🔍 Búsqueda Universal (Socio, Producto, Folio, Oficial)</label>
            <input type="text" id="filtroTexto" placeholder="Ej. Juan, Padel, 0045..." oninput="filtrar()">
        </div>
        
        <div class="filtro-grupo">
            <label>📅 Fecha</label>
            <input type="date" id="filtroFecha" onchange="filtrar()">
        </div>
        
        <button class="btn-limpiar" onclick="limpiarFiltros()">Limpiar</button>
    </div>

    <div id="resumen-total">
        <span><b>Total Registros:</b> <span id="txt-conteo">0</span></span>
        <span><b>Total Recaudado (Filtro Actual):</b> $<span id="txt-total" class="monto-total">0.00</span></span>
    </div>

    <div id="tabla-container">
        <table>
            <thead>
                <tr>
                    <th>Fecha y Hora</th>
                    <th>Folio Voucher</th>
                    <th>Socio Autoriza</th>
                    <th>Beneficiario</th>
                    <th>Producto / Servicio</th>
                    <th>Monto</th>
                    <th>Elemento (Cajero)</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
                <tr><td colspan="7" style="text-align:center;">Cargando registros...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let datosOriginales = [];

        async function cargarDatos() {
            const tbody = document.getElementById('cuerpo-tabla');
            try {
                const q = query(collection(db, "ventas_club"), orderBy("timestamp", "desc"));
                const snapshot = await getDocs(q);
                datosOriginales = [];
                
                snapshot.forEach(doc => {
                    datosOriginales.push(doc.data());
                });

                renderizarTabla(datosOriginales);
            } catch (e) {
                console.error(e);
                tbody.innerHTML = "<tr><td colspan='7' style='text-align:center; color:red;'>Error al cargar los datos.</td></tr>";
            }
        }

        function renderizarTabla(datos) {
            const tbody = document.getElementById('cuerpo-tabla');
            let totalMonto = 0;

            if (datos.length === 0) {
                tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>📭 No hay ventas registradas en esta búsqueda.</td></tr>";
                document.getElementById('txt-conteo').innerText = "0";
                document.getElementById('txt-total').innerText = "0.00";
                return;
            }
            
            tbody.innerHTML = "";
            datos.forEach(d => {
                const tr = document.createElement('tr');
                const monto = parseFloat(d.monto) || 0;
                totalMonto += monto;
                
                tr.innerHTML = `
                    <td><b>${d.fecha_hora}</b></td>
                    <td class="folio-txt">#${d.folio_voucher}</td>
                    <td>${d.socio}</td>
                    <td>${d.beneficiario}</td>
                    <td>${d.producto}</td>
                    <td class="monto-txt">$${monto.toFixed(2)}</td>
                    <td><small>👮‍♂️ ${d.oficial}</small></td>
                `;
                tbody.appendChild(tr);
            });

            // Actualizar los totales arriba
            document.getElementById('txt-conteo').innerText = datos.length;
            document.getElementById('txt-total').innerText = totalMonto.toFixed(2);
        }

        window.filtrar = function() {
            const texto = document.getElementById('filtroTexto').value.toLowerCase();
            const fechaInput = document.getElementById('filtroFecha').value;
            
            const filtrados = datosOriginales.filter(d => {
                const cadenaBusqueda = `${d.socio} ${d.beneficiario} ${d.producto} ${d.folio_voucher} ${d.oficial}`.toLowerCase();
                const coincideTexto = cadenaBusqueda.includes(texto);
                
                let coincideFecha = true;
                if (fechaInput) {
                    const partes = fechaInput.split('-');
                    const f1 = `${Number(partes[2])}/${Number(partes[1])}/${partes[0]}`; 
                    const f2 = `${partes[2]}/${partes[1]}/${partes[0]}`; 
                    coincideFecha = d.fecha_hora.includes(f1) || d.fecha_hora.includes(f2);
                }
                
                return coincideTexto && coincideFecha;
            });
            
            renderizarTabla(filtrados);
        };

        window.limpiarFiltros = () => {
            document.getElementById('filtroTexto').value = "";
            document.getElementById('filtroFecha').value = "";
            renderizarTabla(datosOriginales);
        };

        cargarDatos();
    </script>
</body>
</html>
