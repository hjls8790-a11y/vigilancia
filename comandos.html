<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Comando | Emisión de Instrucciones</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #1a252f;
            --secondary: #2c3e50;
            --accent: #e74c3c;
            --text-light: #ecf0f1;
            --success: #27ae60;
            --info: #3498db;
            --warning: #f39c12;
            --wa-color: #25D366;
            --pdf-color: #c0392b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--primary);
            color: var(--text-light);
            padding: 1.5rem 2rem;
            border-bottom: 4px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { margin: 0; font-size: 1.8rem; }
        header p { margin: 5px 0 0; color: #bdc3c7; }
        
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            header { flex-direction: column; text-align: center; gap: 10px; }
        }

        /* Panel de Emisión */
        .panel {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid var(--secondary);
        }
        .panel h2 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--secondary);
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }
        
        .btn-wa {
            background-color: var(--wa-color);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background 0.3s;
        }
        .btn-wa:hover { background-color: #128C7E; }

        .btn-pdf-global {
            background-color: var(--pdf-color);
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-pdf-global:hover { background-color: #a93226; }

        /* Panel de Auditoría */
        .audit-panel { border-top-color: var(--info); }
        .search-bar {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--info);
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 1rem;
            box-sizing: border-box;
            background: #f8fbfe;
        }
        
        .log-list {
            max-height: 600px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .log-item {
            background: #fdfdfd;
            border: 1px solid #e0e0e0;
            border-left: 5px solid var(--secondary);
            padding: 15px;
            border-radius: 5px;
            position: relative;
        }
        .log-item.alta { border-left-color: var(--warning); }
        .log-item.critica { border-left-color: var(--accent); background-color: #fdf3f2;}
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .log-body { font-size: 1rem; color: #333; white-space: pre-wrap; margin-bottom: 10px; }
        .log-footer {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #95a5a6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed #eee;
            padding-top: 10px;
        }
        
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            color: white;
            font-size: 0.8rem;
        }
        .b-patrullaje { background: var(--secondary); }
        .b-monitoreo { background: var(--info); }
        .b-proveedores { background: var(--warning); }
        .b-general { background: #7f8c8d; }

        .btn-pdf-mini {
            background-color: white;
            color: var(--pdf-color);
            border: 1px solid var(--pdf-color);
            padding: 4px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-pdf-mini:hover {
            background-color: var(--pdf-color);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Centro de Comando | Emisión de Instrucciones</h1>
            <p>Dirección de Seguridad - El Cielo Parque Residencial</p>
        </div>
        <div id="liveClock" style="font-size: 1.2rem; font-weight: bold;"></div>
    </header>

    <div class="container">
        <div class="panel">
            <h2>📝 Nueva Instrucción a Caseta</h2>
            
            <div class="form-group">
                <label for="areaSelect">🎯 Área Operativa de Destino:</label>
                <select id="areaSelect" class="form-control">
                    <option value="Patrullaje">🚓 Patrullaje / Rondines</option>
                    <option value="Monitoreo">🖥️ Monitoreo / CCTV</option>
                    <option value="Proveedores">🏗️ Atención a Proveedores / Constructores</option>
                    <option value="General">📢 Caseta General (Todos los turnos)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="prioridadSelect">⚠️ Nivel de Urgencia:</label>
                <select id="prioridadSelect" class="form-control">
                    <option value="Normal">🟢 Normal (Acatar en turno)</option>
                    <option value="Alta">🟡 Alta (Acción a la brevedad)</option>
                    <option value="Crítica">🔴 Crítica (Acción INMEDIATA)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="instruccionText">📄 Detalle de la Instrucción:</label>
                <textarea id="instruccionText" class="form-control" placeholder="Ej: Se prohíbe el acceso a proveedores de la constructora 'X' por falta de registro hasta nuevo aviso. Aplicar protocolo de reto y respuesta..."></textarea>
            </div>

            <button class="btn-wa" onclick="procesarInstruccion()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                Registrar y Enviar por WhatsApp
            </button>
        </div>

        <div class="panel audit-panel">
            <h2>
                🗂️ Bitácora de Auditoría
                <button class="btn-pdf-global" onclick="exportarBitacoraGlobalPDF()">📄 Exportar Todo</button>
            </h2>
            <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Buscar por fecha, área, o palabra clave..." onkeyup="filtrarBitacora()">
            
            <div id="logContainer" class="log-list">
                </div>
        </div>
    </div>

    <script>
        // Configuración Inicial
        const NUMERO_CASETA = "526692486726"; 
        const EMISOR = "Cmdt. Hugo Lizárraga";

        // Reloj en vivo
        setInterval(() => {
            document.getElementById('liveClock').innerText = new Date().toLocaleString('es-MX');
        }, 1000);

        // Al cargar la página, recuperar la bitácora
        document.addEventListener('DOMContentLoaded', cargarBitacora);

        function procesarInstruccion() {
            const area = document.getElementById('areaSelect').value;
            const prioridad = document.getElementById('prioridadSelect').value;
            const texto = document.getElementById('instruccionText').value.trim();
            
            if (texto === "") {
                alert("⚠️ La instrucción no puede ir vacía. Escribe la indicación operativa.");
                return;
            }

            const ahora = new Date();
            const fechaStr = ahora.toLocaleDateString('es-MX');
            const horaStr = ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
            const idUnico = "ID-" + ahora.getTime();

            let iconoPrioridad = "🟢";
            if (prioridad === "Alta") iconoPrioridad = "🟡";
            if (prioridad === "Crítica") iconoPrioridad = "🚨";

            const mensajeWa = 
`${iconoPrioridad} *NUEVA INSTRUCCIÓN OPERATIVA* ${iconoPrioridad}
🏢 *El Cielo Parque Residencial*
📅 Fecha: ${fechaStr} | ⏰ Hora: ${horaStr}
🎯 Área: ${area}
⚠️ Prioridad: ${prioridad}
🆔 Folio: ${idUnico}

📝 *Instrucción:*
${texto}

👤 Emite: ${EMISOR}
_Nota: Acuse de recibido obligatorio al leer este mensaje._`;

            const nuevaOrden = {
                id: idUnico,
                fecha: fechaStr,
                hora: horaStr,
                area: area,
                prioridad: prioridad,
                texto: texto,
                emisor: EMISOR,
                timestamp: ahora.getTime()
            };

            guardarEnLocal(nuevaOrden);
            document.getElementById('instruccionText').value = "";
            cargarBitacora();

            const urlWa = `https://wa.me/${NUMERO_CASETA}?text=${encodeURIComponent(mensajeWa)}`;
            window.open(urlWa, '_blank');
        }

        function guardarEnLocal(orden) {
            let bitacora = JSON.parse(localStorage.getItem('bitacoraInstrucciones')) || [];
            bitacora.unshift(orden); 
            localStorage.setItem('bitacoraInstrucciones', JSON.stringify(bitacora));
        }

        function cargarBitacora() {
            const container = document.getElementById('logContainer');
            let bitacora = JSON.parse(localStorage.getItem('bitacoraInstrucciones')) || [];
            
            container.innerHTML = ""; 

            if (bitacora.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#95a5a6;'>No hay instrucciones registradas en la bitácora aún.</p>";
                return;
            }

            bitacora.forEach(orden => {
                let clasePrioridad = "";
                if(orden.prioridad === "Alta") clasePrioridad = "alta";
                if(orden.prioridad === "Crítica") clasePrioridad = "critica";

                let claseBadge = "b-general";
                if(orden.area === "Patrullaje") claseBadge = "b-patrullaje";
                if(orden.area === "Monitoreo") claseBadge = "b-monitoreo";
                if(orden.area === "Proveedores") claseBadge = "b-proveedores";

                const div = document.createElement('div');
                div.className = `log-item ${clasePrioridad}`;
                div.innerHTML = `
                    <div class="log-header">
                        <span><span class="badge ${claseBadge}">${orden.area}</span> - Prioridad: ${orden.prioridad}</span>
                        <span>${orden.fecha} - ${orden.hora}</span>
                    </div>
                    <div class="log-body">${orden.texto}</div>
                    <div class="log-footer">
                        <span>Folio: ${orden.id}</span>
                        <button class="btn-pdf-mini" onclick="exportarInstruccionPDF('${orden.id}')">📄 Imprimir PDF</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filtrarBitacora() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.log-item');

            items.forEach(item => {
                const textoItem = item.innerText.toLowerCase();
                if (textoItem.includes(input)) {
                    item.style.display = "block";
                } else {
                    item.style.display = "none";
                }
            });
        }

        // --- FUNCIONES DE EXPORTACIÓN A PDF (html2pdf.js) ---

        function exportarInstruccionPDF(id) {
            let bitacora = JSON.parse(localStorage.getItem('bitacoraInstrucciones')) || [];
            let orden = bitacora.find(o => o.id === id);
            if(!orden) return;

            // Crear un contenedor temporal con formato formal
            let element = document.createElement('div');
            element.innerHTML = `
                <div style="font-family: Arial, sans-serif; padding: 40px; color: #333;">
                    <h2 style="text-align: center; color: #2c3e50; border-bottom: 3px solid #e74c3c; padding-bottom: 10px; margin-bottom: 5px;">El Cielo Parque Residencial</h2>
                    <h3 style="text-align: center; color: #7f8c8d; margin-top: 0;">Memorándum de Instrucción Operativa</h3>
                    <br>
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 14px;">
                        <tr>
                            <td style="padding: 10px; border: 1px solid #ddd; background: #f9f9f9;"><strong>Folio de Rastreo:</strong></td>
                            <td style="padding: 10px; border: 1px solid #ddd;">${orden.id}</td>
                        </tr>
                        <tr>
                            <td style="padding: 10px; border: 1px solid #ddd; background: #f9f9f9;"><strong>Fecha y Hora de Emisión:</strong></td>
                            <td style="padding: 10px; border: 1px solid #ddd;">${orden.fecha} - ${orden.hora}</td>
                        </tr>
                        <tr>
                            <td style="padding: 10px; border: 1px solid #ddd; background: #f9f9f9;"><strong>Área Operativa Destino:</strong></td>
                            <td style="padding: 10px; border: 1px solid #ddd;">${orden.area}</td>
                        </tr>
                        <tr>
                            <td style="padding: 10px; border: 1px solid #ddd; background: #f9f9f9;"><strong>Nivel de Prioridad:</strong></td>
                            <td style="padding: 10px; border: 1px solid #ddd; color: ${orden.prioridad === 'Crítica' ? '#e74c3c' : (orden.prioridad === 'Alta' ? '#f39c12' : '#27ae60')}; font-weight: bold;">
                                ${orden.prioridad.toUpperCase()}
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 10px; border: 1px solid #ddd; background: #f9f9f9;"><strong>Emitido por:</strong></td>
                            <td style="padding: 10px; border: 1px solid #ddd;">${orden.emisor}</td>
                        </tr>
                    </table>
                    
                    <h4 style="color: #2c3e50; margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Cuerpo de la Instrucción:</h4>
                    <div style="background: #fdfdfd; padding: 20px; border-left: 5px solid #2c3e50; white-space: pre-wrap; font-size: 15px; line-height: 1.6;">${orden.texto}</div>
                    
                    <div style="margin-top: 80px; text-align: center;">
                        <div style="width: 250px; margin: 0 auto; border-bottom: 1px solid #333;"></div>
                        <p style="margin-top: 10px; font-size: 14px; color: #555;">Firma de Enterado / Elemento en Turno</p>
                        <p style="font-size: 12px; color: #999;">Esta firma valida que la instrucción fue leída, comprendida y acatada según los protocolos de seguridad del residencial.</p>
                    </div>
                </div>
            `;

            let opt = {
              margin:       [0.5, 0.5, 0.5, 0.5],
              filename:     `Consigna_${orden.id}.pdf`,
              image:        { type: 'jpeg', quality: 0.98 },
              html2canvas:  { scale: 2 },
              jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            // Notificar al usuario mientras se procesa
            let btn = event.target;
            let originalText = btn.innerText;
            btn.innerText = "⏳ Generando...";
            btn.disabled = true;

            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }

        function exportarBitacoraGlobalPDF() {
            let bitacora = JSON.parse(localStorage.getItem('bitacoraInstrucciones')) || [];
            if(bitacora.length === 0) { 
                alert("⚠️ No hay instrucciones registradas para exportar."); 
                return; 
            }

            let element = document.createElement('div');
            let htmlContent = `
                <div style="font-family: Arial, sans-serif; padding: 20px; color: #333;">
                    <h2 style="text-align: center; color: #2c3e50; border-bottom: 3px solid #e74c3c; padding-bottom: 10px; margin-bottom: 5px;">El Cielo Parque Residencial</h2>
                    <h3 style="text-align: center; color: #7f8c8d; margin-top: 0;">Reporte General de Bitácora Operativa</h3>
                    <p style="text-align: right; font-size: 12px; color: #777;">Documento Generado: ${new Date().toLocaleString('es-MX')}<br>Total de registros: ${bitacora.length}</p>
                    <hr style="margin-bottom: 30px;">
            `;

            bitacora.forEach(orden => {
                htmlContent += `
                    <div style="margin-bottom: 25px; border-bottom: 1px dashed #ccc; padding-bottom: 15px; page-break-inside: avoid;">
                        <table style="width: 100%; border-collapse: collapse; font-size: 12px; background: #f9f9f9; margin-bottom: 10px;">
                            <tr>
                                <td style="padding: 5px; border: 1px solid #ddd;"><strong>Folio:</strong> ${orden.id}</td>
                                <td style="padding: 5px; border: 1px solid #ddd;"><strong>Fecha:</strong> ${orden.fecha} - ${orden.hora}</td>
                                <td style="padding: 5px; border: 1px solid #ddd;"><strong>Área:</strong> ${orden.area}</td>
                                <td style="padding: 5px; border: 1px solid #ddd;"><strong>Prioridad:</strong> ${orden.prioridad}</td>
                            </tr>
                        </table>
                        <p style="margin: 0 0 10px 0; font-size: 14px; white-space: pre-wrap;"><strong>Instrucción:</strong><br>${orden.texto}</p>
                        <p style="margin: 0; font-size: 11px; color: #777;"><em>Emitió: ${orden.emisor}</em></p>
                    </div>
                `;
            });

            htmlContent += `</div>`;
            element.innerHTML = htmlContent;

            let opt = {
              margin:       0.5,
              filename:     `Reporte_Bitacora_General_${new Date().getTime()}.pdf`,
              image:        { type: 'jpeg', quality: 0.98 },
              html2canvas:  { scale: 2 },
              jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            let btn = document.querySelector('.btn-pdf-global');
            let originalText = btn.innerText;
            btn.innerText = "⏳ Generando PDF...";
            btn.disabled = true;

            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
