<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría de Reportes Disciplinarios</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; color: #334155; margin: 0; padding: 20px; }
        .header { background: #0f172a; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; border-bottom: 5px solid #dc2626; }
        .header h1 { margin: 0; font-size: 1.8rem; }
        
        .search-box { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid #cbd5e1; margin-bottom: 20px; font-size: 1rem; box-sizing: border-box; outline: none; }
        .search-box:focus { border-color: #dc2626; }

        .table-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 0.95rem; }
        th { background: #f8fafc; color: #0f172a; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; }
        tr:hover { background: #f1f5f9; }
        
        .badge { background: #fee2e2; color: #b91c1c; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        #loading { text-align: center; color: #64748b; font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Archivo de Reportes Disciplinarios</h1>
    </div>

    <input type="text" id="buscador" class="search-box" placeholder="🔍 Buscar por nombre, dirección, falta o fecha (ej. Lote 45, Juan, 2024)..." onkeyup="filtrarTabla()">

    <div class="table-container">
        <table id="tablaReportes">
            <thead>
                <tr>
                    <th>Fecha / Hora</th>
                    <th>Infractor</th>
                    <th>Puesto</th>
                    <th>Dirección</th>
                    <th>Motivo de la Infracción</th>
                    <th>Jefe Inmediato</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo"></tbody>
        </table>
        <div id="loading">Cargando base de datos...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.appspot.com",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const q = query(collection(db, "reportes_disciplinarios"), orderBy("timestamp", "desc"));

        onSnapshot(q, (snapshot) => {
            const tbody = document.getElementById('tablaCuerpo');
            const loading = document.getElementById('loading');
            tbody.innerHTML = '';
            
            loading.style.display = 'none';

            if (snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No hay reportes disciplinarios registrados.</td></tr>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${data.fecha}</strong><br><span style="color:#64748b; font-size:0.8rem">${data.hora}</span></td>
                    <td><strong>${data.nombre}</strong></td>
                    <td>${data.puesto}</td>
                    <td>${data.direccion}</td>
                    <td><span class="badge">${data.naturaleza}</span></td>
                    <td>${data.jefe}</td>
                `;
                tbody.appendChild(tr);
            });
        }, (error) => {
            console.error(error);
            document.getElementById('loading').innerText = "Error al cargar los datos.";
        });

        // Lógica del buscador
        window.filtrarTabla = function() {
            const input = document.getElementById("buscador").value.toLowerCase();
            const filas = document.getElementById("tablaCuerpo").getElementsByTagName("tr");

            for (let i = 0; i < filas.length; i++) {
                // Si la fila tiene el mensaje de "No hay reportes", saltarla
                if(filas[i].cells.length === 1) continue; 
                
                const textoFila = filas[i].innerText.toLowerCase();
                if (textoFila.includes(input)) {
                    filas[i].style.display = "";
                } else {
                    filas[i].style.display = "none";
                }
            }
        };
    </script>
</body>
</html>
