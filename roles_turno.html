<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Roles - El Cielo</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background: #eef2f5; margin: 0; }
        .header { background: #2C3E50; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .controles { display: flex; justify-content: space-between; background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 15px; align-items: center;}
        .controles label { font-weight: bold; margin-right: 10px; color: #2C3E50; }
        .controles input[type="date"], .controles input[type="text"] { padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; font-size: 1em; }
        
        .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { border: 1px solid #ecf0f1; padding: 5px; text-align: center; }
        th { background: #34495E; color: white; padding: 12px; font-size: 0.9em; letter-spacing: 1px;}
        
        .input-nombre { width: 90%; border: none; font-weight: bold; background: transparent; text-transform: uppercase; outline: none; padding: 8px; color: #2C3E50; }
        .td-nombre { background: #f8f9fa; border-left: 5px solid #27AE60; text-align: left; padding-left: 10px; }
        
        select { width: 100%; padding: 10px 5px; border: none; font-weight: bold; background: transparent; cursor: pointer; outline: none; font-size: 0.85em; text-align: center; }
        
        /* Colores condicionales */
        .descanso { background-color: #E74C3C !important; color: white; }
        .turno1 { background-color: #D6EAF8; color: #154360; } /* 07 a 15 - Azul Claro */
        .turno2 { background-color: #FDEBD0; color: #7E5109; } /* 15 a 23 - Naranja Claro */
        .turno3 { background-color: #2C3E50; color: white; }   /* 23 a 07 - Oscuro */
        
        .botones-grupo { display: flex; gap: 10px; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px; color: white; }
        .btn:hover { opacity: 0.9; }
        .btn-green { background: #27AE60; }
        .btn-blue { background: #2980B9; }
        .btn-wa { background: #25D366; }
        .btn-copy { background: #8E44AD; }
        
        @media print {
            .controles, .btn { display: none !important; }
            body { background: white; padding: 0; }
            .table-container { box-shadow: none; }
            table { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0;">🗓️ ROL DE TURNOS SEMANAL</h2>
        <p style="margin:5px 0 0 0; opacity: 0.8;">Sistema de Gestión Operativa</p>
    </div>

    <div class="controles">
        <div>
            <label>Semana del:</label>
            <input type="date" id="fechaSemana" onchange="cargarRol()">
        </div>
        <div>
            <input type="text" id="buscador" placeholder="🔍 Buscar Agente..." onkeyup="filtrarTabla()">
        </div>
        <div class="botones-grupo">
            <button class="btn btn-blue" onclick="window.print()">🖨️ Imprimir</button>
            <button class="btn btn-copy" onclick="copiarTexto()">📋 Copiar</button>
            <button class="btn btn-wa" onclick="enviarRolesWhatsApp()">📲 Enviar WA</button>
        </div>
    </div>

    <div class="table-container">
        <table id="tablaRoles">
            <thead>
                <tr>
                    <th style="width: 22%;">NOMBRE DEL AGENTE</th>
                    <th>LUNES</th><th>MARTES</th><th>MIÉRCOLES</th><th>JUEVES</th><th>VIERNES</th><th>SÁBADO</th><th>DOMINGO</th>
                </tr>
            </thead>
            <tbody id="cuerpoRoles">
                </tbody>
        </table>
    </div>

    <script>
        const nombresDefault = ["ALEJANDRO", "LEROY", "ABEL", "VINALAY", "JOSE", "JULIO", "ALFONSO ACOSTA", "MARIO", "ISAEL", "LUIS CASTRO", "SANTILLAN", "ARMANDO", "SOTELO", "PIZARRO", "VICTOR CARDENA"];
        const turnos = ["07:00 A 15:00", "15:00 A 23:00", "23:00 A 07:00", "DESCANSO"];
        const dias = ['lun', 'mar', 'mie', 'jue', 'vie', 'sab', 'dom'];
        const numElementos = 15;

        // Configurar fecha inicial (Lunes de la semana actual)
        let hoy = new Date();
        let diaSemana = hoy.getDay() || 7; 
        if(diaSemana !== 1) hoy.setDate(hoy.getDate() - (diaSemana - 1));
        document.getElementById('fechaSemana').valueAsDate = hoy;

        function actualizarColor(selectElement) {
            let valor = selectElement.value;
            selectElement.parentElement.className = ""; 
            if (valor === "DESCANSO") selectElement.parentElement.classList.add("descanso");
            else if (valor === "07:00 A 15:00") selectElement.parentElement.classList.add("turno1");
            else if (valor === "15:00 A 23:00") selectElement.parentElement.classList.add("turno2");
            else if (valor === "23:00 A 07:00") selectElement.parentElement.classList.add("turno3");
        }

        function construirTabla() {
            let tbody = document.getElementById('cuerpoRoles');
            tbody.innerHTML = '';
            
            for(let i = 0; i < numElementos; i++) {
                let tr = document.createElement('tr');
                tr.className = 'fila-agente';
                
                let tdNombre = document.createElement('td');
                tdNombre.className = 'td-nombre';
                let inputNombre = document.createElement('input');
                inputNombre.type = 'text';
                inputNombre.className = 'input-nombre';
                inputNombre.id = `nombre_${i}`;
                inputNombre.onchange = autoGuardar; // Guarda automáticamente al cambiar nombre
                tdNombre.appendChild(inputNombre);
                tr.appendChild(tdNombre);
                
                dias.forEach(dia => {
                    let td = document.createElement('td');
                    let select = document.createElement('select');
                    select.id = `${dia}_${i}`;
                    select.onchange = function() { 
                        actualizarColor(this); 
                        autoGuardar(); // Guarda automáticamente al cambiar turno
                    };

                    turnos.forEach(t => {
                        let option = document.createElement('option');
                        option.value = t;
                        option.innerText = t;
                        select.appendChild(option);
                    });
                    
                    td.appendChild(select);
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            }
        }

        function cargarRol() {
            let fecha = document.getElementById('fechaSemana').value;
            let dbRoles = JSON.parse(localStorage.getItem('db_roles_semanales')) || {};
            let datosSemana = dbRoles[fecha] || null;
            let nombresGuardados = JSON.parse(localStorage.getItem('lista_nombres_global')) || nombresDefault;

            for(let i = 0; i < numElementos; i++) {
                // Cargar nombres
                document.getElementById(`nombre_${i}`).value = (datosSemana && datosSemana[`nombre_${i}`]) ? datosSemana[`nombre_${i}`] : nombresGuardados[i];
                
                // Cargar turnos
                dias.forEach(dia => {
                    let select = document.getElementById(`${dia}_${i}`);
                    select.value = (datosSemana && datosSemana[`${dia}_${i}`]) ? datosSemana[`${dia}_${i}`] : "07:00 A 15:00";
                    actualizarColor(select);
                });
            }
        }

        // Nueva función de guardado silencioso (sin alertas molestas)
        function autoGuardar() {
            let fecha = document.getElementById('fechaSemana').value;
            if(!fecha) return;

            let dbRoles = JSON.parse(localStorage.getItem('db_roles_semanales')) || {};
            let datosSemana = {};
            let nombresActuales = [];

            for(let i = 0; i < numElementos; i++) {
                let nom = document.getElementById(`nombre_${i}`).value.toUpperCase();
                datosSemana[`nombre_${i}`] = nom;
                nombresActuales.push(nom);

                dias.forEach(dia => {
                    datosSemana[`${dia}_${i}`] = document.getElementById(`${dia}_${i}`).value;
                });
            }

            dbRoles[fecha] = datosSemana;
            localStorage.setItem('db_roles_semanales', JSON.stringify(dbRoles));
            localStorage.setItem('lista_nombres_global', JSON.stringify(nombresActuales));
        }

        function filtrarTabla() {
            let filtro = document.getElementById('buscador').value.toUpperCase();
            let filas = document.getElementsByClassName('fila-agente');
            for(let i = 0; i < filas.length; i++) {
                let inputNom = filas[i].querySelector('.input-nombre');
                if(inputNom.value.toUpperCase().indexOf(filtro) > -1) {
                    filas[i].style.display = "";
                } else {
                    filas[i].style.display = "none";
                }
            }
        }

        // Generador central del mensaje (Lee DIRECTAMENTE de la pantalla)
        function generarTextoMensaje() {
            let fecha = document.getElementById('fechaSemana').value;
            // Formatear fecha para que sea más legible
            let fechaFormateada = new Date(fecha + 'T00:00:00').toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
            
            let texto = `*🗓️ ROL DE TURNOS*\n*Semana del:* ${fechaFormateada}\n\n`;
            
            const mapT = { "07:00 A 15:00": "07 a 15", "15:00 A 23:00": "15 a 23", "23:00 A 07:00": "23 a 07", "DESCANSO": "🔴 DESC" };
            const nDias = ['LUN', 'MAR', 'MIE', 'JUE', 'VIE', 'SAB', 'DOM'];

            for(let i = 0; i < numElementos; i++) {
                let nombre = document.getElementById(`nombre_${i}`).value.trim();
                if(!nombre) continue; // Si el nombre está vacío, lo salta
                
                texto += `👤 *${nombre}*\n`;
                let linea = "";
                dias.forEach((diaClave, idx) => {
                    let turnoSeleccionado = document.getElementById(`${diaClave}_${i}`).value;
                    let t = mapT[turnoSeleccionado];
                    linea += `${nDias[idx]}:${t} | `;
                });
                texto += linea.slice(0, -3) + `\n\n`; 
            }

            texto += `⚠️ *CONFIRMACIÓN REQUERIDA*\nResponde a este mensaje con la palabra *"ENTERADO"* para confirmar tu rol.`;
            return texto;
        }

        function enviarRolesWhatsApp() {
            autoGuardar(); // Aseguramos que se guarde antes de salir
            let textoWa = generarTextoMensaje();
            let url = `https://wa.me/526692486726?text=${encodeURIComponent(textoWa)}`;
            window.open(url, '_blank');
        }

        function copiarTexto() {
            autoGuardar();
            let texto = generarTextoMensaje();
            navigator.clipboard.writeText(texto).then(() => {
                alert("✅ Rol copiado al portapapeles. Puedes pegarlo directamente en el grupo de WhatsApp.");
            }).catch(err => {
                alert("Error al copiar. Intenta usar el botón de Enviar WA.");
            });
        }

        // Inicializar
        construirTabla();
        cargarRol();
    </script>
</body>
</html>
