<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Turnos - El Cielo Parque Residencial</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --light: #f3f4f6;
            --dark: #1f2937;
            --success: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }
        h1 { color: var(--primary); margin-bottom: 5px; }
        .motto { font-style: italic; color: #4b5563; font-weight: bold; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { color: var(--secondary); margin-top: 0; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;}
        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover { background-color: var(--secondary); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }
        th { background-color: var(--light); color: var(--dark); }
        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .bg-success { background-color: var(--success); }
        .bg-danger { background-color: var(--danger); }
        .flex-row { display: flex; gap: 10px; }
        .flex-row > div { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Control de Personal - El Cielo Parque Residencial</h1>
        <p class="motto">Consigna: Firmeza, no prepotencia</p>
    </header>

    <div class="grid">
        <div class="card">
            <h2>Configuración de Elementos</h2>
            <form id="form-agente">
                <div class="flex-row">
                    <div class="form-group">
                        <label for="id-agente">Seleccionar Número de Agente</label>
                        <select id="id-agente" required>
                            </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="nombre-agente">Nombre del Elemento</label>
                    <input type="text" id="nombre-agente" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="flex-row form-group">
                    <div>
                        <label for="descanso-1">Día de Descanso 1</label>
                        <select id="descanso-1" required>
                            <option value="1">Lunes</option>
                            <option value="2">Martes</option>
                            <option value="3">Miércoles</option>
                            <option value="4">Jueves</option>
                            <option value="5">Viernes</option>
                            <option value="6">Sábado</option>
                            <option value="0">Domingo</option>
                        </select>
                    </div>
                    <div>
                        <label for="descanso-2">Día de Descanso 2</label>
                        <select id="descanso-2" required>
                            <option value="1">Lunes</option>
                            <option value="2">Martes</option>
                            <option value="3">Miércoles</option>
                            <option value="4">Jueves</option>
                            <option value="5">Viernes</option>
                            <option value="6">Sábado</option>
                            <option value="0">Domingo</option>
                        </select>
                    </div>
                </div>
                <button type="submit">Actualizar Elemento en Base de Datos</button>
            </form>

            <h3 style="margin-top: 30px; border-bottom: 1px solid #e5e7eb; padding-bottom: 5px;">Plantilla Actual</h3>
            <table id="tabla-plantilla">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descansos</th>
                    </tr>
                </thead>
                <tbody id="lista-plantilla">
                    </tbody>
            </table>
        </div>

        <div class="card">
            <h2>Auditoría de Servicio</h2>
            <p style="font-size: 14px; color: #4b5563;">Selecciona una fecha para verificar qué elementos estaban en servicio o de descanso.</p>
            <div class="form-group">
                <label for="fecha-auditoria">Fecha a auditar:</label>
                <input type="date" id="fecha-auditoria">
            </div>
            <button id="btn-auditar">Generar Reporte del Día</button>

            <h3 id="titulo-reporte" style="margin-top: 20px; display: none;">Reporte del <span id="fecha-texto"></span></h3>
            <table id="tabla-auditoria" style="display: none;">
                <thead>
                    <tr>
                        <th>Elemento</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="lista-auditoria">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Tu configuración exacta de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
        authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
        projectId: "sistema-vigilancia-6851e",
        storageBucket: "sistema-vigilancia-6851e.appspot.com",
        messagingSenderId: "714792023462",
        appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Mapeo de días para UI
    const diasSemana = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

    // Inicializar selectores de agentes (1 a 15)
    const selectAgente = document.getElementById('id-agente');
    for (let i = 1; i <= 15; i++) {
        let option = document.createElement('option');
        option.value = `Agente_${i}`;
        option.textContent = `Agente ${i}`;
        selectAgente.appendChild(option);
    }

    // Guardar/Actualizar agente en Firestore
    document.getElementById('form-agente').addEventListener('submit', async (e) => {
        e.preventDefault();
        const idAgente = document.getElementById('id-agente').value;
        const nombre = document.getElementById('nombre-agente').value;
        const descanso1 = parseInt(document.getElementById('descanso-1').value);
        const descanso2 = parseInt(document.getElementById('descanso-2').value);

        if (descanso1 === descanso2) {
            alert("Los días de descanso deben ser diferentes.");
            return;
        }

        try {
            await setDoc(doc(db, "elementos", idAgente), {
                nombre: nombre,
                descansos: [descanso1, descanso2],
                actualizado: new Date()
            });
            alert(`Datos de ${nombre} guardados exitosamente.`);
            document.getElementById('form-agente').reset();
        } catch (error) {
            console.error("Error al guardar: ", error);
            alert("Error al guardar en base de datos.");
        }
    });

    // Escuchar cambios en la plantilla en tiempo real
    onSnapshot(collection(db, "elementos"), (snapshot) => {
        const tbody = document.getElementById('lista-plantilla');
        tbody.innerHTML = '';
        
        let elementos = [];
        snapshot.forEach((doc) => {
            elementos.push({ id: doc.id, ...doc.data() });
        });

        // Ordenar por número de agente
        elementos.sort((a, b) => parseInt(a.id.split('_')) - parseInt(b.id.split('_')));

        elementos.forEach((el) => {
            let tr = document.createElement('tr');
            let txtDescansos = `${diasSemana[el.descansos]} y ${diasSemana[el.descansos]}`;
            tr.innerHTML = `
                <td>${el.id.replace('_', ' ')}</td>
                <td><strong>${el.nombre}</strong></td>
                <td>${txtDescansos}</td>
            `;
            tbody.appendChild(tr);
        });
    });

    // Lógica de Auditoría por Fecha
    document.getElementById('btn-auditar').addEventListener('click', async () => {
        const fechaStr = document.getElementById('fecha-auditoria').value;
        if (!fechaStr) {
            alert("Por favor selecciona una fecha.");
            return;
        }

        // Obtener el día de la semana de la fecha seleccionada
        // Se añade 'T12:00:00' para evitar desfases de zona horaria al parsear
        const fechaSeleccionada = new Date(fechaStr + 'T12:00:00');
        const diaDeLaSemana = fechaSeleccionada.getDay(); // 0 = Domingo, 1 = Lunes...

        document.getElementById('titulo-reporte').style.display = 'block';
        document.getElementById('tabla-auditoria').style.display = 'table';
        document.getElementById('fecha-texto').textContent = `${fechaSeleccionada.toLocaleDateString()} (${diasSemana[diaDeLaSemana]})`;

        const tbodyAuditoria = document.getElementById('lista-auditoria');
        tbodyAuditoria.innerHTML = '';

        try {
            const querySnapshot = await getDocs(collection(db, "elementos"));
            let elementosAuditoria = [];
            
            querySnapshot.forEach((doc) => {
                elementosAuditoria.push({ id: doc.id, ...doc.data() });
            });

            // Ordenar alfabéticamente por nombre
            elementosAuditoria.sort((a, b) => a.nombre.localeCompare(b.nombre));

            elementosAuditoria.forEach(el => {
                let tr = document.createElement('tr');
                
                // Si el día de la semana actual coincide con alguno de sus descansos
                let estaDeDescanso = el.descansos.includes(diaDeLaSemana);
                
                let estadoHTML = estaDeDescanso 
                    ? `<span class="badge bg-danger">Descanso</span>` 
                    : `<span class="badge bg-success">En Servicio</span>`;

                tr.innerHTML = `
                    <td>${el.nombre} <br><small style="color:#6b7280">${el.id.replace('_', ' ')}</small></td>
                    <td>${estadoHTML}</td>
                `;
                tbodyAuditoria.appendChild(tr);
            });

        } catch (error) {
            console.error("Error al auditar: ", error);
        }
    });
</script>
</body>
</html>
