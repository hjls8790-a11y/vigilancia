<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asamblea | Registro y Votación</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif; background: #1a2a3a; color: white;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .container {
            background: #23374d; padding: 25px; border-radius: 12px; width: 100%;
            max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { color: #3498db; text-align: center; font-size: 22px; text-transform: uppercase; }
        label { font-weight: bold; margin-top: 15px; display: block; font-size: 14px; color: #cbd5e1; }
        input[type="text"], select {
            width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px;
            border: 1px solid #3498db; background: #111d28; color: white; box-sizing: border-box;
        }
        .firma-container { margin-top: 10px; border: 2px dashed #3498db; border-radius: 6px; background: white; }
        canvas { width: 100%; height: 150px; touch-action: none; display: block; }
        .btn-limpiar {
            background: #e74c3c; color: white; border: none; padding: 5px 10px;
            font-size: 12px; cursor: pointer; border-radius: 4px; margin-top: 5px;
        }
        .btn-submit {
            background: #27ae60; color: white; border: none; padding: 15px; width: 100%;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
            margin-top: 25px; transition: 0.3s;
        }
        .btn-submit:hover { background: #2ecc71; }
        .btn-submit:disabled { background: #7f8c8d; cursor: not-allowed; }
        #status { text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📝 Registro de Asamblea</h1>
        
        <label>Nombre Completo del Propietario:</label>
        <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>

        <label>Unidad / Casa / Departamento:</label>
        <input type="text" id="unidad" placeholder="Ej. Lote 45" required>

        <label>Votación (Aprobación de Presupuesto):</label>
        <select id="voto">
            <option value="">-- Selecciona tu voto --</option>
            <option value="A favor">✅ A favor</option>
            <option value="En contra">❌ En contra</option>
            <option value="Abstención">⚪ Abstención</option>
        </select>

        <label>Firma Digital (Dibuja aquí):</label>
        <div class="firma-container">
            <canvas id="canvasFirma"></canvas>
        </div>
        <button class="btn-limpiar" onclick="limpiarFirma()">Borrar firma</button>

        <button id="btnEnviar" class="btn-submit">📍 Registrar Asistencia y Voto</button>
        <div id="status"></div>
    </div>

    <script type="module">
        // Usando exactamente la misma versión e importaciones que tu código de salidas
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebaseapp.com",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Configuración de Firma
        const canvas = document.getElementById('canvasFirma');
        const ctx = canvas.getContext('2d');
        let dibujando = false;

        function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = 150; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        const startPosition = (e) => { dibujando = true; draw(e); };
        const endPosition = () => { dibujando = false; ctx.beginPath(); };
        const draw = (e) => {
            if (!dibujando) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
            ctx.lineTo(x, y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x, y);
        };

        canvas.addEventListener('mousedown', startPosition); canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw); canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', endPosition); canvas.addEventListener('touchmove', draw);

        window.limpiarFirma = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Enviar datos
        document.getElementById('btnEnviar').addEventListener('click', async () => {
            const nombre = document.getElementById('nombre').value.trim();
            const unidad = document.getElementById('unidad').value.trim();
            const voto = document.getElementById('voto').value;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('btnEnviar');

            if (!nombre || !unidad || !voto) return statusDiv.innerHTML = "⚠️ Llena todos los campos.", statusDiv.style.color = "#f1c40f";

            const blank = document.createElement('canvas'); blank.width = canvas.width; blank.height = canvas.height;
            if (canvas.toDataURL() === blank.toDataURL()) return statusDiv.innerHTML = "⚠️ Falta tu firma.", statusDiv.style.color = "#f1c40f";

            btn.disabled = true;
            statusDiv.innerText = "📍 Obteniendo ubicación GPS..."; statusDiv.style.color = "#3498db";

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const firmaBase64 = canvas.toDataURL('image/png');

                statusDiv.innerText = "⏳ Guardando...";

                const hoy = new Date();
                // Generamos un ID único como en tus salidas
                const folioAsistencia = `VOTO-${hoy.getTime()}`;

                const registroData = {
                    nombre: nombre,
                    unidad: unidad,
                    voto: voto,
                    latitud: lat,
                    longitud: lng,
                    firma: firmaBase64,
                    fecha: hoy.toLocaleDateString('es-MX') + ' ' + hoy.toLocaleTimeString('es-MX'),
                    timestamp: hoy.getTime()
                };

                try {
                    // Usamos setDoc para que coincida con tus permisos actuales de Firebase
                    await setDoc(doc(db, "asistencia_asamblea", folioAsistencia), registroData);
                    
                    statusDiv.innerText = "✅ Registro exitoso."; statusDiv.style.color = "#27ae60";
                    setTimeout(() => location.reload(), 3000);
                } catch (error) {
                    console.error(error);
                    statusDiv.innerText = "❌ Error al guardar."; statusDiv.style.color = "#e74c3c";
                    btn.disabled = false;
                }
            }, () => {
                statusDiv.innerText = "❌ Debes permitir la ubicación."; statusDiv.style.color = "#e74c3c";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
