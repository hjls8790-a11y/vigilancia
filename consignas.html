<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control y Auditoría de Consignas</title>
    <style>
        :root {
            --primary: #1a2a3a;
            --secondary: #3498db;
            --accent: #2980b9;
            --bg-dark: #2c3e50;
            --text-light: #ecf0f1;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f1c40f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121c26;
            color: var(--text-light);
            margin: 0;
            padding: 0;
        }

        .header {
            background: var(--primary);
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--secondary);
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Pestañas de Navegación */
        .tabs {
            display: flex;
            justify-content: center;
            background: var(--bg-dark);
            padding: 10px 0 0 0;
        }

        .tab-btn {
            background: #34495e;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            margin: 0 5px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--secondary);
            color: white;
        }

        .tab-content {
            display: none;
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .tab-content.active {
            display: block;
        }

        /* Formulario de Registro */
        .card {
            background: var(--bg-dark);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #bdc3c7;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #1a2a3a;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .btn-guardar {
            background: var(--success);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .btn-guardar:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }

        /* Tabla de Historial */
        .table-container {
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        th {
            background: var(--bg-dark);
            color: white;
        }

        tr:hover {
            background-color: #f1f2f6;
        }

        .badge-alta { background: var(--danger); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;}
        .badge-media { background: var(--warning); color: black; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;}
        .badge-baja { background: var(--success); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;}
        
        #btnActualizar {
            background: var(--primary); color: white; border: none; padding: 12px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; border: 1px solid var(--secondary);
        }

        /* Buscador */
        .filtros-busqueda {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .input-busqueda {
            background: white;
            color: #333;
            border: 1px solid #ccc;
            flex: 1;
            min-width: 180px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📋 Control y Auditoría de Consignas</h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="cambiarPestana('registro')">📝 Emitir Consigna</button>
        <button class="tab-btn" onclick="cambiarPestana('historial'); cargarHistorial();">🔍 Auditoría de Operaciones</button>
    </div>

    <!-- PESTAÑA: REGISTRO DE CONSIGNA -->
    <div id="registro" class="tab-content active">
        <div class="card">
            <h2 style="text-align: center; color: var(--secondary); margin-top: 0;">Registro Oficial de Instrucción</h2>
            
            <div class="form-group">
                <label>📍 Sector / Ubicación</label>
                <select id="consSector">
                    <option value="El Cielo Parque Residencial">El Cielo Parque Residencial</option>
                    <option value="Caseta Principal">Caseta Principal</option>
                    <option value="Rondines / Perímetro">Rondines / Perímetro</option>
                    <option value="Obras y Construcción">Obras y Construcción</option>
                </select>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 2;">
                    <label>📌 Asunto / Título de la Consigna</label>
                    <input type="text" id="consAsunto" placeholder="Ej. Control de acceso de proveedores" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>⚠️ Prioridad</label>
                    <select id="consPrioridad">
                        <option value="Alta">Alta (Roja)</option>
                        <option value="Media">Media (Amarilla)</option>
                        <option value="Baja">Baja (Verde)</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>📅 Fecha de Emisión</label>
                    <input type="date" id="consFecha" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>👮 Dirigido a (Responsables)</label>
                    <input type="text" id="consReceptor" placeholder="Ej. Guillermo Jiménez, Turno Nocturno..." required>
                </div>
            </div>

            <div class="form-group">
                <label>📝 Descripción Detallada de la Instrucción</label>
                <textarea id="consDesc" rows="5" placeholder="Redacta la consigna con la premisa de Oír, Ver y Callar..." required></textarea>
            </div>

            <div class="form-group">
                <label>✍️ Emitida por (Autoriza)</label>
                <input type="text" id="consEmisor" placeholder="Nombre de quien autoriza la instrucción" required>
            </div>

            <button class="btn-guardar" id="btnGuardarCons" onclick="guardarConsigna()">💾 Generar Registro de Consigna</button>
        </div>
    </div>

    <!-- PESTAÑA: HISTORIAL Y AUDITORÍA -->
    <div id="historial" class="tab-content">
        
        <div class="filtros-busqueda">
            <button id="btnActualizar" onclick="cargarHistorial()">🔄 Actualizar Tabla</button>
            <input type="date" id="busquedaFecha" class="input-busqueda" onchange="filtrarHistorial()" title="Filtrar por fecha">
            <input type="text" id="busquedaTexto" class="input-busqueda" style="flex: 2;" placeholder="🔍 Buscar por Asunto, Sector, Responsable o Texto..." onkeyup="filtrarHistorial()">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Sector</th>
                        <th>Prioridad</th>
                        <th>Asunto / Detalle</th>
                        <th>Responsables</th>
                        <th>Emitió</th>
                    </tr>
                </thead>
                <tbody id="tablaHistorial">
                    <tr><td colspan="6" style="text-align: center;">Cargando base de datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let datosHistorialGlobal = [];

        window.cambiarPestana = (idPestana) => {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(idPestana).classList.add('active');
            event.currentTarget.classList.add('active');
        };

        // Fecha de hoy por defecto
        document.getElementById('consFecha').valueAsDate = new Date();

        // 1. GUARDAR CONSIGNA (SOLO CREACIÓN, CUMPLE LA REGLA)
        window.guardarConsigna = async () => {
            const sector = document.getElementById('consSector').value;
            const asunto = document.getElementById('consAsunto').value.trim();
            const prioridad = document.getElementById('consPrioridad').value;
            const fecha = document.getElementById('consFecha').value;
            const receptor = document.getElementById('consReceptor').value.trim();
            const descripcion = document.getElementById('consDesc').value.trim();
            const emisor = document.getElementById('consEmisor').value.trim();

            if (!asunto || !receptor || !descripcion || !emisor) {
                return alert("⚠️ Debes llenar todos los campos de texto para generar la consigna.");
            }

            const btn = document.getElementById('btnGuardarCons');
            btn.innerText = "⏳ Generando Registro..."; 
            btn.disabled = true;

            try {
                // Creamos una nueva colección llamada "registro_consignas"
                await addDoc(collection(db, "registro_consignas"), {
                    sector: sector,
                    asunto: asunto,
                    prioridad: prioridad,
                    fecha_emision: fecha,
                    dirigido_a: receptor,
                    descripcion: descripcion,
                    emitido_por: emisor,
                    timestamp: Date.now(),
                    fecha_sistema: new Date().toLocaleString('es-MX')
                });

                alert("✅ Consigna emitida y respaldada en la base de datos.");
                document.getElementById('consAsunto').value = '';
                document.getElementById('consDesc').value = '';
                btn.innerText = "💾 Generar Registro de Consigna"; 
                btn.disabled = false;
                
            } catch (error) {
                alert("❌ Error de conexión. Revisa el internet.");
                console.error(error);
                btn.innerText = "💾 Generar Registro de Consigna"; 
                btn.disabled = false;
            }
        };

        // 2. DESCARGAR Y AUDITAR HISTORIAL (SOLO LECTURA)
        window.cargarHistorial = async () => {
            const tbody = document.getElementById('tablaHistorial');
            tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Consultando bitácora de servidor...</td></tr>";
            
            document.getElementById('busquedaFecha').value = "";
            document.getElementById('busquedaTexto').value = "";

            try {
                const q = query(collection(db, "registro_consignas"), orderBy("timestamp", "desc"));
                const snapshot = await getDocs(q);
                
                datosHistorialGlobal = [];
                snapshot.forEach(doc => {
                    datosHistorialGlobal.push(doc.data());
                });

                renderizarTabla(datosHistorialGlobal);

            } catch(e) { 
                console.error(e); 
                tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:red;'>Error de permisos o conexión a la base de datos.</td></tr>";
            }
        };

        // 3. RENDERIZAR TABLA CON ETIQUETAS DE PRIORIDAD
        window.renderizarTabla = (datos) => {
            const tbody = document.getElementById('tablaHistorial');
            let filas = "";

            datos.forEach(d => {
                let badgeClass = "badge-baja";
                if(d.prioridad === "Alta") badgeClass = "badge-alta";
                if(d.prioridad === "Media") badgeClass = "badge-media";

                filas += `<tr>
                    <td style="white-space: nowrap;"><b>${d.fecha_emision}</b></td>
                    <td style="color:var(--accent); font-weight:bold;">${d.sector}</td>
                    <td><span class="${badgeClass}">${d.prioridad}</span></td>
                    <td style="max-width: 300px;">
                        <strong>${d.asunto}</strong><br>
                        <span style="color: #666; font-size: 12px;">${d.descripcion}</span>
                    </td>
                    <td>${d.dirigido_a}</td>
                    <td>${d.emitido_por}</td>
                </tr>`;
            });

            if(filas === "") {
                tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>No hay consignas registradas o que coincidan con la búsqueda.</td></tr>";
            } else {
                tbody.innerHTML = filas;
            }
        };

        // 4. BUSCADOR EN TIEMPO REAL
        window.filtrarHistorial = () => {
            const fechaBuscada = document.getElementById('busquedaFecha').value;
            const textoBuscado = document.getElementById('busquedaTexto').value.toLowerCase();

            const datosFiltrados = datosHistorialGlobal.filter(d => {
                const coincideFecha = fechaBuscada === "" || d.fecha_emision === fechaBuscada;
                
                const textoEnAsunto = (d.asunto || "").toLowerCase().includes(textoBuscado);
                const textoEnDesc = (d.descripcion || "").toLowerCase().includes(textoBuscado);
                const textoEnSector = (d.sector || "").toLowerCase().includes(textoBuscado);
                const textoEnReceptor = (d.dirigido_a || "").toLowerCase().includes(textoBuscado);
                
                const coincideTexto = textoBuscado === "" || textoEnAsunto || textoEnDesc || textoEnSector || textoEnReceptor;

                return coincideFecha && coincideTexto;
            });

            renderizarTabla(datosFiltrados);
        };
    </script>
</body>
</html>
