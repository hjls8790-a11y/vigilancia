<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        const clave = prompt("🔒 Acceso Supervisor:");
        if (clave !== "AdminGen2026") { window.location.href = "menu.html"; }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERVISIÓN GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #1a2a3a; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        #filtros { background: #ecf0f1; padding: 10px; display: flex; gap: 10px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #map { flex: 1; width: 100%; }
        input, select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
        .btn-ver { background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="header">
        <h2 style="margin:0;">📡 MONITOREO GPS EN TIEMPO REAL</h2>
        <span id="contador">Cargando puntos...</span>
    </div>

    <div id="filtros">
        <label>📅 Filtrar por Fecha:</label>
        <input type="date" id="inputFecha">
        <label>👮‍♂️ Oficial:</label>
        <input type="text" id="inputNombre" placeholder="Nombre...">
        <button class="btn-ver" onclick="cargarDatos()">🔍 APLICAR FILTROS</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const map = L.map('map').setView([24.809, -107.394], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let marcadores = L.layerGroup().addTo(map);

        window.cargarDatos = async function() {
            marcadores.clearLayers();
            const fechaFiltro = document.getElementById('inputFecha').value; // Formato YYYY-MM-DD
            const nombreFiltro = document.getElementById('inputNombre').value.toLowerCase();
            
            const q = query(collection(db, "recorridos"), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            
            let puntosMostrados = 0;

            snapshot.forEach(doc => {
                const d = doc.data();
                
                // --- Lógica de Corrección de Fecha ---
                let coincideFecha = true;
                if (fechaFiltro) {
                    const [y, m, d_f] = fechaFiltro.split('-');
                    const fechaFormateada = `${parseInt(d_f)}/${parseInt(m)}/${y}`; // Convierte a D/M/YYYY
                    coincideFecha = d.fecha_hora.includes(fechaFormateada);
                }
                
                const coincideNombre = d.oficial.toLowerCase().includes(nombreFiltro);

                if (coincideFecha && coincideNombre) {
                    puntosMostrados++;
                    const popup = `
                        <div style="width:160px;">
                            <b>👮‍♂️ ${d.oficial}</b><br>
                            <small>📅 ${d.fecha_hora}</small><br>
                            <p style="margin:5px 0;">📝 ${d.novedad}</p>
                            ${d.evidencia_foto !== "NO" 
                                ? `<img src="${d.evidencia_foto}" style="width:100%; border-radius:5px; cursor:pointer;" onclick="window.open(this.src)">` 
                                : '<i style="color:gray;">Sin foto</i>'}
                        </div>
                    `;
                    L.marker([d.latitud, d.longitud]).addTo(marcadores).bindPopup(popup);
                }
            });

            document.getElementById('contador').innerText = puntosMostrados + " puntos encontrados";
            if(puntosMostrados > 0) {
                const group = new L.featureGroup(marcadores.getLayers());
                map.fitBounds(group.getBounds());
            }
        };

        cargarDatos();
    </script>
</body>
</html>
