<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>CENTRAL DE SUPERVISIÓN MAESTRA</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: #ecf0f1;
            color: #2c3e50;
        }

        header {
            background: #1a2a3a;
            color: white;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin: 0;
            font-size: 20px;
            text-transform: uppercase;
            width: 100%;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .filtros {
            display: flex;
            gap: 10px;
            flex-grow: 1;
        }

        input,
        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #bdc3c7;
            font-size: 14px;
        }

        .btn-buscar {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        #map {
            height: 400px;
            width: 100%;
            border-radius: 12px;
            border: 2px solid #bdc3c7;
            z-index: 1;
        }

        .panel-datos {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h3 {
            margin-top: 0;
            color: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
            font-size: 13px;
        }

        th {
            background: #2c3e50;
            color: white;
        }

        .img-mini {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ccc;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 11px;
            color: white;
        }

        .bg-entrada {
            background: #27ae60;
        }

        .bg-salida {
            background: #c0392b;
        }

        .btn-ver-ruta {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>🛰️ Panel de Supervisión y Evaluaciones</h1>
        <div class="filtros">
            <select id="filtroSector" onchange="filtrarDatos()">
                <option value="TODOS">Todos los Sectores</option>
                <option value="Proyecto Residencial">Proyecto Residencial</option>
                <option value="Club Cardones">Club Cardones</option>
                <option value="Obras Fotur">Obras Fotur</option>
            </select>
            <input type="text" id="filtroAgente" placeholder="Nombre del Agente..." onkeyup="filtrarDatos()">
            <input type="date" id="filtroFecha" onchange="filtrarDatos()">
        </div>
        <button onclick="cargarBaseDeDatos()" class="btn-buscar">🔄 REFRESCAR SISTEMA</button>
    </header>

    <div class="contenedor-principal">
        <div id="map"></div>

        <div class="panel-datos">
            <h3>⏱️ Registro de Asistencia (Entradas y Salidas en Sitio)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Agente</th>
                        <th>Sector</th>
                        <th>Tipo</th>
                        <th>Fecha y Hora</th>
                        <th>Ubicación</th>
                    </tr>
                </thead>
                <tbody id="tablaAsistencia"></tbody>
            </table>
        </div>

        <div class="panel-datos">
            <h3>🚶‍♂️ Evaluación de Recorridos (Rondines)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Agente</th>
                        <th>Sector</th>
                        <th>Inicio</th>
                        <th>Fin</th>
                        <th>Puntos/Novedades</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaRecorridos"></tbody>
            </table>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Inicializar Mapa centrado en Culiacán, Sinaloa
        const map = L.map('map').setView([24.809, -107.394], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let capaMarcadores = L.layerGroup().addTo(map);
        let rutaRoja = null; // Línea del recorrido

        let datosGlobales = [];
        let recorridosAgrupados = {};

        window.cargarBaseDeDatos = async () => {
            const btn = document.querySelector('.btn-buscar');
            btn.innerText = "Cargando...";
            try {
                const q = query(collection(db, "recorridos"), orderBy("timestamp", "asc"));
                const snapshot = await getDocs(q);
                datosGlobales = [];
                snapshot.forEach(doc => datosGlobales.push(doc.data()));

                // Setear fecha de hoy por defecto si está vacía
                if (!document.getElementById('filtroFecha').value) {
                    document.getElementById('filtroFecha').valueAsDate = new Date();
                }

                filtrarDatos();
            } catch (e) { console.error(e); alert("Error al conectar con la base de datos."); }
            btn.innerText = "🔄 REFRESCAR SISTEMA";
        };

        window.filtrarDatos = () => {
            const fSector = document.getElementById('filtroSector').value;
            const fAgente = document.getElementById('filtroAgente').value.toLowerCase();
            const fFecha = document.getElementById('filtroFecha').value; // YYYY-MM-DD

            capaMarcadores.clearLayers();
            if (rutaRoja) map.removeLayer(rutaRoja);

            const tablaAsist = document.getElementById('tablaAsistencia');
            const tablaRec = document.getElementById('tablaRecorridos');
            tablaAsist.innerHTML = ""; tablaRec.innerHTML = "";
            recorridosAgrupados = {};

            // Formatear fecha para comparar
            let fechaStr = "";
            if (fFecha) {
                const [y, m, d] = fFecha.split('-');
                fechaStr = `${parseInt(d)}/${parseInt(m)}/${y}`;
            }

            datosGlobales.forEach(d => {
                // Aplicar filtros
                if (fSector !== "TODOS" && d.sector !== fSector) return;
                if (fAgente && !(d.oficial || "").toLowerCase().includes(fAgente)) return;
                if (fechaStr && !d.fecha_hora.includes(fechaStr)) return;

                // 1. Llenar Asistencias
                if (d.tipo === "ENTRADA" || d.tipo === "SALIDA") {
                    const color = d.tipo === "ENTRADA" ? "bg-entrada" : "bg-salida";
                    tablaAsist.innerHTML += `<tr>
                        <td><b>${d.oficial}</b></td>
                        <td>${d.sector}</td>
                        <td><span class="badge ${color}">${d.tipo}</span></td>
                        <td>${d.fecha_hora}</td>
                        <td><button onclick="verPuntoEnMapa(${d.latitud}, ${d.longitud}, '${d.oficial} - ${d.tipo}')">Ver Mapa</button></td>
                    </tr>`;
                }

                // 2. Agrupar Recorridos
                if (d.tipo === "INICIO_RECORRIDO" || d.tipo === "PUNTO" || d.tipo === "FIN_RECORRIDO") {
                    const id = d.id_recorrido;
                    if (!recorridosAgrupados[id]) {
                        recorridosAgrupados[id] = { oficial: d.oficial, sector: d.sector, inicio: "Desconocido", fin: "En proceso...", puntos: [] };
                    }
                    if (d.tipo === "INICIO_RECORRIDO") recorridosAgrupados[id].inicio = d.fecha_hora.split(',')[1];
                    if (d.tipo === "FIN_RECORRIDO") recorridosAgrupados[id].fin = d.fecha_hora.split(',')[1];

                    // Guardar puntos para dibujar la línea (ignorar si GPS falló)
                    if (d.latitud && d.longitud) {
                        recorridosAgrupados[id].puntos.push({ lat: d.latitud, lng: d.longitud, nov: d.novedad, foto: d.evidencia_foto, hora: d.fecha_hora.split(',')[1], tipo: d.tipo });
                    }
                }
            });

            // Dibujar tabla de Recorridos
            Object.keys(recorridosAgrupados).forEach(id => {
                const r = recorridosAgrupados[id];
                const btnMapa = `<button class="btn-ver-ruta" onclick="dibujarRuta('${id}')">🗺️ Trazar Ruta</button>`;

                let novedadesHtml = r.puntos.filter(p => p.tipo === "PUNTO").map(p => {
                    let text = `• [${p.hora}] ${p.nov}`;
                    if (p.foto && p.foto !== "NO") text += ` <br><img src="${p.foto}" class="img-mini" onclick="window.open(this.src)">`;
                    return text;
                }).join('<hr style="margin:5px 0; border-top:1px solid #ddd;">');

                if (!novedadesHtml) novedadesHtml = "<i>Sin novedades marcadas</i>";

                tablaRec.innerHTML += `<tr>
                    <td><b>${r.oficial}</b></td>
                    <td>${r.sector}</td>
                    <td>${r.inicio}</td>
                    <td>${r.fin}</td>
                    <td>${novedadesHtml}</td>
                    <td style="text-align:center;">${btnMapa}</td>
                </tr>`;
            });
        };

        // Ver un punto individual (Entrada/Salida)
        window.verPuntoEnMapa = (lat, lng, texto) => {
            capaMarcadores.clearLayers();
            if (rutaRoja) map.removeLayer(rutaRoja);
            L.marker([lat, lng]).addTo(capaMarcadores).bindPopup(`<b>${texto}</b>`).openPopup();
            map.setView([lat, lng], 17);
        };

        // Dibujar ruta completa con línea roja
        window.dibujarRuta = (idRecorrido) => {
            capaMarcadores.clearLayers();
            if (rutaRoja) map.removeLayer(rutaRoja);

            const puntos = recorridosAgrupados[idRecorrido].puntos;
            if (puntos.length === 0) return alert("El agente no registró coordenadas GPS en este recorrido.");

            const coordenadasLinea = [];

            puntos.forEach((p, index) => {
                coordenadasLinea.push([p.lat, p.lng]);

                // Poner un globito de información
                let icono = p.tipo === "INICIO_RECORRIDO" ? "🟢 INICIO" : (p.tipo === "FIN_RECORRIDO" ? "🛑 FIN" : "📍 PUNTO");
                let popupText = `<b>${icono}</b><br>Hora: ${p.hora}<br>${p.nov}`;
                if (p.foto && p.foto !== "NO") popupText += `<br><img src="${p.foto}" width="100">`;

                L.marker([p.lat, p.lng]).addTo(capaMarcadores).bindPopup(popupText);
            });

            // Dibujar línea roja evaluadora
            rutaRoja = L.polyline(coordenadasLinea, { color: 'red', weight: 4, opacity: 0.8 }).addTo(map);

            // Centrar mapa en la ruta
            map.fitBounds(rutaRoja.getBounds());
        };

        window.onload = cargarBaseDeDatos;
    </script>
</body>

</html>
