<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERVISOR RESIDENCIAL</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #filtros { background: #1a2a3a; color: white; padding: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        #map { height: 45vh; width: 100%; border-bottom: 3px solid #2ecc71; }
        #historial { flex: 1; overflow-y: auto; padding: 15px; background: #f4f7f6; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; font-size: 12px; }
        th { background: #2c3e50; color: white; }
        .img-mini { width: 50px; height: 50px; object-fit: cover; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="filtros">
        <h3 style="margin:0; color:#2ecc71;">🛡️ CENTRAL RESIDENCIAL</h3>
        <input type="date" id="fechaFiltro">
        <input type="text" id="nombreFiltro" placeholder="Nombre Oficial">
        <button onclick="consultar()" style="background:#2ecc71; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">🔍 BUSCAR</button>
    </div>
    <div id="map"></div>
    <div id="historial">
        <table>
            <thead><tr><th>Oficial</th><th>Horario (In/Fn)</th><th>Novedades</th><th>Fotos</th></tr></thead>
            <tbody id="tablaBody"></tbody>
        </table>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", authDomain: "sistema-vigilancia-6851e.firebaseapp.com", projectId: "sistema-vigilancia-6851e", storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", messagingSenderId: "714792023462", appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const map = L.map('map').setView([23.29, -106.47], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let markers = L.layerGroup().addTo(map);

        window.consultar = async () => {
            const f = document.getElementById('fechaFiltro').value;
            const n = document.getElementById('nombreFiltro').value.toLowerCase();
            const snapshot = await getDocs(query(collection(db, "recorridos"), orderBy("timestamp", "asc")));
            
            markers.clearLayers(); document.getElementById('tablaBody').innerHTML = "";
            let agrupados = {};

            snapshot.forEach(doc => {
                const d = doc.data();
                // RESCATADOR: Si no tiene sector, asumimos que es Residencial por ahora para que no desaparezca
                const sectorDato = d.sector || "Residencial";
                if(sectorDato !== "Residencial") return;

                const id = d.id_recorrido || ("OLD-" + d.oficial);
                let coincideF = true;
                if(f) {
                    const [y, m, dia] = f.split('-');
                    coincideF = d.fecha_hora.includes(`${parseInt(dia)}/${parseInt(m)}/${y}`);
                }

                if(coincideF && d.oficial.toLowerCase().includes(n)) {
                    if(!agrupados[id]) agrupados[id] = { puntos: [], inicio: d.fecha_hora, fin: "---", oficial: d.oficial };
                    if(d.tipo === "FIN") agrupados[id].fin = d.fecha_hora;
                    else {
                        agrupados[id].puntos.push(d);
                        L.marker([d.latitud, d.longitud]).addTo(markers).bindPopup(`<b>${d.oficial}</b><br>${d.fecha_hora}`);
                    }
                }
            });

            Object.values(agrupados).forEach(r => {
                if(r.puntos.length === 0) return;
                const row = `<tr>
                    <td><b>${r.oficial}</b></td>
                    <td>In: ${r.inicio}<br>Fn: ${r.fin}</td>
                    <td>${r.puntos.map(p => p.novedad).join(' | ')}</td>
                    <td>${r.puntos.filter(p => p.evidencia_foto !== "NO").map(p => `<img src="${p.evidencia_foto}" class="img-mini" onclick="window.open(this.src)">`).join(' ')}</td>
                </tr>`;
                document.getElementById('tablaBody').innerHTML += row;
            });
        };
    </script>
</body>
</html>
