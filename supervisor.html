<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Supervisión - Vigilancia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; flex-direction: column; }
        #header { background: #333; color: white; padding: 15px; text-align: center; }
        #main { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 300px; background: #f4f4f4; overflow-y: auto; border-right: 1px solid #ccc; padding: 10px; }
        #map { flex: 1; }
        .rondin-item { background: white; margin-bottom: 10px; padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid #ddd; }
        .rondin-item:hover { background: #e0e0e0; }
        .rondin-item h4 { margin: 0 0 5px 0; color: #007bff; }
        .rondin-item p { margin: 0; font-size: 13px; color: #555; }
    </style>
</head>
<body>

    <div id="header">
        <h2>Panel de Control de Rondines</h2>
    </div>

    <div id="main">
        <div id="sidebar">
            <h3>Historial</h3>
            <div id="lista-rondines">Cargando datos...</div>
        </div>
        <div id="map"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURACIÓN DE TU FIREBASE (Misma que la app)
        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let mapa = L.map('map').setView([24.8, -107.3], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
        
        let capaRecorrido = L.layerGroup().addTo(mapa);

        async function cargarHistorial() {
            const listaDiv = document.getElementById('lista-rondines');
            listaDiv.innerHTML = "";

            try {
                // Consultamos los rondines más recientes primero
                const q = query(collection(db, "rondines"), orderBy("inicio", "desc"));
                const querySnapshot = await getDocs(q);

                if(querySnapshot.empty) {
                    listaDiv.innerHTML = "No hay rondines registrados.";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const datos = doc.data();
                    const item = document.createElement('div');
                    item.className = 'rondin-item';
                    item.innerHTML = `
                        <h4>${datos.oficial || 'Sin Nombre'}</h4>
                        <p><b>Fecha:</b> ${datos.inicio}</p>
                        <p><b>Puntos:</b> ${datos.puntos_gps ? datos.puntos_gps.length : 0}</p>
                    `;
                    item.onclick = () => visualizarRondin(datos);
                    listaDiv.appendChild(item);
                });

            } catch (e) {
                console.error(e);
                listaDiv.innerHTML = "Error al cargar: " + e.message;
            }
        }

        function visualizarRondin(datos) {
            capaRecorrido.clearLayers(); // Limpiamos el mapa anterior

            if (!datos.puntos_gps || datos.puntos_gps.length === 0) {
                alert("Este rondín no tiene coordenadas.");
                return;
            }

            // 1. Dibujar la línea del recorrido
            const latlngs = datos.puntos_gps.map(p => [p.lat, p.lng]);
            const polyline = L.polyline(latlngs, {color: 'red', weight: 4}).addTo(capaRecorrido);
            
            // 2. Dibujar las novedades (marcadores)
            if (datos.reportes) {
                datos.reportes.forEach(rep => {
                    L.marker([rep.lat, rep.lng])
                     .addTo(capaRecorrido)
                     .bindPopup(`<b>Novedad:</b><br>${rep.msg}<br><small>${rep.hora}</small>`);
                });
            }

            // 3. Ajustar el mapa para que se vea todo el camino
            mapa.fitBounds(polyline.getBounds());
        }

        cargarHistorial();
    </script>
</body>
</html>
