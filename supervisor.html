<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CENTRAL DE MONITOREO - HUGO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; flex-direction: column; }
        #header { background: #1a2a3a; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #f1c40f; }
        .user-badge { background: #f1c40f; color: #1a2a3a; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        #main { display: flex; flex: 1; overflow: hidden; }
        
        /* BARRA LATERAL CON BUSCADOR */
        #sidebar { width: 360px; background: #f4f7f6; display: flex; flex-direction: column; border-right: 1px solid #ccc; }
        #search-box { padding: 15px; background: #fff; border-bottom: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #search-box input { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        #lista-recorridos { flex: 1; overflow-y: auto; padding: 15px; }
        #map { flex: 1; }
        
        .rondin-card { background: white; margin-bottom: 12px; padding: 15px; border-radius: 10px; cursor: pointer; border-left: 6px solid #007bff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .rondin-card:hover { background: #eef2f7; transform: scale(1.01); transition: 0.2s; }
        .nombre-oficial { font-weight: bold; color: #1a2a3a; display: block; }
        .info-txt { font-size: 12px; color: #555; display: block; }
    </style>
</head>
<body>

    <div id="header">
        <h2>🛰️ CENTRAL DE MONITOREO</h2>
        <div class="user-badge">ADMINISTRADOR: HUGO</div>
    </div>

    <div id="main">
        <div id="sidebar">
            <div id="search-box">
                <h3 style="margin:0 0 10px 0; font-size: 16px;">🔍 Filtros de Búsqueda</h3>
                <input type="text" id="filtroNombre" placeholder="Buscar por nombre..." oninput="filtrar()">
                <input type="date" id="filtroFecha" onchange="filtrar()">
                <button onclick="limpiarFiltros()" style="width:100%; padding:5px; cursor:pointer; font-size:11px;">Limpiar Filtros</button>
            </div>
            <div id="lista-recorridos">Cargando datos...</div>
        </div>
        <div id="map"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let mapa = L.map('map').setView([24.8, -107.3], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
        let capaRecorrido = L.layerGroup().addTo(mapa);
        
        let datosOriginales = [];

        async function cargarDatos() {
            const q = query(collection(db, "rondines"), orderBy("inicio", "desc"));
            const snapshot = await getDocs(q);
            datosOriginales = [];
            snapshot.forEach(doc => datosOriginales.push(doc.data()));
            renderizarLista(datosOriginales);
        }

        function renderizarLista(datos) {
            const listaDiv = document.getElementById('lista-recorridos');
            listaDiv.innerHTML = "";
            datos.forEach(d => {
                const card = document.createElement('div');
                card.className = 'rondin-card';
                card.innerHTML = `
                    <span class="nombre-oficial">👤 ${d.oficial}</span>
                    <span class="info-txt">📅 <b>Fecha:</b> ${d.inicio.split(',')[0]}</span>
                    <span class="info-txt">🕒 <b>Entrada:</b> ${d.inicio.split(',')[1] || ''}</span>
                    <span class="info-txt">🏁 <b>Salida:</b> ${d.fin ? d.fin.split(',')[1] : '...'}</span>
                `;
                card.onclick = () => dibujarRondin(d);
                listaDiv.appendChild(card);
            });
        }

        // --- LÓGICA DEL BUSCADOR ---
        window.filtrar = function() {
            const nombre = document.getElementById('filtroNombre').value.toLowerCase();
            const fechaInput = document.getElementById('filtroFecha').value; // Formato YYYY-MM-DD
            
            let fechaFormateada = "";
            if(fechaInput) {
                const partes = fechaInput.split('-');
                fechaFormateada = `${partes[2]}/${partes[1]}/${partes[0]}`; // Convierte a DD/MM/YYYY
            }

            const filtrados = datosOriginales.filter(d => {
                const coincideNombre = d.oficial.toLowerCase().includes(nombre);
                const coincideFecha = fechaFormateada === "" || d.inicio.includes(fechaFormateada);
                return coincideNombre && coincideFecha;
            });
            
            renderizarLista(filtrados);
        };

        window.limpiarFiltros = () => {
            document.getElementById('filtroNombre').value = "";
            document.getElementById('filtroFecha').value = "";
            renderizarLista(datosOriginales);
        };

        function dibujarRondin(d) {
            capaRecorrido.clearLayers();
            if (!d.puntos_gps || d.puntos_gps.length === 0) return;
            const pts = d.puntos_gps.map(p => [p.lat, p.lng]);
            const linea = L.polyline(pts, {color: 'red', weight: 5}).addTo(capaRecorrido);
            L.marker(pts[0]).addTo(capaRecorrido).bindPopup("INICIO");
            L.marker(pts[pts.length-1]).addTo(capaRecorrido).bindPopup("FIN");
            if (d.reportes) {
                d.reportes.forEach(nov => {
                    L.marker([nov.lat, nov.lng]).addTo(capaRecorrido)
                     .bindPopup(`<b>NOVEDAD:</b><br>${nov.msg}<br><small>${nov.hora}</small>`);
                });
            }
            mapa.fitBounds(linea.getBounds(), {padding: [40, 40]});
        }

        cargarDatos();
    </script>
</body>
</html>
