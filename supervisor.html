<!DOCTYPE html>
<html lang="es">
<head>
    <script>if(prompt("🔒 Supervisor General:") !== "AdminGen2026") window.location.href = "menu.html";</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERVISOR RESIDENCIAL</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #filtros { background: #1a2a3a; color: white; padding: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        #map { height: 50vh; width: 100%; border-bottom: 4px solid #2ecc71; }
        #historial { flex: 1; overflow-y: auto; padding: 15px; background: #f4f7f6; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; font-size: 13px; }
        th { background: #2c3e50; color: white; }
        .img-mini { width: 60px; height: 60px; object-fit: cover; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div id="filtros">
        <h3 style="margin:0; color:#2ecc71; margin-right: 15px;">🛡️ CENTRAL RESIDENCIAL</h3>
        <input type="date" id="fechaFiltro">
        <input type="text" id="nombreFiltro" placeholder="Nombre Oficial">
        <button onclick="consultar()" style="background:#2ecc71; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold;">🔍 BUSCAR</button>
    </div>
    <div id="map"></div>
    <div id="historial">
        <h3 style="margin-top:0;">📋 Historial de Recorridos (Solo Residencial)</h3>
        <table>
            <thead><tr><th>Oficial</th><th>Horarios</th><th>Novedades Reportadas</th><th>Evidencias</th></tr></thead>
            <tbody id="tablaBody"></tbody>
        </table>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", authDomain: "sistema-vigilancia-6851e.firebaseapp.com", projectId: "sistema-vigilancia-6851e", storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", messagingSenderId: "714792023462", appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // 🚨 CANDADO DE SEGURIDAD PARA ESTE PANEL 🚨
        const SECTOR_AUTORIZADO = "Residencial"; 
        
        const map = L.map('map').setView([24.809, -107.394], 14); // Coordenadas Culiacán
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let markers = L.layerGroup().addTo(map);

        window.consultar = async () => {
            const f = document.getElementById('fechaFiltro').value;
            const n = document.getElementById('nombreFiltro').value.toLowerCase();
            const snapshot = await getDocs(query(collection(db, "recorridos"), orderBy("timestamp", "asc")));
            
            markers.clearLayers(); document.getElementById('tablaBody').innerHTML = "";
            let recorridosAgrupados = {};

            snapshot.forEach(doc => {
                const data = doc.data();
                
                // Si el registro no es de este sector, lo ignora completamente
                if(data.sector !== SECTOR_AUTORIZADO) return; 

                const idClave = data.id_recorrido || ("OLD-" + data.oficial + "-" + data.fecha_hora.split(',')[0]);
                let coincideFecha = true;
                if(f) {
                    const [y, m, d] = f.split('-');
                    const fBusca = `${parseInt(d)}/${parseInt(m)}/${y}`;
                    coincideFecha = data.fecha_hora.includes(fBusca);
                }

                if(coincideFecha && data.oficial.toLowerCase().includes(n)) {
                    if(!recorridosAgrupados[idClave]) {
                        recorridosAgrupados[idClave] = { puntos: [], inicio: data.fecha_hora, fin: "En curso / Sin cierre", oficial: data.oficial };
                    }
                    if(data.tipo === "FIN") { recorridosAgrupados[idClave].fin = data.fecha_hora; } 
                    else {
                        recorridosAgrupados[idClave].puntos.push(data);
                        L.marker([data.latitud, data.longitud]).addTo(markers).bindPopup(`<b>${data.oficial}</b><br>${data.fecha_hora}<br>${data.novedad}`);
                    }
                }
            });

            Object.keys(recorridosAgrupados).forEach(id => {
                const r = recorridosAgrupados[id];
                if(r.puntos.length === 0) return;
                const row = `<tr>
                    <td><b>${r.oficial}</b></td>
                    <td><small>🟢 ${r.inicio}<br>🔴 ${r.fin}</small></td>
                    <td>${r.puntos.map(pt => pt.novedad).join('<br><hr style="margin:2px 0; border-top:1px dashed #ccc;">')}</td>
                    <td>${r.puntos.filter(pt => pt.evidencia_foto && pt.evidencia_foto !== "NO").map(pt => `<img src="${pt.evidencia_foto}" class="img-mini" onclick="window.open(this.src)">`).join(' ')}</td>
                </tr>`;
                document.getElementById('tablaBody').innerHTML += row;
            });
        };
        // Cargar mapa vacío al inicio
    };
    </script>
</body>
</html>
