<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CENTRAL DE MONITOREO - VIGILANCIA</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; flex-direction: column; background: #f0f2f5; }
        #header { background: #1a2a3a; color: white; padding: 12px; text-align: center; }
        #main { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 350px; background: white; overflow-y: auto; border-right: 1px solid #ccc; padding: 15px; }
        #map { flex: 1; }
        .rondin-item { background: #fff; margin-bottom: 10px; padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid #ddd; border-left: 5px solid #2980b9; }
        .rondin-item:hover { background: #f0f7ff; }
        .info-row { font-size: 13px; margin-bottom: 4px; }
        .novedad-txt { color: #d35400; font-weight: bold; }
    </style>
</head>
<body>

    <div id="header"><h2>🛰️ PANEL DE SUPERVISIÓN FINAL</h2></div>

    <div id="main">
        <div id="sidebar">
            <h3 style="margin-top:0;">Historial de Recorridos</h3>
            <div id="lista-rondines">Cargando bitácora...</div>
        </div>
        <div id="map"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let mapa = L.map('map').setView([24.8, -107.3], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
        let capaDibujo = L.layerGroup().addTo(mapa);

        async function cargarHistorial() {
            const listaDiv = document.getElementById('lista-rondines');
            try {
                const q = query(collection(db, "rondines"), orderBy("inicio", "desc"));
                const snap = await getDocs(q);
                listaDiv.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    const item = document.createElement('div');
                    item.className = 'rondin-item';
                    item.innerHTML = `
                        <h4>👤 ${d.oficial || 'Hugo'}</h4>
                        <div class="info-row"><b>📅 Fecha:</b> ${d.inicio ? d.inicio.split(',')[0] : '---'}</div>
                        <div class="info-row"><b>🕒 Horario:</b> ${d.inicio ? d.inicio.split(',')[1] : ''} - ${d.fin ? d.fin.split(',')[1] : '...'}</div>
                        <div class="info-row novedad-txt"><b>⚠️ Novedades:</b> ${d.reportes ? d.reportes.length : 0}</div>
                    `;
                    item.onclick = () => mostrarEnMapa(d);
                    listaDiv.appendChild(item);
                });
            } catch (e) { console.error(e); }
        }

        function mostrarEnMapa(datos) {
            capaDibujo.clearLayers();
            if (!datos.puntos_gps || datos.puntos_gps.length === 0) return;

            const puntos = datos.puntos_gps.map(p => [p.lat, p.lng]);
            const linea = L.polyline(puntos, {color: 'red', weight: 4}).addTo(capaDibujo);
            
            // Inicio y Fin
            L.marker(puntos[0]).addTo(capaDibujo).bindPopup("INICIO");
            L.marker(puntos[puntos.length - 1]).addTo(capaDibujo).bindPopup("FIN");

            // NOVEDADES - FORZAR MARCADOR VISIBLE
            if (datos.reportes && datos.reportes.length > 0) {
                datos.reportes.forEach(r => {
                    // Creamos un marcador con un color distinto (Naranja)
                    const marcadorNovedad = L.circleMarker([r.lat, r.lng], {
                        radius: 12,
                        fillColor: "#ff5722",
                        color: "#000",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(capaDibujo);

                    // Forzamos que el mensaje esté SIEMPRE disponible al hacer clic
                    marcadorNovedad.bindPopup(`
                        <div style="font-size:14px; width:180px;">
                            <b style="color:red;">⚠️ REPORTE DE NOVEDAD</b><br><br>
                            <b>Mensaje:</b> ${r.msg}<br>
                            <b>Hora:</b> ${r.hora}
                        </div>
                    `);
                });
            }

            mapa.fitBounds(linea.getBounds());
        }

        cargarHistorial();
    </script>
</body>
</html>
