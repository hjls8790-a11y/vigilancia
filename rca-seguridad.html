<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis Causa Raíz (RCA) - Seguridad</title>
    <style>
        :root {
            --primary: #0A2540;
            --secondary: #D4AF37;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --text: #334155;
            --border: #E2E8F0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 6px solid var(--primary);
        }

        h1, h2 {
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-top: 30px;
        }

        h1 { margin-top: 0; text-align: center; }

        .form-group { margin-bottom: 20px; }
        .form-row { display: flex; gap: 20px; }
        .form-row .form-group { flex: 1; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary);
        }

        input[type="text"], input[type="date"], input[type="time"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #F8FAFC;
            resize: vertical;
        }

        textarea { min-height: 80px; }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
        }

        .btn-ai { background-color: var(--primary); }
        .btn-ai:hover { background-color: #06182a; }
        
        .btn-pdf { background-color: #16A34A; }
        .btn-pdf:hover { background-color: #15803d; }

        .print-header { display: none; }

        /* Estilos para cuando se genera el PDF */
        @media print {
            body { background-color: white; padding: 0; }
            .container { 
                box-shadow: none; 
                border-top: none; 
                padding: 0; 
                max-width: 100%; 
            }
            .btn-container, .no-print { display: none; }
            input, textarea { 
                border: none; 
                background-color: transparent; 
                padding: 0;
                resize: none;
            }
            .print-header { 
                display: block; 
                text-align: center; 
                margin-bottom: 30px;
            }
            .print-header h2 { border: none; margin: 0; padding: 0; }
            .print-header p { margin: 5px 0; font-weight: bold; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="print-header">
        <h2>Reporte de Incidente y Análisis Causa Raíz (RCA)</h2>
        <p>Departamento de Seguridad</p>
    </div>

    <h1>Análisis Causa Raíz (RCA) - Seguridad</h1>
    
    <form id="rca-form">
        <h2>Información General</h2>
        <div class="form-row">
            <div class="form-group">
                <label>Instalación / Complejo:</label>
                <input type="text" id="complejo" value="El Cielo Parque Residencial" required>
            </div>
            <div class="form-group">
                <label>Reporta a:</label>
                <input type="text" id="jefe" value="Guillermo Jiménez" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Fecha:</label><input type="date" id="fecha" required></div>
            <div class="form-group"><label>Hora:</label><input type="time" id="hora" required></div>
        </div>
        <div class="form-group">
            <label>Lugar exacto del incidente:</label>
            <input type="text" id="lugar" required>
        </div>
        <div class="form-group">
            <label>Descripción detallada del incidente:</label>
            <textarea id="descripcion" required></textarea>
        </div>

        <h2>Análisis (Los 5 Porqués / Causa Raíz)</h2>
        <div class="form-group"><label>1. ¿Qué sucedió exactamente?</label><textarea id="q1" required></textarea></div>
        <div class="form-group"><label>2. ¿Por qué sucedió? (Falla inicial)</label><textarea id="q2" required></textarea></div>
        <div class="form-group"><label>3. ¿Por qué no se detectó o previno? (Causas inmediatas)</label><textarea id="q3" required></textarea></div>
        <div class="form-group"><label>4. ¿Cuál es la falla en el proceso/sistema? (Causa subyacente o raíz)</label><textarea id="q4" required></textarea></div>
        <div class="form-group"><label>5. ¿Qué medidas de contención se tomaron inmediatamente?</label><textarea id="q5" required></textarea></div>

        <div class="btn-container">
            <button type="button" class="btn-ai" onclick="generarPrompt()">
                <span>🤖 Copiar Prompt para IA</span>
            </button>
            <button type="button" class="btn-pdf" onclick="window.print()">
                <span>📄 Guardar como PDF</span>
            </button>
        </div>
    </form>
</div>

<script>
    function generarPrompt() {
        const complejo = document.getElementById('complejo').value;
        const lugar = document.getElementById('lugar').value;
        const descripcion = document.getElementById('descripcion').value;
        const causaRaiz = document.getElementById('q4').value;
        const contencion = document.getElementById('q5').value;

        // Validar que los campos principales no estén vacíos
        if(!lugar || !descripcion || !causaRaiz) {
            alert("Por favor, llena al menos el lugar, descripción y la causa subyacente para generar un buen análisis.");
            return;
        }

        const promptText = `Actúa como un experto en seguridad física y gestión de riesgos. Acabo de realizar un Análisis Causa Raíz (RCA) de un incidente ocurrido en nuestras instalaciones (${complejo}).

Aquí tienes los detalles:
- Lugar exacto: ${lugar}
- Descripción del incidente: ${descripcion}
- Causa Raíz / Subyacente identificada: ${causaRaiz}
- Medidas de contención inmediatas tomadas: ${contencion}

Por favor, ayúdame generando lo siguiente para presentarlo a mi jefatura:
1. Una evaluación profesional breve de la causa raíz.
2. Un plan de acción correctivo y preventivo estructurado a corto (7 días), mediano (15 días) y largo plazo (30 días).
3. 3 puntos clave de mejora continua para nuestros protocolos de seguridad.

Mantén un tono ejecutivo, formal y directo, enfocado en la prevención operativa.`;

        // Copiar al portapapeles
        navigator.clipboard.writeText(promptText).then(() => {
            alert("¡Prompt copiado con éxito! Ahora puedes pegarlo en el chat de tu IA para obtener las soluciones y el plan de acción.");
        }).catch(err => {
            console.error('Error al copiar: ', err);
            alert("Hubo un error al copiar. Por favor, revisa los permisos del navegador.");
        });
    }
</script>

</body>
</html>
