<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis Causa Raíz (RCA) - Seguridad</title>
    <style>
        :root {
            --primary: #0A2540;
            --secondary: #D4AF37;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --text: #334155;
            --border: #E2E8F0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 6px solid var(--primary);
        }

        h1, h2 {
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-top: 30px;
        }

        h1 { margin-top: 0; text-align: center; }

        .form-group { margin-bottom: 20px; }
        .form-row { display: flex; gap: 20px; }
        .form-row .form-group { flex: 1; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary);
        }

        input[type="text"], input[type="date"], input[type="time"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #F8FAFC;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:disabled { background-color: #94a3b8; }

        #ai-results-container {
            display: none;
            margin-top: 40 (px);
            padding: 25px;
            background-color: #F0FDF4;
            border-left: 5px solid #16A34A;
            border-radius: 8px;
        }

        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--secondary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .ai-content { white-space: pre-wrap; font-size: 1.05rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Análisis Causa Raíz (RCA) de Incidentes</h1>
    
    <form id="rca-form">
        <h2>Información General</h2>
        <div class="form-row">
            <div class="form-group"><label>Fecha:</label><input type="date" id="fecha" required></div>
            <div class="form-group"><label>Hora:</label><input type="time" id="hora" required></div>
        </div>
        <div class="form-group">
            <label>Lugar:</label>
            <input type="text" id="lugar" required>
        </div>
        <div class="form-group">
            <label>Descripción del incidente:</label>
            <textarea id="descripcion" required></textarea>
        </div>

        <h2>Análisis Causa Raíz</h2>
        <div class="form-group"><label>1. ¿Qué sucedió?</label><textarea id="q1" required></textarea></div>
        <div class="form-group"><label>2. ¿Por qué sucedió?</label><textarea id="q2" required></textarea></div>
        <div class="form-group"><label>3. Causas inmediatas:</label><textarea id="q3" required></textarea></div>
        <div class="form-group"><label>4. Causas subyacentes:</label><textarea id="q4" required></textarea></div>
        <div class="form-group"><label>5. ¿Cómo prevenirlo?</label><textarea id="q5" required></textarea></div>

        <button type="submit" id="btn-submit">
            <span>Generar Seguimiento con IA</span>
            <div class="loader" id="loader"></div>
        </button>
    </form>

    <div id="ai-results-container">
        <h2>🤖 Plan Sugerido por Gemini IA</h2>
        <div class="ai-content" id="ai-output"></div>
    </div>
</div>

<script>
    // CLAVE API INTEGRADA
    const GEMINI_API_KEY = 'AIzaSyAH9TvJnH8KuA4h7Ar5Lck1RTXki_nISQ4'; 

    document.getElementById('rca-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btnSubmit = document.getElementById('btn-submit');
        const loader = document.getElementById('loader');
        const resultsContainer = document.getElementById('ai-results-container');
        const aiOutput = document.getElementById('ai-output');

        const prompt = `
        Actúa como un experto en seguridad física. Analiza este incidente:
        Lugar: ${document.getElementById('lugar').value}
        Descripción: ${document.getElementById('descripcion').value}
        Causas: ${document.getElementById('q4').value}
        
        Genera un plan de seguimiento a 7, 15 y 30 días, y 3 puntos de mejora continua. 
        Responde en español, profesional y con puntos clave.
        `;

        btnSubmit.disabled = true;
        loader.style.display = 'block';
        resultsContainer.style.display = 'none';

        try {
            // USANDO VERSIÓN ESTABLE V1
            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const resultData = await response.json();

            if (!response.ok) {
                throw new Error(resultData.error?.message || 'Error en la conexión');
            }

            let text = resultData.candidates.content.parts.text;
            
            // Limpieza básica de formato Markdown a HTML
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<li>$1</li>');

            aiOutput.innerHTML = text;
            resultsContainer.style.display = 'block';

        } catch (error) {
            aiOutput.innerHTML = `<p style="color:red">Error: ${error.message}</p>`;
            resultsContainer.style.display = 'block';
        } finally {
            btnSubmit.disabled = false;
            loader.style.display = 'none';
        }
    });
</script>

</body>
</html>
