<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis Causa Raíz (RCA) - Seguridad</title>
    <style>
        :root {
            --primary: #0A2540;
            --secondary: #D4AF37;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --text: #334155;
            --border: #E2E8F0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 6px solid var(--primary);
        }

        h1, h2 {
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-top: 30px;
        }

        h1 { margin-top: 0; text-align: center; }

        .form-group { margin-bottom: 20px; }
        .form-row { display: flex; gap: 20px; }
        .form-row .form-group { flex: 1; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary);
        }

        input[type="text"], input[type="date"], input[type="time"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #F8FAFC;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary);
            background-color: #FFF;
        }

        textarea { resize: vertical; min-height: 80px; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover { background-color: #1a3a5c; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }

        #ai-results-container {
            display: none;
            margin-top: 40px;
            padding: 25px;
            background-color: #F0FDF4;
            border-left: 5px solid #16A34A;
            border-radius: 8px;
        }

        #ai-results-container h2 {
            color: #166534;
            border-color: #BBF7D0;
            margin-top: 0;
        }

        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--secondary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ai-content { white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>Análisis Causa Raíz (RCA) de Incidentes</h1>
    
    <form id="rca-form">
        <h2>Información General</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="fecha">Fecha del incidente:</label>
                <input type="date" id="fecha" required>
            </div>
            <div class="form-group">
                <label for="hora">Hora del incidente:</label>
                <input type="time" id="hora" required>
            </div>
        </div>
        <div class="form-group">
            <label for="lugar">Lugar del incidente:</label>
            <input type="text" id="lugar" required>
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción del incidente:</label>
            <textarea id="descripcion" required></textarea>
        </div>

        <h2>Análisis Causa Raíz</h2>
        <div class="form-group">
            <label for="q1">1. ¿Qué sucedió?</label>
            <textarea id="q1" required></textarea>
        </div>
        <div class="form-group">
            <label for="q2">2. ¿Por qué sucedió?</label>
            <textarea id="q2" required></textarea>
        </div>
        <div class="form-group">
            <label for="q3">3. ¿Cuáles fueron las causas inmediatas?</label>
            <textarea id="q3" required></textarea>
        </div>
        <div class="form-group">
            <label for="q4">4. ¿Cuáles fueron las causas subyacentes?</label>
            <textarea id="q4" required></textarea>
        </div>
        <div class="form-group">
            <label for="q5">5. ¿Qué se puede hacer para prevenir que vuelva a suceder?</label>
            <textarea id="q5" required></textarea>
        </div>

        <h2>Acciones Correctivas Propuestas</h2>
        <div class="form-group">
            <label for="accion">1. Acción a tomar:</label>
            <textarea id="accion" required></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="responsable">2. Responsable:</label>
                <input type="text" id="responsable" required>
            </div>
            <div class="form-group">
                <label for="fecha_implementacion">3. Fecha límite de implementación:</label>
                <input type="date" id="fecha_implementacion" required>
            </div>
        </div>

        <button type="submit" id="btn-submit">
            <span>Generar Seguimiento y Soluciones con IA</span>
            <div class="loader" id="loader"></div>
        </button>
    </form>

    <div id="ai-results-container">
        <h2>🤖 Seguimiento y Soluciones Estructuradas (Gemini AI)</h2>
        <div class="ai-content" id="ai-output"></div>
    </div>
</div>

<script>
    // Tu API Key de Gemini
    const GEMINI_API_KEY = 'AIzaSyAH9TvJnH8KuA4h7Ar5Lck1RTXki_nISQ4'; 

    document.getElementById('rca-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btnSubmit = document.getElementById('btn-submit');
        const loader = document.getElementById('loader');
        const resultsContainer = document.getElementById('ai-results-container');
        const aiOutput = document.getElementById('ai-output');

        const data = {
            fecha: document.getElementById('fecha').value,
            hora: document.getElementById('hora').value,
            lugar: document.getElementById('lugar').value,
            descripcion: document.getElementById('descripcion').value,
            q1: document.getElementById('q1').value,
            q2: document.getElementById('q2').value,
            q3: document.getElementById('q3').value,
            q4: document.getElementById('q4').value,
            q5: document.getElementById('q5').value,
            accion: document.getElementById('accion').value,
            responsable: document.getElementById('responsable').value,
            fecha_implementacion: document.getElementById('fecha_implementacion').value
        };

        const prompt = `
        Actúa como un experto consultor en seguridad física y gestión de riesgos. 
        Acabo de documentar un Análisis Causa Raíz (RCA) sobre un incidente de seguridad. 
        
        Aquí están los datos del reporte:
        - Fecha y Hora: ${data.fecha} a las ${data.hora}
        - Lugar: ${data.lugar}
        - Descripción: ${data.descripcion}
        
        Análisis Causa Raíz:
        1. ¿Qué sucedió?: ${data.q1}
        2. ¿Por qué sucedió?: ${data.q2}
        3. Causas inmediatas: ${data.q3}
        4. Causas subyacentes: ${data.q4}
        5. Prevención sugerida: ${data.q5}
        
        Acciones Correctivas Iniciales:
        - Acción: ${data.accion} (Responsable: ${data.responsable}, Fecha: ${data.fecha_implementacion})
        
        Tu tarea es generar la sección de "Seguimiento" estructurada. Necesito que:
        1. Evalúes brevemente si las acciones correctivas propuestas son suficientes o si sugieres protocolos adicionales.
        2. Estructures un plan de seguimiento a 7, 15 y 30 días para verificar la eficacia de la acción.
        3. Generes un listado de "Puntos de Mejora Continua" para evitar la reincidencia, redactados de forma clara y directiva para los agentes de seguridad y administración.
        
        Responde en español, usando un tono profesional, firme e institucional. Usa formato de listas y negritas para resaltar puntos clave.
        `;

        btnSubmit.disabled = true;
        loader.style.display = 'block';
        resultsContainer.style.display = 'none';
        aiOutput.innerHTML = '';

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: prompt }]
                    }]
                })
            });

            const resultData = await response.json();

            // Aquí atrapamos el error REAL de Google
            if (!response.ok) {
                const mensajeError = resultData.error?.message || 'Error desconocido';
                throw new Error(`Google rechazó la conexión. Razón: ${mensajeError}`);
            }

            let aiText = resultData.candidates.content.parts.text;

            aiText = aiText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'); 
            aiText = aiText.replace(/\*(.*?)\*/g, '<em>$1</em>'); 
            aiText = aiText.replace(/## (.*?)\n/g, '<h3>$1</h3>'); 
            aiText = aiText.replace(/# (.*?)\n/g, '<h3>$1</h3>'); 

            aiOutput.innerHTML = aiText;
            resultsContainer.style.display = 'block';

        } catch (error) {
            aiOutput.innerHTML = `<span style="color: red;"><strong>¡Ups! Falló la API:</strong><br><br>${error.message}</span>`;
            resultsContainer.style.display = 'block';
        } finally {
            btnSubmit.disabled = false;
            loader.style.display = 'none';
        }
    });
</script>

</body>
</html>
