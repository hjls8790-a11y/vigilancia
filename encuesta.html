<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Encuesta y Auditoría - Seguridad</title>
    <style>
        /* Estilos generales y reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        /* Contenedores principales */
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 650px;
            width: 100%;
            margin-bottom: 20px;
        }

        .header-msg {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .header-msg h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .header-msg p {
            color: #555;
            font-style: italic;
            line-height: 1.5;
        }

        /* Formulario de encuesta */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 14px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Botones */
        .btn-submit {
            background-color: #27ae60;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #219150;
        }

        .btn-auditoria {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-auditoria:hover {
            background-color: #1a252f;
        }
        
        .btn-salir {
            background-color: #e74c3c;
            margin-top: 20px;
        }
        
        .btn-salir:hover {
            background-color: #c0392b;
        }

        /* Panel de auditoría (Oculto por defecto) */
        #panelAuditoria {
            display: none;
            border-top: 4px solid #2c3e50;
        }

        .auditoria-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .registro-guardado {
            background: #f9f9f9;
            padding: 15px;
            border-left: 4px solid #3498db;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 14px;
        }

        .registro-guardado span {
            color: #2c3e50;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- PANEL PRINCIPAL: ENCUESTA PARA RESIDENTES -->
    <div class="container" id="panelPrincipal">
        
        <div class="header-msg">
            <h2>Encuesta de Servicio y Seguridad</h2>
            <p>"Agradecemos su tiempo y participación. Nuestro mayor compromiso es la mejora continua para garantizar la tranquilidad y excelencia en nuestras instalaciones."</p>
        </div>

        <form id="formEncuesta">
            <div class="form-group">
                <label for="nombre">Nombre del Residente</label>
                <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
            </div>
            
            <div class="form-group">
                <label for="ubicacion">Lote / Residencia</label>
                <input type="text" id="ubicacion" placeholder="Número de lote o domicilio" required>
            </div>

            <!-- Nuevas preguntas operativas -->
            <div class="form-group">
                <label for="evalTiempos">1. Tiempos de Respuesta (Atención en caseta y reportes)</label>
                <select id="evalTiempos" required>
                    <option value="" disabled selected>Evalúe los tiempos...</option>
                    <option value="Excelente">Excelente (Rápido y eficiente)</option>
                    <option value="Bueno">Bueno (Aceptable)</option>
                    <option value="Regular">Regular (Demorado)</option>
                    <option value="Deficiente">Deficiente (Muy lento)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="evalProcesos">2. Procesos de Seguridad (Registro de visitas, control de acceso)</label>
                <select id="evalProcesos" required>
                    <option value="" disabled selected>Evalúe los procesos...</option>
                    <option value="Excelente">Excelente (Claros y seguros)</option>
                    <option value="Bueno">Bueno (Adecuados)</option>
                    <option value="Regular">Regular (Confusos o engorrosos)</option>
                    <option value="Deficiente">Deficiente (Vulnerables o ineficientes)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="evalServicio">3. Calidad del Servicio (Actitud y trato del personal de guardias)</label>
                <select id="evalServicio" required>
                    <option value="" disabled selected>Evalúe el servicio...</option>
                    <option value="Excelente">Excelente (Amables y profesionales)</option>
                    <option value="Bueno">Bueno (Trato respetuoso)</option>
                    <option value="Regular">Regular (Falta de empatía)</option>
                    <option value="Deficiente">Deficiente (Mala actitud)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comentarios">Comentarios y áreas de mejora</label>
                <textarea id="comentarios" placeholder="Por favor, detalle qué podemos mejorar en tiempos, procesos o actitud del personal..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Evaluación</button>
        </form>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

        <button id="btnAuditarRespuestas" class="btn-auditoria">🔒 Acceso Jefatura (Auditar Respuestas)</button>
    </div>

    <!-- PANEL DE AUDITORÍA: SOLO VISIBLE CON CONTRASEÑA -->
    <div class="container" id="panelAuditoria">
        <div class="auditoria-header">
            <h2>Módulo de Auditoría de Jefatura</h2>
            <span style="background: #27ae60; color: white; padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;">ACTIVO</span>
        </div>
        
        <p style="margin-bottom: 20px; color: #555;">Historial de evaluaciones de los residentes.</p>
        
        <!-- Aquí se cargarán las encuestas guardadas -->
        <div id="contenedorRespuestas">
            <!-- Los registros aparecerán aquí mediante JavaScript -->
        </div>

        <button id="btnSalirAuditoria" class="btn-auditoria btn-salir">Cerrar Sesión de Auditoría</button>
    </div>

    <script>
        // 1. Lógica para guardar la encuesta
        document.getElementById('formEncuesta').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            // Recopilar los datos del formulario
            const nuevaEncuesta = {
                fecha: new Date().toLocaleString(),
                nombre: document.getElementById('nombre').value,
                ubicacion: document.getElementById('ubicacion').value,
                tiempos: document.getElementById('evalTiempos').value,
                procesos: document.getElementById('evalProcesos').value,
                servicio: document.getElementById('evalServicio').value,
                comentarios: document.getElementById('comentarios').value || 'Sin comentarios adicionales.'
            };

            // Guardar localmente en el navegador (Para pruebas inmediatas antes de Firebase)
            let historialEncuestas = JSON.parse(localStorage.getItem('encuestasResidentes')) || [];
            historialEncuestas.push(nuevaEncuesta);
            localStorage.setItem('encuestasResidentes', JSON.stringify(historialEncuestas));
            
            // Más adelante, aquí pones tu código de Firebase:
            // guardarEnFirebase(nuevaEncuesta);
            
            alert("Gracias. Sus respuestas han sido registradas para nuestra mejora continua.");
            this.reset(); 
        });

        // 2. Lógica para acceder a la auditoría y MOSTRAR los datos guardados
        document.getElementById('btnAuditarRespuestas').addEventListener('click', function() {
            let password = prompt("Control de acceso Jefatura: Ingresa la contraseña operativa:");

            if (password === "030819") {
                document.getElementById('panelPrincipal').style.display = 'none';
                document.getElementById('panelAuditoria').style.display = 'block';
                
                // Cargar las respuestas guardadas
                cargarAuditoria();
                
            } else if (password !== null) {
                alert("Contraseña incorrecta. Acceso denegado.");
            }
        });

        // 3. Función que inyecta las respuestas guardadas en el panel
        function cargarAuditoria() {
            const contenedor = document.getElementById('contenedorRespuestas');
            let historialEncuestas = JSON.parse(localStorage.getItem('encuestasResidentes')) || [];

            contenedor.innerHTML = ''; // Limpiar panel antes de cargar

            if (historialEncuestas.length === 0) {
                contenedor.innerHTML = '<p style="text-align:center; color:#7f8c8d;">No hay encuestas registradas todavía.</p>';
                return;
            }

            // Invertir el array para mostrar los más recientes arriba
            historialEncuestas.reverse().forEach(function(encuesta) {
                contenedor.innerHTML += `
                    <div class="registro-guardado">
                        <div style="font-size:12px; color:#7f8c8d; margin-bottom:5px;">Fecha de registro: ${encuesta.fecha}</div>
                        <span>Residente:</span> ${encuesta.nombre} (Lote: ${encuesta.ubicacion})<br><br>
                        <span>Tiempos de Respuesta:</span> ${encuesta.tiempos}<br>
                        <span>Procesos de Seguridad:</span> ${encuesta.procesos}<br>
                        <span>Calidad del Servicio:</span> ${encuesta.servicio}<br><br>
                        <em style="color:#555;">" ${encuesta.comentarios} "</em>
                    </div>
                `;
            });
        }

        // 4. Lógica para salir de la auditoría
        document.getElementById('btnSalirAuditoria').addEventListener('click', function() {
            document.getElementById('panelAuditoria').style.display = 'none';
            document.getElementById('panelPrincipal').style.display = 'block';
        });
    </script>

</body>
</html>
