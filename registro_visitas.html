<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caseta: Control de Accesos - El Cielo</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root { --bg: #F4F7F6; --p: #2C3E50; --s: #3498DB; --g: #27AE60; --r: #E74C3C; --w: #fff; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--p); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        
        /* Buscador */
        .search-box { background: var(--w); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        input[type="text"] { width: 80%; padding: 12px; border: 2px solid #ddd; border-radius: 25px; font-size: 1.1em; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: var(--s); box-shadow: 0 0 8px rgba(52, 152, 219, 0.2); }

        /* Tarjeta de Trabajador Encontrado */
        #resultado-busqueda { display: none; background: var(--w); padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; margin-bottom: 30px; border-top: 5px solid var(--s); animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .r-foto { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 4px solid var(--bg); margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .r-nombre { font-size: 1.5em; font-weight: bold; margin: 0; text-transform: uppercase; }
        .r-info { color: #7f8c8d; margin: 5px 0 20px 0; font-size: 0.95em; }
        .r-destino { display: inline-block; background: #EBF5FB; color: var(--s); padding: 8px 20px; border-radius: 20px; font-weight: bold; margin-bottom: 20px; }
        
        .btn-group { display: flex; gap: 15px; justify-content: center; }
        button { border: none; padding: 15px 30px; border-radius: 8px; font-weight: bold; font-size: 1em; cursor: pointer; color: white; transition: 0.2s; min-width: 150px; }
        button:active { transform: scale(0.96); }
        .btn-ent { background: var(--g); box-shadow: 0 4px 0 #1e8449; }
        .btn-sal { background: var(--r); box-shadow: 0 4px 0 #922b21; }

        /* Lista de sugerencias */
        #lista-sugerencias { list-style: none; padding: 0; max-width: 80%; margin: 10px auto 0 auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .sugerencia-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; text-align: left; transition: 0.2s; }
        .sugerencia-item:hover { background: #f8f9fa; color: var(--s); }

        /* Tabla de Bitácora */
        .bitacora-seccion { background: var(--w); border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        th { background: var(--p); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8em; color: white; }
        .b-ent { background: var(--g); }
        .b-sal { background: var(--r); }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="margin:0; color: var(--p);">🛡️ Control de Accesos</h1>
        <p style="color: #7f8c8d; margin: 5px 0;">El Cielo Parque Residencial</p>
    </div>

    <div class="search-box">
        <input type="text" id="buscador" placeholder="Escribe nombre o CURP del trabajador..." onkeyup="buscarTrabajador()">
        <ul id="lista-sugerencias"></ul>
    </div>

    <div id="resultado-busqueda">
        <img id="res-foto" src="" class="r-foto">
        <p id="res-nombre" class="r-nombre"></p>
        <p id="res-info" class="r-info"></p>
        <div id="res-destino" class="r-destino"></div>
        
        <div class="btn-group">
            <button class="btn-ent" onclick="registrar('ENTRADA')">📥 REGISTRAR ENTRADA</button>
            <button class="btn-sal" onclick="registrar('SALIDA')">📤 REGISTRAR SALIDA</button>
        </div>
    </div>

    <div class="bitacora-seccion">
        <h3 style="padding: 15px; margin: 0; background: #f8f9fa; border-bottom: 1px solid #eee;">Últimos Movimientos en Caseta</h3>
        <table>
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Acción</th>
                    <th>Personal</th>
                    <th>Destino</th>
                </tr>
            </thead>
            <tbody id="tabla-log">
                </tbody>
        </table>
    </div>
</div>

<script>
    // --- TU CONFIGURACIÓN DE FIREBASE ---
    const firebaseConfig = {
        databaseURL: "https://sistema-vigilancia-6851e-default-rtdb.firebaseio.com",
        projectId: "sistema-vigilancia-6851e",
    };
    
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let dbPersonal = {};
    let trabajadorSeleccionado = null;

    // Cargar base de datos localmente para búsqueda rápida
    db.ref('personal_accesos').on('value', (snap) => {
        dbPersonal = snap.val() || {};
    });

    function buscarTrabajador() {
        const input = document.getElementById('buscador').value.toLowerCase();
        const lista = document.getElementById('lista-sugerencias');
        lista.innerHTML = '';

        if (input.length < 2) return;

        // Filtrar por nombre o CURP
        Object.keys(dbPersonal).forEach(id => {
            const p = dbPersonal[id];
            if (p.nombre.toLowerCase().includes(input) || p.curp.toLowerCase().includes(input)) {
                const li = document.createElement('li');
                li.className = 'sugerencia-item';
                li.innerHTML = `<strong>${p.nombre.toUpperCase()}</strong> <br> <small>${p.tipo} - Lote: ${p.lote}</small>`;
                li.onclick = () => seleccionarTrabajador(p);
                lista.appendChild(li);
            }
        });
    }

    function seleccionarTrabajador(datos) {
        trabajadorSeleccionado = datos;
        document.getElementById('lista-sugerencias').innerHTML = '';
        document.getElementById('buscador').value = datos.nombre;
        
        document.getElementById('res-foto').src = datos.foto || 'https://via.placeholder.com/150';
        document.getElementById('res-nombre').innerText = datos.nombre;
        document.getElementById('res-info').innerText = `${datos.tipo} | CURP: ${datos.curp}`;
        document.getElementById('res-destino').innerText = `DIRIGIR A: MANZANA ${datos.manzana} - LOTE ${datos.lote}`;
        
        document.getElementById('resultado-busqueda').style.display = 'block';
    }

    function registrar(tipo) {
        if (!trabajadorSeleccionado) return;

        const ahora = new Date();
        const registro = {
            tipo: tipo,
            nombre: trabajadorSeleccionado.nombre,
            curp: trabajadorSeleccionado.curp,
            mza: trabajadorSeleccionado.manzana,
            lte: trabajadorSeleccionado.lote,
            hora: ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            timestamp: ahora.getTime()
        };

        // Guardar en la bitácora de Firebase
        db.ref('bitacora_accesos_qr').push(registro).then(() => {
            alert(`✅ ${tipo} registrada para: ${trabajadorSeleccionado.nombre}`);
            // Limpiar interfaz
            document.getElementById('resultado-busqueda').style.display = 'none';
            document.getElementById('buscador').value = '';
            trabajadorSeleccionado = null;
        });
    }

    // Escuchar cambios en la bitácora (Top 10)
    db.ref('bitacora_accesos_qr').orderByChild('timestamp').limitToLast(10).on('value', (snap) => {
        const tbody = document.getElementById('tabla-log');
        tbody.innerHTML = '';
        
        const logs = [];
        snap.forEach(child => { logs.push(child.val()); });
        logs.reverse();

        logs.forEach(l => {
            const badgeClass = l.tipo === 'ENTRADA' ? 'b-ent' : 'b-sal';
            tbody.innerHTML += `
                <tr>
                    <td><strong>${l.hora}</strong></td>
                    <td><span class="badge ${badgeClass}">${l.tipo}</span></td>
                    <td>${l.nombre.split(' ')}... <br><small style="color:#aaa">${l.curp}</small></td>
                    <td>M${l.mza}-L${l.lte}</td>
                </tr>
            `;
        });
    });
</script>
</body>
</html>
