<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso y Entrega - Campamento</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --purple: #a855f7;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--card-bg); padding: 15px 25px; border-radius: 8px; margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); flex-wrap: wrap; gap: 15px;
        }
        
        .nav-tabs { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn-tab {
            background-color: #334155; color: var(--text-muted); border: none; padding: 12px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.2s;
        }
        .btn-tab.active { background-color: var(--primary); color: white; }
        .btn-tab:hover { opacity: 0.9; }

        .card { background-color: var(--card-bg); padding: 25px; border-radius: 10px; max-width: 1200px; margin: 0 auto 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        .search-box {
            background-color: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px;
        }
        
        input, select {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569;
            background-color: #0f172a; color: white; font-size: 15px;
        }

        .btn-action {
            padding: 12px 15px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold;
            color: white; cursor: pointer; transition: opacity 0.2s; display: block; width: 100%; text-align: center;
        }
        .btn-action:hover { opacity: 0.8; }
        
        .grid-menores {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-top: 20px;
        }

        .tarjeta-menor {
            background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 18px;
            position: relative; border-left: 5px solid var(--text-muted); display: flex; flex-direction: column; justify-content: space-between;
        }
        .tarjeta-menor.status-presente { border-left-color: var(--success); }
        .tarjeta-menor.status-entregado { border-left-color: var(--primary); }

        .badge-status {
            position: absolute; top: 15px; right: 15px; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase;
        }
        .badge-ausente { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge-presente { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-entregado { background-color: rgba(59, 130, 246, 0.2); color: var(--primary); }

        .info-data { font-size: 13px; color: var(--text-muted); margin: 5px 0; }
        .info-data b { color: var(--text-main); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { background-color: #0f172a; color: var(--text-muted); text-transform: uppercase; }
        
        .op-panel { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; border-top: 1px solid #233145; padding-top: 12px; }
    </style>
</head>
<body onload="inicializarApp()">

    <div class="header">
        <h2 style="margin:0;">🌲 Control Operativo - Campamento de Verano</h2>
        <div class="nav-tabs">
            <button class="btn-tab active" id="tab-operaciones" onclick="cambiarVista('operaciones')">📱 Panel Operativo</button>
            <button class="btn-tab" id="tab-bitacora" onclick="cambiarVista('bitacora')">📑 Bitácora Digital</button>
        </div>
    </div>

    <div id="modulo-operaciones" class="card">
        <div class="search-box">
            <label style="display:block; margin-bottom: 8px; font-weight:bold; color:var(--text-muted);">🔍 Buscar Menor o Tutor en Entrada:</label>
            <input type="text" id="buscar_operativa" placeholder="Escribe el nombre para filtrar tarjetas..." oninput="filtrarTarjetas()">
        </div>

        <h3 style="margin-top:0; color: var(--primary);">Padrón Oficial de Menores</h3>
        <div class="grid-menores" id="contenedor-tarjetas">
            </div>
    </div>

    <div id="modulo-bitacora" class="card" style="display:none; max-width: 100% !important;">
        <h3 style="margin-top:0; color: var(--purple);">Historial General de Entradas y Salidas</h3>
        
        <div class="search-box" style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div style="flex:1;">
                <label style="display:block; margin-bottom: 8px; font-weight:bold; color:var(--text-muted);">Filtrar por Fecha:</label>
                <input type="date" id="bit_filtro_fecha" onchange="cargarBitacora()">
            </div>
            <div style="flex:2;">
                <label style="display:block; margin-bottom: 8px; font-weight:bold; color:var(--text-muted);">Filtro por Texto (Niño o Tutor):</label>
                <input type="text" id="bit_filtro_texto" placeholder="Escribe para buscar en la bitácora..." oninput="filtrarTablaBitacora()">
            </div>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Fecha y Hora</th>
                        <th>Tipo Evento</th>
                        <th>Menor</th>
                        <th>Grupo / Edad</th>
                        <th>Tutor Involucrado</th>
                        <th>Teléfono Ref.</th>
                    </tr>
                </thead>
                <tbody id="tabla-bitacora">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = { 
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", 
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com", 
            projectId: "sistema-vigilancia-6851e", 
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", 
            messagingSenderId: "714792023462", 
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" 
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // PADRÓN OFICIAL
        const padronOficial = [
            { id: "m01", nombre: "ALEX SANTIAGO ORTEGA RUIZ", tipo: "MIEMBRO", edad: "6", tutores: "YANUARIA MARGARITA RUIZ BONILLA/ BRITANY TOLEDO BONILLA / THOMAS DUNKER", tel: "6692502797" },
            { id: "m02", nombre: "ALVARO ASPEE PEÑA", tipo: "MIEMBRO", edad: "9", tutores: "NURIA PEÑA GARCIA/ALVARO ASPEE", tel: "6692614557" },
            { id: "m03", nombre: "ANGEL RAUL LARA GOMEZ", tipo: "EXTERNO", edad: "9", tutores: "CARLOS ARTURO LARA BORBOA/CANDELARIA LEYVA PARDO/RAUL GOMEZ SAUCEDO/MARCELA GUADALUPE GOMEZ LEYVA", tel: "6691648004" },
            { id: "m04", nombre: "CIELO KUNZ", tipo: "EXTERNO", edad: "4", tutores: "PERLA KUNZ/ ALEZANDER KUNZ", tel: "7602223871" },
            { id: "m05", nombre: "CRISTOBAL ASPEE PEÑA", tipo: "MIEMBRO", edad: "5", tutores: "NURIA PEÑA GARCIA/ALVARO ASPEE", tel: "6692614557" },
            { id: "m06", nombre: "EMILIO TOPETE PINEDA", tipo: "EXTERNO", edad: "5", tutores: "MARIA FERNANDA PINEDA NORIEGA/ARNOLDO OTONIEL TOPETE GONZALEZ/MARIA BEGOÑA ALVAREZ GOICOCHEA/MIGUEL VAZQUEZ BARRAGAN", tel: "8110324800" },
            { id: "m07", nombre: "EMILIO VALDEZ VILLA", tipo: "MIEMBRO", edad: "7", tutores: "BERENICE PEREZ DE LA ROSA/ LESLIE VILLA VILLALOBOS/OMAR VALDEZ TIRADO", tel: "6693827455" },
            { id: "m08", nombre: "ISAAC VALDEZ VILLA", tipo: "MIEMBRO", edad: "12", tutores: "BERENICE PEREZ DE LA ROSA/ LESLIE VILLA VILLALOBOS/OMAR VALDEZ TIRADO", tel: "6693827455" },
            { id: "m09", nombre: "MAXIMILIANO VAZQUEZ ALVAREZ", tipo: "EXTERNO", edad: "5", tutores: "ANA BEGOÑA ÁLVAREZ GOICOECHEA /MIGUEL ÁNGEL VÁZQUEZ BARRAGÁN /BEGOÑA GOICOECHEA LUNA /MARÍA FERNANDA PINEDA /ARNOLDO TOPETE GONZÁLEZ/ ZUGEY PERAZA", tel: "6692834292" },
            { id: "m10", nombre: "MÁXIMO LAFFOON VEGA", tipo: "EXTERNO", edad: "5", tutores: "PAULINA VEGA STAMATIS/NATALIA VAZQUEZ ESCOBEDO/CHRIS R. LAFFOON NUÑEZ", tel: "6691590135" },
            { id: "m11", nombre: "MIGUEL ALEJANDRO TIRADO CEBALLOS", tipo: "EXTERNO", edad: "7", tutores: "ROMINA MICHELLE CEBALLOS SANDOVAL/PAULINA AVILEZ CEBALLOS/ALEJANDRO TIRADO ARIAS", tel: "6692403288" },
            { id: "m12", nombre: "RENATA IRIZAR BAUTISTA", tipo: "MIEMBRO", edad: "5", tutores: "ANGELICA BAUTISTA VARELA/EDWIN IRAZAR LEYVA", tel: "8110343029" },
            { id: "m13", nombre: "ROMINA IRIZAR BAUTISTA", tipo: "MIEMBRO", edad: "6", tutores: "ANGELICA BAUTISTA VARELA/EDWIN IRAZAR LEYVA", tel: "8110343029" },
            { id: "m14", nombre: "ROMINA MIRLETH TIRADO CEBALLOS", tipo: "EXTERNO", edad: "6", tutores: "ROMINA MICHELLE CEBALLOS SANDOVAL/PAULINA AVILEZ CEBALLOS/ALEJANDRO TIRADO ARIAS", tel: "669 240 3288" },
            { id: "m15", nombre: "SANTIAGO CASTILLO LIZARRAGA", tipo: "EXTERNO", edad: "7", tutores: "PATRICIA LIZARRAGA/ALEJANDRO CASTILLO/ROSA ICELA BASTIDAS", tel: "6692404454" },
            { id: "m16", nombre: "SANTIAGO CANALE PALAZUELOS", tipo: "EXTERNO", edad: "7", tutores: "PAULINA VEGA STAMATIS/NATALIA VAZQUEZ ESCOBEDO/YORELI PALAZUELOS STAMATIS", tel: "6691470438" },
            { id: "m17", nombre: "SEBASTIAN PONCE DELGADILLO", tipo: "EXTERNO", edad: "11", tutores: "MARÍA RACHELLE DELGADILLO GASTELUM/MIREYA ISABEL DELGADILLO GASTELUM /MIREYA OLIVIA GASTELUM CAZÁREZ/JOSÉ IVÁN DELGADILLO GASTELUM/AIDA YANINE DELGADILLO GATELUM", tel: "3333793465" },
            { id: "m18", nombre: "VALERIA SOFIA LARA GOMEZ", tipo: "EXTERNO", edad: "7", tutores: "CARLOS ARTURO LARA BORBOA/CANDELARIA LEYVA PARDO/RAUL GOMEZ SAUCEDO/MARCELA GUADALUPE GOMEZ LEYVA", tel: "6691648004" }
        ];

        let estadosLocales = {};

        function inicializarApp() {
            let hoy = new Date().toISOString().split('T')[0];
            document.getElementById('bit_filtro_fecha').value = hoy;

            db.collection("estado_asistencia_camp").onSnapshot(snapshot => {
                estadosLocales = {};
                snapshot.forEach(doc => { estadosLocales[doc.id] = doc.data().estatus; });
                renderizarTarjetas();
            });
        }

        function cambiarVista(modulo) {
            document.getElementById('modulo-operaciones').style.display = modulo === 'operaciones' ? 'block' : 'none';
            document.getElementById('modulo-bitacora').style.display = modulo === 'bitacora' ? 'block' : 'none';

            document.getElementById('tab-operaciones').classList.toggle('active', modulo === 'operaciones');
            document.getElementById('tab-bitacora').classList.toggle('active', modulo === 'bitacora');

            if(modulo === 'bitacora') { cargarBitacora(); }
        }

        function renderizarTarjetas() {
            const contenedor = document.getElementById('contenedor-tarjetas');
            contenedor.innerHTML = "";

            padronOficial.forEach(m => {
                let estatusActual = estadosLocales[m.id] || "Ausente"; 
                let claseStatus = "";
                let badgeClase = "badge-ausente";

                if(estatusActual === 'En Campamento') { badgeClase = "badge-presente"; claseStatus = "status-presente"; }
                else if(estatusActual === 'Entregado') { badgeClase = "badge-entregado"; claseStatus = "status-entregado"; }

                let listaTutores = m.tutores.split('/');
                let opcionesTutores = listaTutores.map(t => `<option value="${t.trim()}">${t.trim()}</option>`).join('');

                let tarjetaHTML = `
                    <div class="tarjeta-menor ${claseStatus}" data-busqueda="${m.nombre.toLowerCase()} ${m.tutores.toLowerCase()}">
                        <div>
                            <span class="badge-status ${badgeClase}">${estatusActual}</span>
                            <h4 style="margin: 0 0 5px 0; color: white; max-width: 75%;">${m.nombre}</h4>
                            <p class="info-data">🎯 <b>Tipo:</b> ${m.tipo} | <b>Edad:</b> ${m.edad} años</p>
                            <p class="info-data">📞 <b>Emergencia:</b> ${m.tel}</p>
                            
                            <label style="margin-top: 10px; font-size:12px;">Seleccione Tutor para Salida:</label>
                            <select id="tutor_entrega_${m.id}" style="margin-bottom:0; padding: 8px; font-size:13px;">
                                ${opcionesTutores}
                            </select>
                        </div>
                        
                        <div class="op-panel">
                            <button class="btn-action" style="background-color: var(--success);" onclick="registrarEvento('${m.id}', 'ENTRADA')">🟢 REGISTRAR ENTRADA</button>

                            ${estatusActual === 'En Campamento' ? `
                                <button class="btn-action" style="background-color: var(--warning); color: black;" onclick="enviarAlertaWhatsApp('${m.nombre}')">📣 ALERTA AL STAFF (WhatsApp)</button>
                            ` : ''}

                            <button class="btn-action" style="background-color: var(--danger);" onclick="registrarEvento('${m.id}', 'SALIDA')">🔴 REGISTRAR SALIDA</button>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += tarjetaHTML;
            });
        }

        function filtrarTarjetas() {
            let texto = document.getElementById('buscar_operativa').value.toLowerCase();
            let tarjetas = document.getElementsByClassName('tarjeta-menor');
            
            for(let i=0; i < tarjetas.length; i++) {
                let contenido = tarjetas[i].getAttribute('data-busqueda');
                if(contenido.includes(texto)) { tarjetas[i].style.display = "flex"; } 
                else { tarjetas[i].style.display = "none"; }
            }
        }

        // ====== ACCIONES TÁCTICAS Y NOTIFICACIONES ======
        function registrarEvento(id_menor, tipoEvento) {
            let menorInfo = padronOficial.find(m => m.id === id_menor);
            let tutorSeleccionado = document.getElementById(`tutor_entrega_${id_menor}`).value;
            
            let hoy = new Date();
            let fechaStr = hoy.toISOString().split('T')[0];
            let horaStr = String(hoy.getHours()).padStart(2, '0') + ':' + String(hoy.getMinutes()).padStart(2, '0');

            let nuevoEstado = tipoEvento === 'ENTRADA' ? "En Campamento" : "Entregado";
            let descTutor = tipoEvento === 'ENTRADA' ? "N/A - Ingreso al Campamento" : `Entregado a: ${tutorSeleccionado}`;

            // Actualizar estado en Firestore
            db.collection("estado_asistencia_camp").doc(id_menor).set({ estatus: nuevoEstado });

            // Inyectar Registro en Bitácora
            db.collection("bitacora_campamento").add({
                timestamp: Date.now(),
                fecha: fechaStr,
                hora: horaStr,
                tipo: tipoEvento,
                menor: menorInfo.nombre,
                grupo: `${menorInfo.edad} años (${menorInfo.tipo})`,
                tutor_vehiculo: descTutor,
                tel: menorInfo.tel
            });

            // ====== NUEVO: ALERTA DE SALIDA A CONTACTO DEL MENOR ======
            if (tipoEvento === 'SALIDA') {
                // Limpiamos espacios del número y le agregamos prefijo 52 si es un celular de 10 dígitos
                let numLimpio = menorInfo.tel.replace(/\D/g, ''); 
                let numWA = numLimpio.length === 10 ? '52' + numLimpio : numLimpio;

                let mensajeFamilia = `🌲 *Campamento Club Cardones* 🌲\n\nHola. 👋 Queremos informarle que *${menorInfo.nombre}* ha terminado su día de actividades y ha sido entregado(a) de manera segura a: *${tutorSeleccionado}*.\n\n¡Esperamos que haya tenido un excelente día, nos vemos pronto!`;
                
                let urlNotificacion = `https://api.whatsapp.com/send?phone=${numWA}&text=${encodeURIComponent(mensajeFamilia)}`;
                
                // Abre el WhatsApp para enviar el mensaje al familiar
                window.open(urlNotificacion, '_blank');
            }
        }

        function enviarAlertaWhatsApp(nombre) {
            let telStaff = "526691975443"; 
            let mensaje = `🌲 *CLUB CARDONES ALERT* 🌲\nEl padre o tutor autorizado de *${nombre}* se encuentra en la entrada general listo para la salida. Por favor, preparar al menor para su entrega.`;
            
            let urlWA = `https://api.whatsapp.com/send?phone=${telStaff}&text=${encodeURIComponent(mensaje)}`;
            
            let hoy = new Date();
            db.collection("bitacora_campamento").add({
                timestamp: Date.now(),
                fecha: hoy.toISOString().split('T')[0],
                hora: String(hoy.getHours()).padStart(2, '0') + ':' + String(hoy.getMinutes()).padStart(2, '0'),
                tipo: "ALERTA WA",
                menor: nombre,
                grupo: "N/A",
                tutor_vehiculo: "Staff Notificado",
                tel: telStaff
            });

            window.open(urlWA, '_blank');
        }

        // ====== LÓGICA DE LA BITÁCORA ======
        function cargarBitacora() {
            let fechaSeleccionada = document.getElementById('bit_filtro_fecha').value;
            const tbody = document.getElementById('tabla-bitacora');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Buscando registros...</td></tr>';

            db.collection("bitacora_campamento")
            .where("fecha", "==", fechaSeleccionada)
            .get()
            .then(snapshot => {
                tbody.innerHTML = "";
                if(snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">Sin movimientos registrados en esta fecha.</td></tr>';
                    return;
                }

                let registros = [];
                snapshot.forEach(doc => registros.push(doc.data()));
                registros.sort((a,b) => b.timestamp - a.timestamp);

                registros.forEach(r => {
                    let colorBadge = "var(--text-muted)";
                    if(r.tipo === "ENTRADA") colorBadge = "var(--success)";
                    if(r.tipo === "SALIDA") colorBadge = "var(--danger)";
                    if(r.tipo === "ALERTA WA") colorBadge = "var(--warning)";

                    tbody.innerHTML += `
                        <tr class="fila-registro-bitacora" data-contenido="${r.menor.toLowerCase()} ${r.tutor_vehiculo.toLowerCase()}">
                            <td><b>${r.fecha}</b><br><span style="color: var(--text-muted);">${r.hora} hrs</span></td>
                            <td><span style="background-color: ${colorBadge}; color: black; padding: 4px 8px; font-weight:bold; border-radius:4px; font-size:11px;">${r.tipo}</span></td>
                            <td><b>${r.menor}</b></td>
                            <td>${r.grupo}</td>
                            <td>${r.tutor_vehiculo}</td>
                            <td style="color: var(--text-muted);">${r.tel}</td>
                        </tr>
                    `;
                });
            })
            .catch(err => { tbody.innerHTML = `<tr><td colspan="6">Error de sincronización: ${err.message}</td></tr>`; });
        }

        function filtrarTablaBitacora() {
            let texto = document.getElementById('bit_filtro_texto').value.toLowerCase();
            let filas = document.getElementsByClassName('fila-registro-bitacora');

            for (let i = 0; i < filas.length; i++) {
                let data = filas[i].getAttribute('data-contenido');
                if (data.includes(texto)) { filas[i].style.display = ""; } 
                else { filas[i].style.display = "none"; }
            }
        }
    </script>
</body>
</html>
