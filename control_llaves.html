<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Llaves - El Cielo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root { --bg: #0B192C; --panel: #1A2B3C; --text: #E2E8F0; --accent: #3498DB; --green: #27AE60; --red: #E74C3C; --gold: #F39C12; }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); color: var(--text); }
        
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .header h1 { margin: 0; font-size: 1.5em; text-transform: uppercase; color: var(--gold); }

        .panel { background: var(--panel); border: 1px solid #2a3f54; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        
        .form-row { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 15px; }
        @media (min-width: 600px) { .form-row { grid-template-columns: 1fr 1fr; } }
        
        label { font-size: 0.9em; color: #95A5A6; font-weight: bold; margin-bottom: 5px; display: block; }
        input, select { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #334; background: #132433; color: white; box-sizing: border-box; font-size: 1em; }
        input:focus, select:focus { outline: none; border-color: var(--accent); }

        /* Contenedor de Firma Táctil */
        .firma-container { border: 2px dashed #7f8c8d; border-radius: 8px; background: #fff; touch-action: none; /* Bloquea el scroll al tocar aquí */ }
        canvas { display: block; width: 100%; height: 150px; cursor: crosshair; }
        .firma-acciones { text-align: right; margin-top: 5px; }
        .btn-limpiar { background: transparent; color: var(--red); border: 1px solid var(--red); padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        .btn { padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; width: 100%; font-size: 1.1em; margin-top: 10px; }
        .btn-add { background: var(--green); }
        .btn-pdf { background: var(--red); margin-bottom: 15px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85em; background: var(--panel); }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #2a3f54; }
        th { background: #132433; color: var(--accent); }
        .status-prestada { color: var(--red); font-weight: bold; }
        .status-devuelta { color: var(--green); font-weight: bold; }
        
        .btn-devolver { background: var(--accent); border: none; color: white; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔑 Control de Llaves</h1>
        <p style="color: #95A5A6; margin: 5px 0 0 0;">El Cielo Parque Residencial</p>
    </div>

    <div class="panel">
        <form id="formLlaves">
            <div class="form-row">
                <div>
                    <label>Llave / Espacio:</label>
                    <input type="text" id="llaveId" placeholder="Ej. Cuarto de Máquinas" required>
                </div>
                <div>
                    <label>Entregada a (Nombre/Empresa):</label>
                    <input type="text" id="persona" placeholder="Nombre de quien recibe" required>
                </div>
            </div>

            <label>Firma de Recepción (Firme aquí 👇):</label>
            <div class="firma-container">
                <canvas id="firmaCanvas"></canvas>
            </div>
            <div class="firma-acciones">
                <button type="button" class="btn-limpiar" onclick="limpiarFirma()">Limpiar Firma</button>
            </div>

            <button type="submit" class="btn btn-add">Registrar Salida de Llave</button>
        </form>
    </div>

    <div>
        <button class="btn btn-pdf" onclick="exportarPDF()">📄 Descargar Reporte PDF</button>
    </div>
    
    <div style="overflow-x: auto; border-radius: 8px; border: 1px solid #2a3f54;">
        <table id="tablaLlaves">
            <thead>
                <tr>
                    <th>Fecha/Hora Salida</th>
                    <th>Llave</th>
                    <th>Entregada a</th>
                    <th>Estatus</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="bodyLlaves"></tbody>
        </table>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN DEL CANVAS (SOPORTE MÓVIL Y PC) ---
        const canvas = document.getElementById('firmaCanvas');
        const ctx = canvas.getContext('2d');
        let dibujando = false;

        // Ajustar tamaño real del canvas para evitar distorsiones
        function ajustarCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = 150;
        }
        window.addEventListener('resize', ajustarCanvas);
        ajustarCanvas();

        // Obtener coordenadas exactas (Mouse o Touch)
        function obtenerPosicion(e) {
            let rect = canvas.getBoundingClientRect();
            let evt = e.touches ? e.touches : e;
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        // Eventos de dibujo
        function iniciarDibujo(e) {
            e.preventDefault(); // Evita el scroll en móviles
            dibujando = true;
            let pos = obtenerPosicion(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function trazar(e) {
            e.preventDefault();
            if (!dibujando) return;
            let pos = obtenerPosicion(e);
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function detenerDibujo(e) {
            e.preventDefault();
            dibujando = false;
        }

        // Listeners Mouse
        canvas.addEventListener('mousedown', iniciarDibujo);
        canvas.addEventListener('mousemove', trazar);
        canvas.addEventListener('mouseup', detenerDibujo);
        canvas.addEventListener('mouseleave', detenerDibujo);

        // Listeners Touch (Celulares)
        canvas.addEventListener('touchstart', iniciarDibujo, { passive: false });
        canvas.addEventListener('touchmove', trazar, { passive: false });
        canvas.addEventListener('touchend', detenerDibujo, { passive: false });

        function limpiarFirma() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // --- 2. GESTIÓN DE DATOS ---
        let bitacoraLlaves = JSON.parse(localStorage.getItem('bitacoraLlaves')) || [];

        function renderizarTabla() {
            const tbody = document.getElementById('bodyLlaves');
            tbody.innerHTML = '';
            
            bitacoraLlaves.forEach((reg, index) => {
                let estatusClass = reg.estatus === 'Pendiente' ? 'status-prestada' : 'status-devuelta';
                let btnDevolver = reg.estatus === 'Pendiente' 
                    ? `<button class="btn-devolver" onclick="registrarDevolucion(${index})">Recibir Llave</button>` 
                    : `<span>Devuelta: ${reg.horaDevolucion}</span>`;

                tbody.innerHTML += `
                    <tr>
                        <td>${reg.fechaSalida} <br> ${reg.horaSalida}</td>
                        <td><strong>${reg.llave}</strong></td>
                        <td>${reg.persona}</td>
                        <td class="${estatusClass}">${reg.estatus}</td>
                        <td>${btnDevolver}</td>
                    </tr>
                `;
            });
        }

        document.getElementById('formLlaves').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validar que haya firmado (si el canvas está en blanco)
            const canvasBlank = document.createElement('canvas');
            canvasBlank.width = canvas.width; canvasBlank.height = canvas.height;
            if (canvas.toDataURL() === canvasBlank.toDataURL()) {
                alert("Por favor, solicite la firma de recepción.");
                return;
            }

            const ahora = new Date();
            const nuevoRegistro = {
                fechaSalida: ahora.toLocaleDateString(),
                horaSalida: ahora.toLocaleTimeString(),
                llave: document.getElementById('llaveId').value.toUpperCase(),
                persona: document.getElementById('persona').value.toUpperCase(),
                estatus: 'Pendiente',
                horaDevolucion: '-',
                firma: canvas.toDataURL() // Guarda la firma como imagen
            };

            bitacoraLlaves.push(nuevoRegistro);
            localStorage.setItem('bitacoraLlaves', JSON.stringify(bitacoraLlaves));
            
            this.reset();
            limpiarFirma();
            renderizarTabla();
        });

        window.registrarDevolucion = function(index) {
            if(confirm('¿Confirmas que la llave fue devuelta en su lugar?')) {
                const ahora = new Date();
                bitacoraLlaves[index].estatus = 'Devuelta';
                bitacoraLlaves[index].horaDevolucion = ahora.toLocaleTimeString();
                localStorage.setItem('bitacoraLlaves', JSON.stringify(bitacoraLlaves));
                renderizarTabla();
            }
        }

        // --- 3. EXPORTAR A PDF ---
        window.exportarPDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Encabezado del PDF
            doc.setFontSize(16);
            doc.text("Bitácora de Control de Llaves", 14, 20);
            doc.setFontSize(11);
            doc.setTextColor(100);
            doc.text("El Cielo Parque Residencial", 14, 28);
            doc.text("Fecha de Reporte: " + new Date().toLocaleString(), 14, 34);

            // Preparar datos para la tabla del PDF
            const bodyDatos = bitacoraLlaves.map(r => [
                r.fechaSalida + ' ' + r.horaSalida,
                r.llave,
                r.persona,
                r.estatus,
                r.horaDevolucion
            ]);

            doc.autoTable({
                startY: 40,
                head: [['Salida', 'Llave', 'Responsable', 'Estatus', 'Devolución']],
                body: bodyDatos,
                theme: 'grid',
                headStyles: { fillColor: },
                styles: { fontSize: 9 }
            });

            // Descargar el archivo
            doc.save('Reporte_Llaves_ElCielo.pdf');
        }

        // Iniciar
        renderizarTabla();
    </script>
</body>
</html>
