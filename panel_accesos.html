<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        const claveCorrecta = "Accesos2026";
        let intento = prompt("🔒 ACCESO RESTRINGIDO\nIngrese la contraseña para la Bitácora de Accesos:");
        if (intento !== claveCorrecta) {
            alert("❌ Contraseña incorrecta. Acceso denegado.");
            window.location.href = "https://hjls8790-a11y.github.io/vigilancia/menu.html"; 
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITÁCORA DE ACCESOS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #3498db; }
        .badge { background: #3498db; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        
        #filtros-container { background: white; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .filtro-grupo { display: flex; flex-direction: column; flex: 1; min-width: 150px; }
        .filtro-grupo label { font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .filtro-grupo input, .filtro-grupo select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        
        .btn-limpiar { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; height: 40px; }
        .btn-limpiar:hover { background: #c0392b; }

        #tabla-container { flex: 1; overflow-y: auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background: #34495e; color: white; text-transform: uppercase; font-size: 13px; position: sticky; top: 0; }
        tr:hover { background-color: #f1f5f8; }
        
        .tag-ubicacion { font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: bold; color: white; }
        .tag-General { background: #3498db; }
        .tag-Cardones { background: #27ae60; }
        .tag-Fotur { background: #d35400; }
        
        .movimiento-entrada { color: #27ae60; font-weight: bold; }
        .movimiento-salida { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <div id="header">
        <h2>📋 BITÁCORA GENERAL DE ACCESOS</h2>
        <div class="badge">AUDITORÍA Y CONTROL</div>
    </div>

    <div id="filtros-container">
        <div class="filtro-grupo" style="flex: 2;">
            <label>🔍 Búsqueda Universal</label>
            <input type="text" id="filtroTexto" placeholder="Nombre, Placas, Vehículo, Hora..." oninput="filtrar()">
        </div>
        
        <div class="filtro-grupo">
            <label>↔️ Movimiento</label>
            <select id="filtroMovimiento" onchange="filtrar()">
                <option value="Todos">Entradas y Salidas</option>
                <option value="ENTRADA">Solo Entradas</option>
                <option value="SALIDA">Solo Salidas</option>
            </select>
        </div>

        <div class="filtro-grupo">
            <label>📍 Caseta</label>
            <select id="filtroUbicacion" onchange="filtrar()">
                <option value="Todas">Todas</option>
                <option value="General">General</option>
                <option value="Cardones">Cardones</option>
                <option value="Fotur">Fotur</option>
            </select>
        </div>
        
        <div class="filtro-grupo">
            <label>📅 Fecha</label>
            <input type="date" id="filtroFecha" onchange="filtrar()">
        </div>
        
        <button class="btn-limpiar" onclick="limpiarFiltros()">Limpiar</button>
    </div>

    <div id="tabla-container">
        <table>
            <thead>
                <tr>
                    <th>Fecha y Hora</th>
                    <th>Movimiento</th>
                    <th>Caseta</th>
                    <th>Visitante</th>
                    <th>Destino / Domicilio</th>
                    <th>Vehículo (Marca / Color)</th>
                    <th>Placas</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
                <tr><td colspan="7" style="text-align:center;">Cargando registros...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let datosOriginales = [];

        async function cargarDatos() {
            const tbody = document.getElementById('cuerpo-tabla');
            try {
                const q = query(collection(db, "accesos"), orderBy("timestamp", "desc"));
                const snapshot = await getDocs(q);
                datosOriginales = [];
                
                snapshot.forEach(doc => {
                    datosOriginales.push(doc.data());
                });

                renderizarTabla(datosOriginales);
            } catch (e) {
                console.error(e);
                tbody.innerHTML = "<tr><td colspan='7' style='text-align:center; color:red;'>Error al cargar los datos.</td></tr>";
            }
        }

        function renderizarTabla(datos) {
            const tbody = document.getElementById('cuerpo-tabla');
            if (datos.length === 0) {
                tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>📭 No hay registros que coincidan con la búsqueda.</td></tr>";
                return;
            }
            
            tbody.innerHTML = "";
            datos.forEach(d => {
                const tr = document.createElement('tr');
                const tagColor = `tag-${d.ubicacion}`;
                // Si el registro es viejo y no tiene tipo, asumimos que fue ENTRADA
                const tipoMov = d.tipo_movimiento || "ENTRADA"; 
                const claseMov = tipoMov === "ENTRADA" ? "movimiento-entrada" : "movimiento-salida";
                const iconoMov = tipoMov === "ENTRADA" ? "🟢" : "🔴";
                
                tr.innerHTML = `
                    <td><b>${d.fecha_hora}</b></td>
                    <td class="${claseMov}">${iconoMov} ${tipoMov}</td>
                    <td><span class="tag-ubicacion ${tagColor}">${d.ubicacion}</span></td>
                    <td>${d.visitante}</td>
                    <td>${d.domicilio}</td>
                    <td>${d.vehiculo_marca !== 'N/A' ? d.vehiculo_marca + ' - ' + d.vehiculo_color : 'Peatón / N/A'}</td>
                    <td style="font-family: monospace; font-size: 15px;"><b>${d.vehiculo_placas}</b></td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.filtrar = function() {
            const texto = document.getElementById('filtroTexto').value.toLowerCase();
            const fechaInput = document.getElementById('filtroFecha').value;
            const ubicacion = document.getElementById('filtroUbicacion').value;
            const movimiento = document.getElementById('filtroMovimiento').value;
            
            const filtrados = datosOriginales.filter(d => {
                const tipoMov = d.tipo_movimiento || "ENTRADA";
                
                const cadenaBusqueda = `${d.visitante} ${d.domicilio} ${d.vehiculo_marca} ${d.vehiculo_color} ${d.vehiculo_placas} ${d.fecha_hora}`.toLowerCase();
                const coincideTexto = cadenaBusqueda.includes(texto);
                
                const coincideUbicacion = ubicacion === "Todas" || d.ubicacion === ubicacion;
                const coincideMovimiento = movimiento === "Todos" || tipoMov === movimiento;
                
                let coincideFecha = true;
                if (fechaInput) {
                    const partes = fechaInput.split('-');
                    const f1 = `${Number(partes[2])}/${Number(partes[1])}/${partes[0]}`; 
                    const f2 = `${partes[2]}/${partes[1]}/${partes[0]}`; 
                    coincideFecha = d.fecha_hora.includes(f1) || d.fecha_hora.includes(f2);
                }
                
                return coincideTexto && coincideUbicacion && coincideMovimiento && coincideFecha;
            });
            
            renderizarTabla(filtrados);
        };

        window.limpiarFiltros = () => {
            document.getElementById('filtroTexto').value = "";
            document.getElementById('filtroFecha').value = "";
            document.getElementById('filtroUbicacion').value = "Todas";
            document.getElementById('filtroMovimiento').value = "Todos";
            renderizarTabla(datosOriginales);
        };

        cargarDatos();
    </script>
</body>
</html>
