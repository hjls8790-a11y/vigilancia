<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierre de Turno | Seguridad Integral</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a2a3a; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #3498db; padding-bottom: 10px; width: 100%; max-width: 600px; }
        .header h1 { margin: 0; font-size: 22px; color: #ecf0f1; text-transform: uppercase; }
        .header h2 { margin: 5px 0 0 0; font-size: 14px; color: #3498db; letter-spacing: 2px; }

        .form-container { width: 100%; max-width: 600px; background: #2c3e50; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .section-title { background: #3498db; padding: 10px; border-radius: 5px; font-weight: bold; margin: 20px 0 15px 0; text-align: center; font-size: 16px; text-transform: uppercase; }
        
        label { display: block; margin-top: 15px; font-size: 14px; color: #bdc3c7; font-weight: bold; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #7f8c8d; background: #34495e; color: white; font-size: 15px; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* Estilos para los checkbox de los radios */
        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; background: #34495e; padding: 15px; border-radius: 8px; border: 1px solid #7f8c8d; }
        .checkbox-group label { margin-top: 0; font-weight: normal; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: #ecf0f1; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #3498db; }

        .btn-submit { background: #27ae60; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 30px; cursor: pointer; transition: 0.3s; }
        .btn-submit:active { transform: scale(0.98); background: #2ecc71; }
        .btn-submit:disabled { background: #7f8c8d; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ Bitácora de Caseta</h1>
        <h2>CIERRE DE TURNO Y NOVEDADES</h2>
    </div>

    <div class="form-container">
        <div class="section-title">👤 DATOS DEL TURNO</div>
        <label>Nombre del Oficial:</label>
        <input type="text" id="oficial" placeholder="Ej. Joaquín..." required>
        
        <div class="grid-2">
            <div>
                <label>Turno:</label>
                <select id="turno">
                    <option value="07:00 a 15:00">07:00 a 15:00</option>
                    <option value="15:00 a 23:00">15:00 a 23:00</option>
                    <option value="23:00 a 07:00">23:00 a 07:00</option>
                </select>
            </div>
            <div>
                <label>Fecha de Cierre:</label>
                <input type="date" id="fecha" required>
            </div>
        </div>

        <div class="section-title">📻 INVENTARIO Y EQUIPO</div>
        
        <label>Asignación para el Agente en Turno (Radio y Teléfono):</label>
        <input type="text" id="asignacion_equipo" placeholder="Ej. En turno con Radio #7 GAMA y celular 1" required>

        <label>Inventario de Radios en Caseta (Marca los presentes):</label>
        <div class="checkbox-group">
            <label><input type="checkbox" class="radio-check" value="#1 SERIE 950" checked> #1 SERIE 950</label>
            <label><input type="checkbox" class="radio-check" value="#2 SERIE 948" checked> #2 SERIE 948</label>
            <label><input type="checkbox" class="radio-check" value="#3 SERIE 646" checked> #3 SERIE 646</label>
            <label><input type="checkbox" class="radio-check" value="#4 SERIE 045" checked> #4 SERIE 045</label>
            <label><input type="checkbox" class="radio-check" value="#5 SERIE 757" checked> #5 SERIE 757</label>
            <label><input type="checkbox" class="radio-check" value="#6 OOO" checked> #6 OOO</label>
            <label><input type="checkbox" class="radio-check" value="#7 GAMA" checked> #7 GAMA</label>
        </div>

        <label>Teléfonos y Monitores:</label>
        <input type="text" id="telefonos" placeholder="Ej. 6 y 1 fijo, 3 monitores en buen estado" required>
        
        <label>Llaves, Bastones y Equipo Adicional:</label>
        <textarea id="llaves" placeholder="Ej. 11 llaves de caseta, 1 bastón, 0 vales de gasolina..."></textarea>

        <div class="section-title">🚚 FILTRO EXTERNO (SERVICIOS Y PROVEEDORES)</div>
        <p style="font-size: 12px; color: #95a5a6; margin-top: 0;">* Si no hubo ingresos, poner "Sin novedad".</p>
        
        <label>Servicios (CFE, JUMAPAM, Basura):</label>
        <textarea id="servicios" placeholder="Ej. CFE entró 10:00 am a toma de lectura..."></textarea>

        <label>Proveedores y Autoridades (Policía, Ambulancia, etc):</label>
        <textarea id="proveedores" placeholder="Registro de autoridades o proveedores..."></textarea>
        
        <label>Trabajos Internos (Colados / Obras):</label>
        <textarea id="colados" placeholder="Ej. MR40 colado para helios 2009..."></textarea>

        <div class="section-title">📝 CONSIGNAS Y NOVEDADES GENERALES</div>
        <label>Redacción de Novedades del Turno:</label>
        <textarea id="novedades_generales" style="min-height: 120px;" placeholder="Ej. Se recibe turno con las consignas establecidas. Pendiente apoyar con acceso a la Sra. Velasco..." required></textarea>

        <button type="button" id="btnGuardar" class="btn-submit" onclick="guardarCierre()">💾 GUARDAR REPORTE DE TURNO</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // TU CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = { 
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", 
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com", 
            projectId: "sistema-vigilancia-6851e", 
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", 
            messagingSenderId: "714792023462", 
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Colocar la fecha actual en el input type="date"
        const hoy = new Date();
        const yyyy = hoy.getFullYear();
        const mm = String(hoy.getMonth() + 1).padStart(2, '0');
        const dd = String(hoy.getDate()).padStart(2, '0');
        document.getElementById('fecha').value = `${yyyy}-${mm}-${dd}`;

        window.guardarCierre = async () => {
            const oficial = document.getElementById('oficial').value.trim();
            const asignacion = document.getElementById('asignacion_equipo').value.trim();
            const novedades = document.getElementById('novedades_generales').value.trim();

            if(!oficial || !asignacion || !novedades) {
                return alert("⚠️ Faltan datos clave: Oficial, Asignación de Equipo o Novedades.");
            }

            const btn = document.getElementById('btnGuardar');
            btn.innerText = "Guardando..."; btn.disabled = true;

            // Recopilar qué radios se marcaron con palomita
            const radiosCheck = document.querySelectorAll('.radio-check:checked');
            const radiosSeleccionados = Array.from(radiosCheck).map(cb => cb.value).join(', ');

            try {
                await addDoc(collection(db, "bitacora_caseta"), {
                    oficial: oficial,
                    turno: document.getElementById('turno').value,
                    fecha_cierre: document.getElementById('fecha').value,
                    inventario: {
                        asignacion_turno: asignacion,
                        radios_presentes: radiosSeleccionados || "Ninguno marcado",
                        telefonos: document.getElementById('telefonos').value || "No especificado",
                        llaves_equipo: document.getElementById('llaves').value || "Sin novedad"
                    },
                    accesos: {
                        servicios: document.getElementById('servicios').value || "Sin novedad",
                        proveedores_autoridades: document.getElementById('proveedores').value || "Sin novedad",
                        colados_obras: document.getElementById('colados').value || "Sin novedad"
                    },
                    novedades_generales: novedades,
                    timestamp: Date.now(),
                    fecha_hora_registro: new Date().toLocaleString('es-MX')
                });

                alert("✅ Bitácora de Cierre de Turno guardada exitosamente.");
                location.reload(); // Limpiar el formulario
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("❌ Ocurrió un error al intentar guardar. Revisa tu conexión a internet.");
                btn.innerText = "💾 GUARDAR REPORTE DE TURNO"; btn.disabled = false;
            }
        };
    </script>
</body>
</html>
