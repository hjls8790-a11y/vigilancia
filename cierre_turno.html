<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierre de Turno | Seguridad Integral</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a2a3a; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #3498db; padding-bottom: 10px; width: 100%; max-width: 600px; }
        .header h1 { margin: 0; font-size: 22px; color: #ecf0f1; text-transform: uppercase; }
        .header h2 { margin: 5px 0 0 0; font-size: 14px; color: #3498db; letter-spacing: 2px; }

        .form-container { width: 100%; max-width: 600px; background: #2c3e50; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .section-title { background: #3498db; padding: 10px; border-radius: 5px; font-weight: bold; margin: 25px 0 15px 0; text-align: center; font-size: 16px; text-transform: uppercase; }
        
        label { display: block; margin-top: 15px; font-size: 14px; color: #bdc3c7; font-weight: bold; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #7f8c8d; background: #34495e; color: white; font-size: 15px; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* Estilos de Radios y Checkbox */
        .radio-asignacion { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
        .radio-tag { background: #1a2a3a; padding: 12px; border-radius: 8px; font-weight: bold; color: #f1c40f; width: 40%; text-align: center; font-size: 13px; border: 1px solid #7f8c8d; }
        .radio-input { width: 60%; }

        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; background: #34495e; padding: 15px; border-radius: 8px; border: 1px solid #7f8c8d; }
        .checkbox-group label { margin-top: 0; font-weight: normal; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: #ecf0f1; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #3498db; }

        .btn-submit { background: #27ae60; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 30px; cursor: pointer; transition: 0.3s; }
        .btn-submit:active { transform: scale(0.98); background: #2ecc71; }
        .btn-submit:disabled { background: #7f8c8d; cursor: not-allowed; }

        .btn-add { background: transparent; color: #f1c40f; border: 2px dashed #f1c40f; padding: 12px; width: 100%; border-radius: 8px; font-size: 14px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-add:hover { background: rgba(241, 196, 15, 0.1); }
        .vale-input { margin-bottom: 10px; border-color: #f1c40f !important; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ Bitácora de Caseta</h1>
        <h2>CIERRE DE TURNO Y NOVEDADES</h2>
    </div>

    <div class="form-container">
        <div class="section-title">👤 DATOS DEL TURNO</div>
        <label>Nombre del Oficial Saliente:</label>
        <input type="text" id="oficial" placeholder="Ej. Joaquín..." required>
        
        <div class="grid-2">
            <div>
                <label>Turno:</label>
                <select id="turno">
                    <option value="07:00 a 15:00">07:00 a 15:00</option>
                    <option value="15:00 a 23:00">15:00 a 23:00</option>
                    <option value="23:00 a 07:00">23:00 a 07:00</option>
                </select>
            </div>
            <div>
                <label>Fecha de Cierre:</label>
                <input type="date" id="fecha" required>
            </div>
        </div>

        <div class="section-title">🧹 ESTADO DE LA CASETA</div>
        <label>¿Se realizó limpieza de la caseta?</label>
        <select id="limpieza">
            <option value="Sí, se entrega limpia">✅ Sí, se entrega limpia y en orden</option>
            <option value="No se realizó limpieza">❌ No se realizó limpieza</option>
        </select>

        <div class="section-title">📻 ASIGNACIÓN DE RADIOS AL PERSONAL</div>
        <label>Escribe el nombre del Agente al que se le entrega cada unidad (Dejar en blanco si se queda en caseta):</label>
        
        <div class="radio-asignacion"><div class="radio-tag">#1 SERIE 950</div><input type="text" id="agente_radio_1" class="radio-input" placeholder="Nombre Agente Entrante"></div>
        <div class="radio-asignacion"><div class="radio-tag">#2 SERIE 948</div><input type="text" id="agente_radio_2" class="radio-input" placeholder="Nombre Agente Entrante"></div>
        <div class="radio-asignacion"><div class="radio-tag">#3 SERIE 646</div><input type="text" id="agente_radio_3" class="radio-input" placeholder="Nombre Agente Entrante"></div>
        <div class="radio-asignacion"><div class="radio-tag">#4 SERIE 045</div><input type="text" id="agente_radio_4" class="radio-input" placeholder="Nombre Agente Entrante"></div>
        <div class="radio-asignacion"><div class="radio-tag">#5 SERIE 757</div><input type="text" id="agente_radio_5" class="radio-input" placeholder="Nombre Agente Entrante"></div>
        <div class="radio-asignacion"><div class="radio-tag">#6 OOO</div><input type="text" id="agente_radio_6" class="radio-input" placeholder="Nombre Agente Entrante"></div>
        <div class="radio-asignacion"><div class="radio-tag">#7 GAMA</div><input type="text" id="agente_radio_7" class="radio-input" placeholder="Nombre Agente Entrante"></div>

        <label style="margin-top:20px;">Inventario Físico (Marca los radios que SÍ operan o están presentes):</label>
        <div class="checkbox-group">
            <label><input type="checkbox" class="radio-check" value="#1 SERIE 950" checked> #1 SERIE 950</label>
            <label><input type="checkbox" class="radio-check" value="#2 SERIE 948" checked> #2 SERIE 948</label>
            <label><input type="checkbox" class="radio-check" value="#3 SERIE 646" checked> #3 SERIE 646</label>
            <label><input type="checkbox" class="radio-check" value="#4 SERIE 045" checked> #4 SERIE 045</label>
            <label><input type="checkbox" class="radio-check" value="#5 SERIE 757" checked> #5 SERIE 757</label>
            <label><input type="checkbox" class="radio-check" value="#6 OOO" checked> #6 OOO</label>
            <label><input type="checkbox" class="radio-check" value="#7 GAMA" checked> #7 GAMA</label>
        </div>

        <label>Teléfonos y Equipo Adicional:</label>
        <textarea id="llaves" placeholder="Ej. 6 teléfonos y 1 fijo, 3 monitores ok, 11 llaves de caseta..."></textarea>

        <div class="section-title">⛽ VALES DE GASOLINA</div>
        <label>Ingresa los folios de los vales utilizados (Máximo 8):</label>
        <div id="contenedor_vales"></div>
        <button type="button" class="btn-add" onclick="agregarVale()">➕ AÑADIR FOLIO DE VALE</button>
        <input type="hidden" id="contador_vales" value="0">

        <div class="section-title">🚚 FILTRO EXTERNO</div>
        <label>Servicios y Proveedores (CFE, JUMAPAM, Policías, Obras):</label>
        <textarea id="proveedores" style="min-height: 100px;" placeholder="Ej. CFE entró 10:00 am. MR40 colado para helios..."></textarea>

        <div class="section-title">📝 CONSIGNAS Y NOVEDADES GENERALES</div>
        <label>Redacción de Novedades del Turno:</label>
        <textarea id="novedades_generales" style="min-height: 120px;" placeholder="Ej. Se entrega turno con las consignas establecidas. Pendiente apoyar con acceso..." required></textarea>

        <button type="button" id="btnGuardar" class="btn-submit" onclick="guardarCierre()">💾 GUARDAR REPORTE DE TURNO</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s", 
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com", 
            projectId: "sistema-vigilancia-6851e", 
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app", 
            messagingSenderId: "714792023462", 
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const hoy = new Date();
        const yyyy = hoy.getFullYear();
        const mm = String(hoy.getMonth() + 1).padStart(2, '0');
        const dd = String(hoy.getDate()).padStart(2, '0');
        document.getElementById('fecha').value = `${yyyy}-${mm}-${dd}`;

        let totalVales = 0;
        window.agregarVale = () => {
            if (totalVales >= 8) {
                alert("⚠️ Límite alcanzado: Solo se permite un máximo de 8 vales por turno.");
                return;
            }
            totalVales++;
            const contenedor = document.getElementById('contenedor_vales');
            contenedor.innerHTML += `<input type="text" id="vale_${totalVales}" class="vale-input" placeholder="Escribe el Número de Serie del Vale #${totalVales}">`;
        };

        window.guardarCierre = async () => {
            const oficial = document.getElementById('oficial').value.trim();
            const novedades = document.getElementById('novedades_generales').value.trim();

            if(!oficial || !novedades) {
                return alert("⚠️ Faltan datos clave: Oficial saliente o Novedades Generales.");
            }

            const btn = document.getElementById('btnGuardar');
            btn.innerText = "Guardando..."; btn.disabled = true;

            // Recopilar Asignaciones de Radios
            let asignacionesRadios = [
                `#1 SERIE 950: ${document.getElementById('agente_radio_1').value.trim() || 'En Caseta'}`,
                `#2 SERIE 948: ${document.getElementById('agente_radio_2').value.trim() || 'En Caseta'}`,
                `#3 SERIE 646: ${document.getElementById('agente_radio_3').value.trim() || 'En Caseta'}`,
                `#4 SERIE 045: ${document.getElementById('agente_radio_4').value.trim() || 'En Caseta'}`,
                `#5 SERIE 757: ${document.getElementById('agente_radio_5').value.trim() || 'En Caseta'}`,
                `#6 OOO: ${document.getElementById('agente_radio_6').value.trim() || 'En Caseta'}`,
                `#7 GAMA: ${document.getElementById('agente_radio_7').value.trim() || 'En Caseta'}`
            ];

            const radiosCheck = document.querySelectorAll('.radio-check:checked');
            const radiosSeleccionados = Array.from(radiosCheck).map(cb => cb.value).join(', ');

            let valesArray = [];
            for(let i = 1; i <= totalVales; i++) {
                let val = document.getElementById(`vale_${i}`).value.trim();
                if(val) valesArray.push(val);
            }
            const valesRegistrados = valesArray.length > 0 ? valesArray.join(' | ') : "Sin vales";

            // Texto combinado para poder buscar agentes fácilmente
            const textoBuscador = oficial + " " + asignacionesRadios.join(" ");

            try {
                await addDoc(collection(db, "bitacora_caseta"), {
                    oficial_saliente: oficial,
                    turno: document.getElementById('turno').value,
                    fecha_cierre: document.getElementById('fecha').value,
                    limpieza: document.getElementById('limpieza').value,
                    inventario: {
                        asignacion_radios: asignacionesRadios,
                        radios_presentes: radiosSeleccionados || "Ninguno marcado",
                        llaves_equipo: document.getElementById('llaves').value || "Sin novedad",
                        vales_gasolina: valesRegistrados
                    },
                    accesos: {
                        proveedores_autoridades: document.getElementById('proveedores').value || "Sin novedad"
                    },
                    novedades_generales: novedades,
                    busqueda_agentes: textoBuscador.toLowerCase(),
                    timestamp: Date.now(),
                    fecha_hora_registro: new Date().toLocaleString('es-MX')
                });

                alert("✅ Bitácora guardada exitosamente.");
                location.reload(); 
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("❌ Ocurrió un error. Revisa tu conexión a internet.");
                btn.innerText = "💾 GUARDAR REPORTE DE TURNO"; btn.disabled = false;
            }
        };
    </script>
</body>
</html>
