<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Guardia | Seguridad Integral</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a2a3a; 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
        }

        .header h1 {
            font-size: 24px;
            color: #3498db;
            margin: 0;
            text-transform: uppercase;
        }

        .header p {
            font-size: 14px;
            color: #bdc3c7;
            margin-top: 5px;
        }

        /* Contenedor de botones en cuadrícula */
        .grid-portal {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .btn-portal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 10px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn-portal:active {
            transform: scale(0.95);
        }

        .btn-portal i {
            font-size: 30px;
            margin-bottom: 10px;
        }

        /* Colores específicos para identificar rápido */
        .btn-turno { background: #2980b9; }  /* Azul */
        .btn-acceso { background: #27ae60; } /* Verde */
        .btn-motos { background: #f39c12; }  /* Naranja */
        .btn-ventas { background: #8e44ad; } /* Morado */
        .btn-inicio { 
            background: #34495e; 
            grid-column: span 2; /* Este botón ocupa todo el ancho */
            margin-top: 10px;
        }

        .reloj {
            margin-top: 30px;
            font-size: 18px;
            color: #3498db;
            font-weight: bold;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ Portal Operativo</h1>
        <p>Selecciona la acción a realizar</p>
    </div>

    <div class="grid-portal">
        <a href="cierre_turno.html" class="btn-portal btn-turno">
            <span style="font-size: 30px;">📋</span><br>
            CIERRE DE TURNO
        </a>

        <a href="bitacora_accesos.html" class="btn-portal btn-acceso">
            <span style="font-size: 30px;">📝</span><br>
            REGISTRO ACCESOS
        </a>

        <a href="bitacora_motos.html" class="btn-portal btn-motos">
            <span style="font-size: 30px;">🏍️</span><br>
            REGISTRO MOTOS
        </a>

        <a href="ventas_club.html" class="btn-portal btn-ventas">
            <span style="font-size: 30px;">💰</span><br>
            REGISTRO VENTAS
        </a>

        <a href="index.html" class="btn-portal btn-inicio">
            <span style="font-size: 24px;">🏠</span><br>
            VOLVER AL MENÚ PRINCIPAL
        </a>
    </div>

    <div class="reloj" id="reloj">Cargando hora...</div>

    <script>
        // Reloj en tiempo real para el guardia
        function actualizarReloj() {
            const ahora = new Date();
            const opciones = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('reloj').innerText = ahora.toLocaleTimeString('es-MX', opciones);
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();
    </script>

</body>
</html>
