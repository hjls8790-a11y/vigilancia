<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Operativo | Registro de Guardia</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a2a3a; 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
        }

        .header h1 {
            font-size: 24px;
            color: #3498db;
            margin: 0;
            text-transform: uppercase;
        }

        .header p {
            font-size: 14px;
            color: #e74c3c; /* Rojo suave para indicar que es área de REGISTRO */
            font-weight: bold;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .grid-portal {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .btn-portal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 10px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-portal:active {
            transform: scale(0.95);
        }

        /* Colores de botones operativos */
        .btn-turno { background: #2980b9; }  /* Registro de Turno */
        .btn-acceso { background: #27ae60; } /* Registro de Accesos */
        .btn-motos { background: #f39c12; }  /* Registro de Motos */
        .btn-ventas { background: #8e44ad; } /* Registro de Ventas */
        
        .btn-inicio { 
            background: #34495e; 
            grid-column: span 2; 
            margin-top: 15px;
            border: 1px solid #3498db;
        }

        .reloj {
            margin-top: 30px;
            font-size: 18px;
            color: #3498db;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 10px 25px;
            border-radius: 20px;
            border: 1px solid #34495e;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ Portal Operativo</h1>
        <p>🔴 ÁREA DE REGISTRO Y CAPTURA</p>
    </div>

    <div class="grid-portal">
        <a href="cierre_turno.html" class="btn-portal btn-turno">
            <span style="font-size: 35px;">📝</span><br>
            REGISTRAR<br>CIERRE DE TURNO
        </a>

        <a href="bitacora_accesos.html" class="btn-portal btn-acceso">
            <span style="font-size: 35px;">📥</span><br>
            REGISTRAR<br>ENTRADA / SALIDA
        </a>

        <a href="bitacora_motos.html" class="btn-portal btn-motos">
            <span style="font-size: 35px;">🏍️</span><br>
            REGISTRAR<br>ESTADO DE MOTOS
        </a>

        <a href="ventas_club.html" class="btn-portal btn-ventas">
            <span style="font-size: 35px;">💰</span><br>
            REGISTRAR<br>VENTAS DEL CLUB
        </a>

        <a href="index.html" class="btn-portal btn-inicio">
            <span style="font-size: 24px;">🏠</span><br>
            SALIR AL MENÚ PRINCIPAL
        </a>
    </div>

    <div class="reloj" id="reloj">--:--:--</div>

    <script>
        function actualizarReloj() {
            const ahora = new Date();
            const opciones = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('reloj').innerText = "HORA LOCAL: " + ahora.toLocaleTimeString('es-MX', opciones);
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();
    </script>

</body>
</html>
